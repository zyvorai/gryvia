# ServiceMonitor for all TensorReaper operators.
# namespaceSelector is set to tensorreaper-system because the operator Service
# objects are deployed there. If operators are installed in a different
# namespace, update the namespaceSelector and the Service manifests below
# accordingly.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tensorreaper-operators
  namespace: monitoring
  labels:
    app: tensorreaper
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: tensorreaper
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
  namespaceSelector:
    matchNames:
    - tensorreaper-system
---
# GPU metrics ServiceMonitor targeting the DCGM exporter.
# Assumes dcgm-exporter is deployed in tensorreaper-system.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tensorreaper-gpu-metrics
  namespace: monitoring
  labels:
    app: tensorreaper
spec:
  selector:
    matchLabels:
      app: dcgm-exporter
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics
  namespaceSelector:
    matchNames:
    - tensorreaper-system
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-operator-metrics
  namespace: tensorreaper-system
  labels:
    app: gpu-operator
    app.kubernetes.io/part-of: tensorreaper
spec:
  selector:
    app: gpu-operator
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
---

# ServiceMonitor for all KubeFabric operators.
# namespaceSelector is set to kubefabric-system because the operator Service
# objects are deployed there. If operators are installed in a different
# namespace, update the namespaceSelector and the Service manifests below
# accordingly.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubefabric-operators
  namespace: monitoring
  labels:
    app: kubefabric
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: kubefabric
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
  namespaceSelector:
    matchNames:
    - kubefabric-system
---
# GPU metrics ServiceMonitor targeting the DCGM exporter.
# Assumes dcgm-exporter is deployed in kubefabric-system.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubefabric-gpu-metrics
  namespace: monitoring
  labels:
    app: kubefabric
spec:
  selector:
    matchLabels:
      app: dcgm-exporter
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics
  namespaceSelector:
    matchNames:
    - kubefabric-system
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-operator-metrics
  namespace: kubefabric-system
  labels:
    app: gpu-operator
    app.kubernetes.io/part-of: kubefabric
spec:
  selector:
    app: gpu-operator
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
---

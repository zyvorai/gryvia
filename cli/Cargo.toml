[package]
name = "gryvia"
version = "1.0.0"
edition = "2021"
authors = ["Gryvia Contributors"]
description = "CLI for managing Gryvia GPU clusters"
license = "Apache-2.0"
repository = "https://github.com/zyvorai/gryvia"

[[bin]]
name = "gryvia"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "color", "suggestions", "env"] }
clap_complete = "4.6"
anstyle = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "io-util"] }
kube = { version = "4.2", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
schemars = { version = "1.2", features = ["chrono04"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "2.0"
colored = "3.1"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.18"
dialoguer = "0.12"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

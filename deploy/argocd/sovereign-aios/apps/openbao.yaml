# Add-on openbao; its images come through the nodes' registry mirror (ansible role rke2_hardened).
# The version is the one pinned in deploy/airgap/charts.yaml (scripts/tests/sovereign-aios-airgap.test.sh).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: sovereign-aios
  source:
    repoURL: harbor.sovereign.internal/charts
    chart: openbao
    targetRevision: 0.30.2
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true

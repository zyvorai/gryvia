# Inventory for playbooks/sovereign-aios-rke2.yaml. Keep rke2_token and the registry password in ansible-vault.
[rke2_servers]
cp1.sovereign.internal
cp2.sovereign.internal
cp3.sovereign.internal

[rke2_agents]
gpu1.sovereign.internal rke2_node_labels='["nvidia.com/gpu.present=true"]'
gpu2.sovereign.internal rke2_node_labels='["nvidia.com/gpu.present=true"]'

[all:vars]
rke2_token=REPLACE_WITH_openssl_rand_hex_32
rke2_server_address=api.sovereign.internal
rke2_install_method=airgap
rke2_artifacts_dir=/srv/transfer/rke2
rke2_registry_mirror=harbor.sovereign.internal
rke2_fips=true
rke2_fips_enable_os=true

---
# Install Gryvia Operators

- name: Install Helm
  block:
    - name: Download Helm install script
      get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get_helm.sh
        mode: '0755'

    - name: Install Helm
      shell: /tmp/get_helm.sh
      args:
        creates: /usr/local/bin/helm

- name: Create gryvia-system namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: gryvia-system

- name: Install Gryvia CRDs
  kubernetes.core.k8s:
    state: present
    src: "{{ item }}"
  loop:
    - ../../../crds/gryviagpunode.yaml
    - ../../../crds/gryviaaijob.yaml
    - ../../../crds/gryviastorage.yaml
    - ../../../crds/gryvianetwork.yaml
    - ../../../crds/gryviaquota.yaml

- name: Install Gryvia core via Helm
  kubernetes.core.helm:
    name: gryvia
    chart_ref: ../../../helm/gryvia
    release_namespace: gryvia-system
    create_namespace: yes
    values:
      gpuOperator:
        enabled: true
        replicas: 1
      aiOperator:
        enabled: true
        replicas: 1
      nvidiaDevicePlugin:
        enabled: true
      dcgmExporter:
        enabled: true
      monitoring:
        enabled: true

- name: Wait for operators to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: gryvia-system
    name: "{{ item }}"
    wait: yes
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
  loop:
    - gryvia-gpu-operator
    - gryvia-ai-operator

- name: Install observability stack
  kubernetes.core.helm:
    name: gryvia-observability
    chart_ref: ../../../helm/observability
    release_namespace: gryvia-system
    create_namespace: yes
    values:
      prometheus:
        enabled: true
      grafana:
        enabled: true

- name: Display installation status
  debug:
    msg: "Gryvia has been successfully installed!"

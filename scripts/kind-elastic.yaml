# Four-node kind cluster for .github/workflows/e2e-elastic.yml: Gryvia and the system pods run on the untainted
# worker; the two training workers are tainted from the start so that losing one only takes a training pod with it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
    labels: {e2e.gryvia.io/train: "true"}
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints: [{key: e2e.gryvia.io/train, value: "true", effect: NoSchedule}]
  - role: worker
    labels: {e2e.gryvia.io/train: "true"}
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints: [{key: e2e.gryvia.io/train, value: "true", effect: NoSchedule}]

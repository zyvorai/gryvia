---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: gryvianodefabrics.gryvia.io
spec:
  group: gryvia.io
  names:
    kind: GryviaNodeFabric
    listKind: GryviaNodeFabricList
    plural: gryvianodefabrics
    shortNames:
    - gnf
    singular: gryvianodefabric
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .spec.scoreDelta
      name: Delta
      type: number
    - jsonPath: .spec.measuredAt
      name: Measured
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GryviaNodeFabric is the Schema for the gryvianodefabrics API: one object per
          node (metadata.name = node name), written by that node's collector.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GryviaNodeFabricSpec is the fabric health of ONE node as measured by the
              eBPF collector running on it. The collector is the only writer (opt-in flag
              -publish-node-fabric); the ai-operator only reads it, and only when
              -fabric-aware-scheduling is on. The whole object is advisory: a reader must
              ignore it once measuredAt + ttlSeconds has passed.
            properties:
              expiresAt:
                description: ExpiresAt is measuredAt + ttlSeconds, for humans; readers
                  recompute it
                format: date-time
                type: string
              measuredAt:
                description: MeasuredAt is when the collector computed this value
                format: date-time
                type: string
              nodeName:
                description: NodeName is the Kubernetes node the measurement is about
                  (equals metadata.name)
                type: string
              reasons:
                description: Reasons are the signals that contribute most to scoreDelta
                  (bounded, most significant first)
                items:
                  type: string
                maxItems: 8
                type: array
              scoreDelta:
                description: ScoreDelta is the fabric penalty in [0,1] (0 = healthy,
                  1 = worst)
                maximum: 1
                minimum: 0
                type: number
              ttlSeconds:
                default: 300
                description: TTLSeconds is how long after measuredAt the value may
                  be used (default 300)
                format: int32
                maximum: 86400
                minimum: 1
                type: integer
            required:
            - measuredAt
            - nodeName
            - scoreDelta
            type: object
        type: object
    served: true
    storage: true
    subresources: {}

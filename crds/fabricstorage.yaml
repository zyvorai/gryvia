apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricstorages.kubefabric.ai
spec:
  group: kubefabric.ai
  names:
    kind: FabricStorage
    listKind: FabricStorageList
    plural: fabricstorages
    singular: fabricstorage
    shortNames:
      - fst
      - storage
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - backend
                - capacity
              properties:
                backend:
                  type: string
                  description: "Storage backend type"
                  enum:
                    - vast
                    - weka
                    - ddn
                    - lustre
                    - beegfs
                    - ceph
                capacity:
                  type: string
                  description: "Total storage capacity (e.g., 100Ti, 1Pi)"
                iops:
                  type: string
                  description: "Expected IOPS (e.g., 1M, 10M)"
                throughput:
                  type: string
                  description: "Expected throughput (e.g., 40GB/s, 100GB/s)"
                rdma:
                  type: boolean
                  description: "RDMA support enabled"
                  default: false
                protocol:
                  type: string
                  description: "Storage protocol"
                  enum:
                    - NFS
                    - SMB
                    - S3
                    - NVMe-oF
                    - iSCSI
                  default: NFS
                endpoint:
                  type: string
                  description: "Storage cluster endpoint"
                mountOptions:
                  type: array
                  items:
                    type: string
                  description: "Mount options"
                credentials:
                  type: object
                  description: "Authentication credentials"
                  properties:
                    secretName:
                      type: string
                      description: "Secret containing credentials"
                    secretNamespace:
                      type: string
                      description: "Namespace of the secret"
                      default: kubefabric-system
                storageClass:
                  type: object
                  description: "StorageClass configuration"
                  properties:
                    name:
                      type: string
                    reclaimPolicy:
                      type: string
                      enum:
                        - Retain
                        - Delete
                      default: Delete
                    volumeBindingMode:
                      type: string
                      enum:
                        - Immediate
                        - WaitForFirstConsumer
                      default: WaitForFirstConsumer
                    allowVolumeExpansion:
                      type: boolean
                      default: true
                    parameters:
                      type: object
                      additionalProperties:
                        type: string
                quotas:
                  type: object
                  description: "Storage quotas per namespace"
                  additionalProperties:
                    type: string
                performance:
                  type: object
                  description: "Performance tuning parameters"
                  properties:
                    tier:
                      type: string
                      enum:
                        - hot
                        - warm
                        - cold
                      default: hot
                    caching:
                      type: boolean
                      default: true
                    compression:
                      type: boolean
                      default: false
                    deduplication:
                      type: boolean
                      default: false
                    encryption:
                      type: boolean
                      default: false
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Current phase"
                  enum:
                    - Pending
                    - Configuring
                    - Ready
                    - Degraded
                    - Failed
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                totalCapacity:
                  type: string
                usedCapacity:
                  type: string
                availableCapacity:
                  type: string
                currentIOPS:
                  type: string
                currentThroughput:
                  type: string
                storageClassCreated:
                  type: boolean
                csiDriverInstalled:
                  type: boolean
                lastHealthCheck:
                  type: string
                  format: date-time
                metrics:
                  type: object
                  properties:
                    readLatency:
                      type: string
                      description: "Average read latency"
                    writeLatency:
                      type: string
                      description: "Average write latency"
                    utilization:
                      type: integer
                      description: "Storage utilization %"
                      minimum: 0
                      maximum: 100
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Backend
          type: string
          jsonPath: .spec.backend
        - name: Capacity
          type: string
          jsonPath: .spec.capacity
        - name: RDMA
          type: boolean
          jsonPath: .spec.rdma
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

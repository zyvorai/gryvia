                type: string
              utilizationMetrics:
                description: UtilizationMetrics holds utilization data
                properties:
                  jobsRun:
                    description: JobsRun is the number of jobs run during the reservation
                    format: int32
                    type: integer
                  totalReservedTime:
                    description: TotalReservedTime is the total reserved time
                    type: string
                  totalUsedTime:
                    description: TotalUsedTime is the total used time
                    type: string
                  utilizationPercent:
                    description: UtilizationPercent is the utilization percentage
                    type: number
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:

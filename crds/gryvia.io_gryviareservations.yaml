spec:
  group: gryvia.io
  names:
    kind: GryviaReservation
    listKind: GryviaReservationList
    plural: gryviareservations
    singular: gryviareservation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.owner.name
      name: Owner
      type: string
    - jsonPath: .spec.resources.gpuCount
      name: GPUs
      type: integer
    - jsonPath: .spec.resources.gpuType
      name: GPU-Type
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.actualStartTime

      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GryviaReservation is the Schema for the gryviareservations API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GryviaReservationSpec defines the desired state of GryviaReservation
            properties:
              billing:
                description: Billing defines cost and billing options
                properties:
                  chargeWhenIdle:
                    description: ChargeWhenIdle charges for reserved time even if
                      not used
                    type: boolean
                  discount:
                    description: Discount is the discount percentage for reservations
                    type: number
                  prepaid:
                    description: Prepaid indicates upfront payment
                    type: boolean
                type: object
              guarantees:
                description: Guarantees defines reservation guarantees
                properties:
                  exclusive:
                    description: Exclusive means reserved resources are exclusive
                      to owner
                    type: boolean
                  preemptible:
                    description: Preemptible means the reservation can be preempted
                    type: boolean
                  sla:
                    description: SLA defines service level agreement
                    properties:
                      availability:
                        description: Availability is the guaranteed availability percentage
                        type: number
                      maxQueueTime:
                        description: MaxQueueTime is the maximum time to wait for
                          reserved resources
                        type: string
                    type: object
                type: object
              notifications:
                description: Notifications defines notification settings
                properties:
                  beforeExpiry:
                    description: BeforeExpiry notifies before expiry
                    type: string
                  onExpiry:
                    description: OnExpiry notifies on expiry
                    type: boolean
                  onJobsFinish:
                    description: OnJobsFinish notifies when all jobs finish
                    type: boolean
                type: object
              owner:
                description: Owner defines who can use this reservation
                properties:
                  name:
                    description: Name is the owner name
                    type: string
                  type:
                    description: Type is the owner type (user, team, project, namespace)
                    type: string
                required:
                - name
                - type
                type: object
              resources:
                description: Resources defines what to reserve
                properties:
                  gpuCount:
                    description: GpuCount is the number of GPUs to reserve
                    format: int32
                    type: integer
                  gpuType:
                    description: GpuType is the GPU model to reserve
                    type: string
                  nodes:
                    description: Nodes lists specific nodes to reserve
                    items:
                      type: string
                    type: array
                type: object
              schedule:
                description: Schedule defines when the reservation is active
                properties:
                  autoExtend:
                    description: AutoExtend extends reservation if jobs are still
                      running
                    type: boolean
                  endTime:
                    description: EndTime is the scheduled end time
                    format: date-time
                    type: string
                  recurrence:
                    description: Recurrence defines recurring schedule
                    properties:
                      cron:
                        description: |-
                          Cron is a five-field cron expression (minute hour day-of-month month day-of-week,
                          UTC): each fire time opens a reservation window. Names and macros are not supported.
                        type: string
                      duration:
                        description: Duration is how long each window lasts, e.g.
                          8h, 90m or 2d
                        type: string
                    type: object
                  startTime:
                    description: StartTime is the scheduled start time
                    format: date-time
                    type: string
                  type:
                    description: |-
                      Type is the schedule type: immediate (active now until endTime, if set), scheduled
                      (active from startTime until endTime) or recurring (active during each window that
                      starts at a recurrence.cron fire time and lasts recurrence.duration, until endTime)
                    type: string
                required:
                - type
                type: object

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: fabricaudits.gryvia.io
spec:
  group: gryvia.io
  names:
    kind: FabricAudit
    listKind: FabricAuditList
    plural: fabricaudits
    singular: fabricaudit
  scope: Cluster
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: FabricAudit is the Schema for the fabricaudits API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FabricAuditSpec defines the desired state of FabricAudit
            properties:
              anomalyDetection:
                description: AnomalyDetection defines anomaly detection rules
                properties:
                  enabled:
                    description: Enabled enables anomaly detection
                    type: boolean
                  rules:
                    description: Rules defines anomaly detection rules
                    items:
                      description: AnomalyRule defines an anomaly detection rule
                      properties:
                        action:
                          description: Action is the action to take (log, alert, block)
                          type: string
                        condition:
                          description: Condition is the rule condition expression
                          type: string
                        name:
                          description: Name is the rule name
                          type: string
                        severity:
                          description: Severity is the rule severity (low, medium,
                            high, critical)
                          type: string
                      type: object
                    type: array
                type: object
              compliance:
                description: Compliance defines compliance framework requirements
                properties:
                  approvalRequired:
                    description: ApprovalRequired defines what needs approval
                    properties:
                      highCostJobs:
                        type: boolean
                      productionDeployments:
                        type: boolean
                      sensitiveJobs:
                        type: boolean
                    type: object
                  dataClassification:
                    description: DataClassification is the data classification level
                    type: string
                  frameworks:
                    description: Frameworks is the list of compliance frameworks (SOC2,
                      HIPAA, GDPR, etc.)
                    items:
                      type: string
                    type: array
                type: object
              events:
                description: Events defines which events to audit
                properties:
                  budgetExceeded:
                    type: boolean
                  configurationChanges:
                    type: boolean
                  jobCreated:
                    type: boolean
                  jobDeleted:
                    type: boolean
                  jobModified:
                    type: boolean
                  quotaExceeded:
                    type: boolean
                  resourceAccessDenied:
                    type: boolean
                  roleChanges:
                    type: boolean
                  sensitiveDataAccess:
                    type: boolean
                  userAuthentication:
                    type: boolean
                type: object
              reporting:
                description: Reporting defines automated report generation
                properties:
                  enabled:
                    description: Enabled enables report generation
                    type: boolean
                  format:
                    description: Format is the report format (pdf, csv, json, html)
                    type: string
                  recipients:
                    description: Recipients is the list of report recipients
                    items:
                      type: string
                    type: array
                  schedule:
                    description: Schedule is the cron schedule for reports
                    type: string
                type: object
              retention:
                description: Retention defines how long to keep audit records
                properties:
                  archival:
                    description: Archival defines archival configuration
                    properties:
                      bucket:
                        description: Bucket is the storage bucket
                        type: string
                      compressionEnabled:
                        description: CompressionEnabled enables compression
                        type: boolean
                      destination:
                        description: Destination is the archive storage type (s3,
                          gcs, azure-blob, glacier)
                        type: string
                      enabled:
                        description: Enabled enables archival
                        type: boolean
                    type: object
                  duration:
                    description: Duration is how long to retain audit logs (e.g.,
                      1y, 7y)
                    type: string
                type: object
              scope:
                description: Scope defines what this audit covers
                properties:
                  name:
                    description: Name is the name of the scoped resource
                    type: string
                  type:
                    description: Type is the scope type (cluster, namespace, team,
                      user, job)
                    type: string
                type: object
            type: object
          status:
            description: FabricAuditStatus defines the observed state of FabricAudit
            properties:
              auditEntries:
                description: AuditEntries is a rolling buffer of recent audit entries
                items:
                  description: AuditEntry represents a single audit log entry
                  properties:
                    action:
                      description: Action performed (create, update, delete, access)
                      type: string
                    details:
                      description: Details provides additional context
                      type: string
                    namespace:
                      description: Namespace of the resource
                      type: string
                    resourceName:
                      description: ResourceName is the name of the resource affected
                      type: string
                    resourceType:
                      description: ResourceType is the type of resource affected
                      type: string
                    result:
                      description: Result of the action (success, denied, error)
                      type: string
                    timestamp:
                      description: Timestamp of the event
                      format: date-time
                      type: string
                    user:
                      description: User who performed the action
                      type: string
                  required:
                  - action
                  - resourceName
                  - resourceType
                  - result
                  - timestamp
                  type: object
                type: array
              complianceScore:
                description: ComplianceScore is the overall compliance score 0-100
                type: number
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastAuditTime:
                description: LastAuditTime is the timestamp of the last audit event
                format: date-time
                type: string
              lastReport:
                description: LastReport tracks the last generated report
                properties:
                  generatedAt:
                    description: GeneratedAt is when the report was generated
                    format: date-time
                    type: string
                  location:
                    description: Location is where the report is stored
                    type: string
                type: object
              totalEvents:
                description: TotalEvents is the total number of audit events captured
                type: integer
              violations:
                description: Violations is the list of recent compliance violations
                items:
                  description: AuditViolation represents a compliance violation
                  properties:
                    description:
                      description: Description of the violation
                      type: string
                    remediated:
                      description: Remediated indicates if the violation has been
                        fixed
                      type: boolean
                    severity:
                      description: Severity is the violation severity
                      type: string
                    timestamp:
                      description: Timestamp of the violation
                      format: date-time
                      type: string
                    type:
                      description: Type is the violation type
                      type: string
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tensorreaper-ui
  namespace: tensorreaper
  labels:
    app: tensorreaper-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tensorreaper-ui
  template:
    metadata:
      labels:
        app: tensorreaper-ui
    spec:
      serviceAccountName: tensorreaper-ui
      containers:
      - name: ui
        image: tensorreaper/ui:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: nginx-tmp
          mountPath: /tmp
      volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: nginx-tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tensorreaper-ui
  namespace: tensorreaper
  labels:
    app: tensorreaper-ui
spec:
  type: ClusterIP
  selector:
    app: tensorreaper-ui
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tensorreaper-ui
  namespace: tensorreaper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tensorreaper-ui
rules:
- apiGroups: ["tensorreaper.ai"]
  resources: ["fabricaijobs", "fabricquotas", "fabricgpunodes", "fabricstorages", "fabricnetworks"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes", "pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tensorreaper-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tensorreaper-ui
subjects:
- kind: ServiceAccount
  name: tensorreaper-ui
  namespace: tensorreaper
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tensorreaper-ui
  namespace: tensorreaper
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - tensorreaper.example.com
    secretName: tensorreaper-ui-tls
  rules:
  - host: tensorreaper.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tensorreaper-ui
            port:
              number: 80

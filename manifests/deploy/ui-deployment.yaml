apiVersion: apps/v1
kind: Deployment
metadata:
  name: gryvia-ui
  namespace: gryvia-system
  labels:
    app: gryvia-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gryvia-ui
  template:
    metadata:
      labels:
        app: gryvia-ui
    spec:
      serviceAccountName: gryvia-ui
      initContainers:
      - name: gen-cert
        image: alpine/openssl:3.3.2
        command: ["/bin/sh", "-c"]
        args:
        - |
          # Prefer the shared self-signed pair from the gryvia-tls Secret (created by the deploy
          # script) so every pod and restart serves the same certificate; otherwise mint one.
          if [ -s /tls-src/tls.crt ] && [ -s /tls-src/tls.key ]; then
            cp /tls-src/tls.crt /tls-src/tls.key /tls/
          else
            openssl req -x509 -nodes -days 3650 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -keyout /tls/tls.key -out /tls/tls.crt -subj "/CN=gryvia-ui/O=Gryvia" -addext "subjectAltName=DNS:gryvia-ui,DNS:gryvia-ui.gryvia-system.svc,DNS:localhost,IP:127.0.0.1,IP:$HOST_IP"
          fi
          chown 101:101 /tls/tls.key /tls/tls.crt
          chmod 600 /tls/tls.key
        env:
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
        volumeMounts:
        - name: tls
          mountPath: /tls
        - name: tls-src
          mountPath: /tls-src
          readOnly: true
      containers:
      - name: ui
        image: gryvia/ui:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8443
          name: https
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: https
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: https
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: nginx-tmp
          mountPath: /tmp
        - name: tls
          mountPath: /tls
          readOnly: true
      volumes:
      - name: tls
        emptyDir: {}
      - name: tls-src
        secret:
          secretName: gryvia-tls
          optional: true
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: nginx-tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gryvia-ui
  namespace: gryvia-system
  labels:
    app: gryvia-ui
spec:
  type: ClusterIP
  selector:
    app: gryvia-ui
  ports:
  - port: 443
    targetPort: https
    protocol: TCP
    name: https
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gryvia-ui
  namespace: gryvia-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gryvia-ui
rules:
- apiGroups: ["gryvia.io"]
  resources: ["fabricaijobs", "fabricquotas", "fabricgpunodes", "fabricstorages", "fabricnetworks"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes", "pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gryvia-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gryvia-ui
subjects:
- kind: ServiceAccount
  name: gryvia-ui
  namespace: gryvia-system
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gryvia-ui
  namespace: gryvia-system
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - gryvia.example.com
    secretName: gryvia-ui-tls
  rules:
  - host: gryvia.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gryvia-ui
            port:
              number: 443

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gryvia-api-gateway
  namespace: gryvia-system
  labels:
    app: gryvia-api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gryvia-api-gateway
  template:
    metadata:
      labels:
        app: gryvia-api-gateway
    spec:
      serviceAccountName: gryvia-api-gateway
      containers:
      - name: api-gateway
        image: gryvia/api-gateway:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PROMETHEUS_URL
          valueFrom:
            configMapKeyRef:
              name: gryvia-api-gateway-config
              key: prometheus-url
              optional: true
        - name: GRYVIA_JOB_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gryvia-api-gateway
  namespace: gryvia-system
  labels:
    app: gryvia-api-gateway
spec:
  type: ClusterIP
  selector:
    app: gryvia-api-gateway
  ports:
  - port: 8080
    targetPort: http
    protocol: TCP
    name: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gryvia-api-gateway
  namespace: gryvia-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gryvia-api-gateway
rules:
# Read every kind the gateway serves.
- apiGroups: ["gryvia.io"]
  resources:
  - fabricaijobs
  - fabricquotas
  - fabricgpunodes
  - fabricstorages
  - fabricnetworks
  - fabricworkspaces
  - fabricmodelregistries
  - fabricinferenceservices
  - fabricworkflows
  - fabricautotuners
  - fabricflowpolicies
  - fabrictrafficinsights
  - fabricservicegraphs
  - fabricnetworkanomalies
  - fabricnetworkcosts
  - fabrictracesessions
  - fabricsecuritypolicies
  - fabrictraininginsights
  - fabricgpumemoryoptimizers
  verbs: ["get", "list", "watch"]
# Write only the kinds the API creates, deletes or updates.
- apiGroups: ["gryvia.io"]
  resources:
  - fabricaijobs
  - fabricworkspaces
  - fabricinferenceservices
  - fabricworkflows
  - fabricautotuners
  - fabricflowpolicies
  - fabrictracesessions
  - fabricsecuritypolicies
  - fabricmodelregistries
  verbs: ["create", "delete", "patch"]
- apiGroups: [""]
  resources: ["nodes", "pods", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gryvia-api-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gryvia-api-gateway
subjects:
- kind: ServiceAccount
  name: gryvia-api-gateway
  namespace: gryvia-system

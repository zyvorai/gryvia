---
# Compliance and Audit Trail
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricaudits.tensorreaper.ai
spec:
  group: tensorreaper.ai
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Audit scope
                scope:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [cluster, namespace, team, user, job]
                    name:
                      type: string

                # Audit retention
                retention:
                  type: object
                  properties:
                    duration:
                      type: string
                      description: "How long to retain audit logs (e.g., 1y, 7y)"
                      default: "7y"

                    # Archive old logs
                    archival:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                        destination:
                          type: string
                          enum: [s3, gcs, azure-blob, glacier]
                        bucket:
                          type: string
                        compressionEnabled:
                          type: boolean
                          default: true

                # What to audit
                events:
                  type: object
                  properties:
                    jobCreated:
                      type: boolean
                      default: true
                    jobModified:
                      type: boolean
                      default: true
                    jobDeleted:
                      type: boolean
                      default: true
                    resourceAccessDenied:
                      type: boolean
                      default: true
                    quotaExceeded:
                      type: boolean
                      default: true
                    budgetExceeded:
                      type: boolean
                      default: true
                    sensitiveDataAccess:
                      type: boolean
                      default: true
                    configurationChanges:
                      type: boolean
                      default: true
                    userAuthentication:
                      type: boolean
                      default: true
                    roleChanges:
                      type: boolean
                      default: true

                # Compliance frameworks
                compliance:
                  type: object
                  properties:
                    frameworks:
                      type: array
                      items:
                        type: string
                        enum: [SOC2, HIPAA, GDPR, PCI-DSS, FedRAMP, ISO27001]

                    # Data classification
                    dataClassification:
                      type: string
                      enum: [public, internal, confidential, restricted]

                    # Required approvals
                    approvalRequired:
                      type: object
                      properties:
                        sensitiveJobs:
                          type: boolean
                          default: false
                        highCostJobs:
                          type: boolean
                          default: false
                        productionDeployments:
                          type: boolean
                          default: false

                # Automated reports
                reporting:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true

                    schedule:
                      type: string
                      description: "Cron schedule for reports"
                      default: "0 0 1 * *"  # Monthly

                    recipients:
                      type: array
                      items:
                        type: string

                    format:
                      type: string
                      enum: [pdf, csv, json, html]
                      default: pdf

                # Anomaly detection
                anomalyDetection:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false

                    rules:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          condition:
                            type: string
                          severity:
                            type: string
                            enum: [low, medium, high, critical]
                          action:
                            type: string
                            enum: [log, alert, block]

            status:
              type: object
              properties:
                totalEvents:
                  type: integer

                lastAuditTime:
                  type: string
                  format: date-time

                complianceScore:
                  type: number
                  description: "Overall compliance score 0-100"

                violations:
                  type: array
                  items:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                      type:
                        type: string
                      severity:
                        type: string
                      description:
                        type: string
                      remediated:
                        type: boolean

                lastReport:
                  type: object
                  properties:
                    generatedAt:
                      type: string
                      format: date-time
                    location:
                      type: string

      additionalPrinterColumns:
        - name: Scope
          type: string
          jsonPath: .spec.scope.type
        - name: Frameworks
          type: string
          jsonPath: .spec.compliance.frameworks
        - name: Total-Events
          type: integer
          jsonPath: .status.totalEvents
        - name: Compliance-Score
          type: string
          jsonPath: .status.complianceScore
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Cluster
  names:
    plural: fabricaudits
    singular: fabricaudit
    kind: FabricAudit
    shortNames:
      - faudit

---
# Example: SOC2 Compliance Audit
apiVersion: tensorreaper.ai/v1
kind: FabricAudit
metadata:
  name: soc2-audit
spec:
  scope:
    type: cluster

  retention:
    duration: 7y  # SOC2 requires 7 years
    archival:
      enabled: true
      destination: s3
      bucket: compliance-archives
      compressionEnabled: true

  events:
    jobCreated: true
    jobModified: true
    jobDeleted: true
    resourceAccessDenied: true
    quotaExceeded: true
    budgetExceeded: true
    sensitiveDataAccess: true
    configurationChanges: true
    userAuthentication: true
    roleChanges: true

  compliance:
    frameworks: [SOC2, ISO27001]
    dataClassification: confidential
    approvalRequired:
      sensitiveJobs: true
      highCostJobs: true
      productionDeployments: true

  reporting:
    enabled: true
    schedule: "0 0 1 * *"  # Monthly
    recipients:
      - compliance@company.com
      - security@company.com
    format: pdf

  anomalyDetection:
    enabled: true
    rules:
      - name: unusual-gpu-usage
        condition: "gpu_hours_per_day > avg(gpu_hours_per_day, 30d) * 3"
        severity: high
        action: alert

      - name: off-hours-access
        condition: "hour(timestamp) < 6 OR hour(timestamp) > 20"
        severity: medium
        action: log

      - name: multiple-failed-auth
        condition: "failed_auth_attempts > 5 in 1h"
        severity: critical
        action: block

---
# Example: HIPAA Compliance Audit
apiVersion: tensorreaper.ai/v1
kind: FabricAudit
metadata:
  name: hipaa-audit
spec:
  scope:
    type: namespace
    name: healthcare-ml

  retention:
    duration: 6y  # HIPAA requires 6 years
    archival:
      enabled: true
      destination: glacier  # Use Glacier for cost savings
      bucket: hipaa-archives

  events:
    jobCreated: true
    jobModified: true
    jobDeleted: true
    resourceAccessDenied: true
    sensitiveDataAccess: true  # Critical for HIPAA
    userAuthentication: true
    roleChanges: true

  compliance:
    frameworks: [HIPAA]
    dataClassification: restricted
    approvalRequired:
      sensitiveJobs: true
      productionDeployments: true

  reporting:
    enabled: true
    schedule: "0 0 1 */3 *"  # Quarterly
    recipients:
      - hipaa-officer@company.com
      - compliance@company.com
    format: pdf

---
# Example: Team-Specific Audit
apiVersion: tensorreaper.ai/v1
kind: FabricAudit
metadata:
  name: ml-research-audit
spec:
  scope:
    type: team
    name: ml-research

  retention:
    duration: 1y
    archival:
      enabled: false

  events:
    jobCreated: true
    jobModified: true
    quotaExceeded: true
    budgetExceeded: true

  compliance:
    frameworks: []
    dataClassification: internal

  reporting:
    enabled: true
    schedule: "0 0 1 * *"  # Monthly
    recipients:
      - ml-team-lead@company.com
    format: csv

---
# Audit Event Example
apiVersion: tensorreaper.ai/v1
kind: FabricAuditEvent
metadata:
  name: job-created-event-12345
spec:
  timestamp: "2024-01-21T14:30:00Z"
  eventType: job-created

  actor:
    type: user
    name: alice
    ipAddress: 192.168.1.100
    userAgent: "kfctl/1.0.0"

  resource:
    type: fabricaijob
    name: training-job-42
    namespace: ml-research

  action:
    type: create
    result: success

  details:
    framework: pytorch
    gpuType: A100-80G
    gpuCount: 32
    estimatedCost: 768.00
    dataClassification: internal

  compliance:
    frameworks: [SOC2]
    approvalRequired: false
    approved: true
    approver: null

---
# Audit Report Example
apiVersion: tensorreaper.ai/v1
kind: FabricAuditReport
metadata:
  name: soc2-report-2024-01
spec:
  period:
    start: "2024-01-01T00:00:00Z"
    end: "2024-01-31T23:59:59Z"

  framework: SOC2

  summary:
    totalEvents: 12458
    violations: 3
    complianceScore: 98.5

  eventBreakdown:
    jobCreated: 342
    jobModified: 87
    jobDeleted: 45
    resourceAccessDenied: 12
    quotaExceeded: 28
    budgetExceeded: 3
    sensitiveDataAccess: 125
    configurationChanges: 18
    userAuthentication: 11450
    roleChanges: 5

  violations:
    - timestamp: "2024-01-15T10:30:00Z"
      type: budget-exceeded
      severity: medium
      description: "Team ml-research exceeded monthly budget by 5%"
      remediation: "Budget increased, notification sent"
      remediated: true

    - timestamp: "2024-01-20T14:00:00Z"
      type: access-denied
      severity: low
      description: "User bob attempted to access restricted dataset"
      remediation: "Access request denied, logged"
      remediated: true

  recommendations:
    - "Enable MFA for all users accessing sensitive data"
    - "Review budget allocations for Q2"
    - "Update data classification for 3 datasets"

---
# CLI Usage Examples
#
# List audit policies:
#   kfctl audit list
#
# Output:
# NAME            SCOPE      FRAMEWORKS      EVENTS   COMPLIANCE  AGE
# soc2-audit      cluster    SOC2,ISO27001   12458    98.5%       30d
# hipaa-audit     namespace  HIPAA           3247     100%        30d
# ml-research     team       -               892      N/A         30d
#
# View audit trail:
#   kfctl audit trail --scope team --name ml-research --last 7d
#
# Output:
# Audit Trail: ml-research (Last 7 days)
#
# TIMESTAMP            USER    EVENT          RESOURCE              RESULT
# 2024-01-21 14:30    alice   job-created    training-job-42       success
# 2024-01-21 12:00    bob     job-modified   training-job-41       success
# 2024-01-21 10:15    alice   quota-exceeded -                     warning
# 2024-01-20 16:45    charlie job-deleted    inference-job-10      success
#
# Generate compliance report:
#   kfctl audit report --framework SOC2 --month 2024-01 --output report.pdf
#
# Search audit logs:
#   kfctl audit search --user alice --event job-created --last 30d
#
# Check compliance:
#   kfctl audit compliance-check --framework HIPAA
#
# Output:
# HIPAA Compliance Check
#
# Status: COMPLIANT
# Score: 100%
#
# Requirements:
# ✓ Audit logs retained for 6+ years
# ✓ All PHI access logged
# ✓ User authentication tracked
# ✓ Encryption at rest enabled
# ✓ Encryption in transit enabled
# ✓ Access controls verified
# ✓ Regular backups configured
#
# Recommendations:
# • Schedule quarterly compliance review
# • Update incident response plan
#
# Export audit logs:
#   kfctl audit export --start 2024-01-01 --end 2024-01-31 --format json
#
# View violations:
#   kfctl audit violations --severity high --unresolved
#
# Acknowledge violation:
#   kfctl audit violation ack violation-12345 --comment "Budget adjusted"
#
# Anomaly detection:
#   kfctl audit anomalies --last 7d
#
# Output:
# Detected Anomalies (Last 7 days)
#
# SEVERITY  TYPE                COUNT  DESCRIPTION
# High      unusual-gpu-usage   2      GPU usage 4x above normal
# Medium    off-hours-access    15     Access during off-hours
# Low       failed-auth         3      Failed authentication attempts

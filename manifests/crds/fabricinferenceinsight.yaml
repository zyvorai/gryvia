apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricinferenceinsights.tensorreaper.ai
spec:
  group: tensorreaper.ai
  names:
    kind: FabricInferenceInsight
    listKind: FabricInferenceInsightList
    plural: fabricinferenceinsights
    singular: fabricinferenceinsight
    shortNames: [fii]
    categories: [tensorreaper, all]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                targetService:
                  type: string
                  description: "Name of the FabricInferenceService to analyze"
                analysisWindow:
                  type: string
                  description: "Time window for analysis (e.g., 5m, 1h)"
            status:
              type: object
              properties:
                phase:
                  type: string
                latencyBreakdown:
                  type: object
                  properties:
                    dnsNs:
                      type: integer
                      format: int64
                    tcpConnectNs:
                      type: integer
                      format: int64
                    tlsHandshakeNs:
                      type: integer
                      format: int64
                    gpuQueueNs:
                      type: integer
                      format: int64
                    gpuExecNs:
                      type: integer
                      format: int64
                    postprocessNs:
                      type: integer
                      format: int64
                    totalNs:
                      type: integer
                      format: int64
                p50TotalNs:
                  type: integer
                  format: int64
                p95TotalNs:
                  type: integer
                  format: int64
                p99TotalNs:
                  type: integer
                  format: int64
                bottleneck:
                  type: string
                lastAnalysis:
                  type: string
                  format: date-time
      subresources:
        status: {}

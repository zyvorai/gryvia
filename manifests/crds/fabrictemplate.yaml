---
# Job Templates for Reusable Configurations
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabrictemplates.kubefabric.ai
spec:
  group: kubefabric.ai
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Template metadata
                description:
                  type: string
                category:
                  type: string
                  enum: [training, inference, development, benchmark]
                tags:
                  type: array
                  items:
                    type: string

                # Default job configuration
                defaults:
                  type: object
                  properties:
                    framework:
                      type: string
                    resources:
                      type: object
                      properties:
                        gpuType:
                          type: string
                        gpuCount:
                          type: integer
                        memory:
                          type: string
                        cpu:
                          type: integer
                    image:
                      type: string
                    command:
                      type: array
                      items:
                        type: string
                    env:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          value:
                            type: string
                    volumes:
                      type: array
                      items:
                        type: object

                # Parameters that can be customized
                parameters:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                      type:
                        type: string
                        enum: [string, integer, number, boolean, array]
                      default:
                        type: string
                      required:
                        type: boolean
                      validation:
                        type: object
                        properties:
                          min:
                            type: number
                          max:
                            type: number
                          pattern:
                            type: string
                          enum:
                            type: array
                            items:
                              type: string

      additionalPrinterColumns:
        - name: Category
          type: string
          jsonPath: .spec.category
        - name: Description
          type: string
          jsonPath: .spec.description
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Cluster
  names:
    plural: fabrictemplates
    singular: fabrictemplate
    kind: FabricTemplate
    shortNames:
      - ftpl
      - ftmpl

---
# Example: PyTorch DDP Training Template
apiVersion: kubefabric.ai/v1
kind: FabricTemplate
metadata:
  name: pytorch-ddp-training
spec:
  description: "Distributed PyTorch training with DDP"
  category: training
  tags: [pytorch, distributed, ddp]

  defaults:
    framework: pytorch
    resources:
      gpuType: A100-80G
      gpuCount: 8
      memory: 512Gi
      cpu: 64
    image: nvcr.io/nvidia/pytorch:24.01-py3

    command:
      - torchrun
      - --nproc_per_node={{ .gpuCount }}
      - --nnodes={{ .worldSize | div .gpuCount }}
      - train.py
      - --data={{ .dataPath }}
      - --output={{ .outputPath }}
      - --batch-size={{ .batchSize }}
      - --epochs={{ .epochs }}

    env:
      - name: NCCL_DEBUG
        value: INFO
      - name: PYTORCH_CUDA_ALLOC_CONF
        value: max_split_size_mb:512

    volumes:
      - name: data
        mountPath: /data
        storageClass: vast-data
      - name: output
        mountPath: /output
        storageClass: vast-data

  parameters:
    - name: dataPath
      description: "Path to training data"
      type: string
      required: true

    - name: outputPath
      description: "Path for checkpoints and outputs"
      type: string
      default: "/output"

    - name: batchSize
      description: "Batch size per GPU"
      type: integer
      default: "32"
      validation:
        min: 1
        max: 512

    - name: epochs
      description: "Number of training epochs"
      type: integer
      default: "100"
      validation:
        min: 1
        max: 1000

    - name: worldSize
      description: "Total number of GPUs across all nodes"
      type: integer
      default: "8"
      validation:
        min: 1
        max: 512

---
# Example: LLM Inference Template
apiVersion: kubefabric.ai/v1
kind: FabricTemplate
metadata:
  name: llm-inference-vllm
spec:
  description: "LLM inference serving with vLLM"
  category: inference
  tags: [llm, inference, vllm]

  defaults:
    framework: vllm
    resources:
      gpuType: A100-80G
      gpuCount: 4
      memory: 256Gi
      cpu: 32

    image: vllm/vllm-openai:latest

    command:
      - python
      - -m
      - vllm.entrypoints.openai.api_server
      - --model={{ .modelName }}
      - --tensor-parallel-size={{ .gpuCount }}
      - --max-num-batched-tokens={{ .maxBatchTokens }}
      - --max-num-seqs={{ .maxSeqs }}

    env:
      - name: VLLM_ATTENTION_BACKEND
        value: "FLASH_ATTN"

  parameters:
    - name: modelName
      description: "HuggingFace model name or local path"
      type: string
      required: true

    - name: maxBatchTokens
      description: "Maximum tokens in a batch"
      type: integer
      default: "16384"

    - name: maxSeqs
      description: "Maximum concurrent sequences"
      type: integer
      default: "256"

---
# Example: Development Environment Template
apiVersion: kubefabric.ai/v1
kind: FabricTemplate
metadata:
  name: jupyter-dev-env
spec:
  description: "JupyterLab development environment"
  category: development
  tags: [jupyter, development, interactive]

  defaults:
    framework: jupyter
    resources:
      gpuType: T4
      gpuCount: 1
      memory: 32Gi
      cpu: 8

    image: jupyter/tensorflow-notebook:latest

    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root

    env:
      - name: JUPYTER_ENABLE_LAB
        value: "yes"

    volumes:
      - name: workspace
        mountPath: /workspace
        storageClass: vast-data

  parameters:
    - name: password
      description: "Jupyter password"
      type: string
      required: true

---
# Example: Benchmark Template
apiVersion: kubefabric.ai/v1
kind: FabricTemplate
metadata:
  name: mlperf-training-benchmark
spec:
  description: "MLPerf training benchmark"
  category: benchmark
  tags: [mlperf, benchmark, performance]

  defaults:
    framework: pytorch
    resources:
      gpuType: A100-80G
      gpuCount: 8
      memory: 512Gi
      cpu: 64

    image: nvcr.io/nvidia/pytorch:24.01-py3

    command:
      - python
      - -m
      - mlperf.train
      - --model={{ .model }}
      - --dataset={{ .dataset }}
      - --target-accuracy={{ .targetAccuracy }}

  parameters:
    - name: model
      description: "MLPerf model to benchmark"
      type: string
      required: true
      validation:
        enum: [resnet50, bert, gpt2, maskrcnn, ssd, dlrm]

    - name: dataset
      description: "Dataset to use"
      type: string
      required: true

    - name: targetAccuracy
      description: "Target accuracy to achieve"
      type: number
      default: "0.75"

---
# Using a Template
apiVersion: kubefabric.ai/v1
kind: FabricAIJob
metadata:
  name: my-training-job
spec:
  # Reference the template
  templateRef: pytorch-ddp-training

  # Override/provide parameters
  parameters:
    dataPath: /data/imagenet
    outputPath: /output/resnet50-run1
    batchSize: 64
    epochs: 90
    worldSize: 32  # 32 GPUs total

  # Can still override any defaults
  resources:
    gpuCount: 8  # 8 GPUs per node, 4 nodes total

---
# CLI Usage Examples
#
# List templates:
#   kfctl template list
#
# View template details:
#   kfctl template describe pytorch-ddp-training
#
# Create job from template:
#   kfctl job create --template pytorch-ddp-training \
#     --param dataPath=/data/imagenet \
#     --param batchSize=128 \
#     --param epochs=90
#
# Create template from existing job:
#   kfctl template create --from-job my-job --name my-template
#
# Validate template parameters:
#   kfctl template validate pytorch-ddp-training \
#     --param dataPath=/data/imagenet \
#     --param batchSize=128

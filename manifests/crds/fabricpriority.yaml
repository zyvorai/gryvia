---
# Job Priority Classes
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricpriorities.gryvia.io
spec:
  group: gryvia.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - value
              properties:
                # Priority value (higher = more important)
                value:
                  type: integer
                  minimum: 0
                  maximum: 1000000
                  description: "Priority value, higher is more important"

                # Description
                description:
                  type: string

                # Preemption policy
                preemptionPolicy:
                  type: string
                  enum: [Never, PreemptLowerPriority]
                  default: PreemptLowerPriority

                # Resource quotas that can be exceeded
                quotaOverride:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    maxOverridePercent:
                      type: integer
                      minimum: 0
                      maximum: 100
                      default: 0

                # SLA guarantees
                sla:
                  type: object
                  properties:
                    maxQueueTimeMinutes:
                      type: integer
                      minimum: 0
                      description: "Maximum time job can wait in queue"
                    guaranteedResources:
                      type: boolean
                      default: false
                      description: "Whether resources are guaranteed"

      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Value
          type: integer
          jsonPath: .spec.value
        - name: Preemption
          type: string
          jsonPath: .spec.preemptionPolicy
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Cluster
  names:
    plural: fabricpriorities
    singular: fabricpriority
    kind: FabricPriority
    shortNames:
      - fprio

---
# System-Critical Priority (highest)
apiVersion: gryvia.io/v1
kind: FabricPriority
metadata:
  name: system-critical
spec:
  value: 1000000
  description: "System and infrastructure jobs"
  preemptionPolicy: PreemptLowerPriority
  quotaOverride:
    enabled: true
    maxOverridePercent: 50  # Can use 150% of quota
  sla:
    maxQueueTimeMinutes: 1
    guaranteedResources: true

---
# Production Priority (very high)
apiVersion: gryvia.io/v1
kind: FabricPriority
metadata:
  name: production
spec:
  value: 100000
  description: "Production inference and serving workloads"
  preemptionPolicy: PreemptLowerPriority
  quotaOverride:
    enabled: true
    maxOverridePercent: 25  # Can use 125% of quota
  sla:
    maxQueueTimeMinutes: 5
    guaranteedResources: true

---
# High Priority
apiVersion: gryvia.io/v1
kind: FabricPriority
metadata:
  name: high
spec:
  value: 10000
  description: "Important research and critical experiments"
  preemptionPolicy: PreemptLowerPriority
  quotaOverride:
    enabled: true
    maxOverridePercent: 10
  sla:
    maxQueueTimeMinutes: 30
    guaranteedResources: false

---
# Normal Priority (default)
apiVersion: gryvia.io/v1
kind: FabricPriority
metadata:
  name: normal
spec:
  value: 1000
  description: "Standard training and development jobs"
  preemptionPolicy: Never
  quotaOverride:
    enabled: false
  sla:
    maxQueueTimeMinutes: 120
    guaranteedResources: false

---
# Low Priority
apiVersion: gryvia.io/v1
kind: FabricPriority
metadata:
  name: low
spec:
  value: 100
  description: "Non-urgent batch jobs"
  preemptionPolicy: Never
  quotaOverride:
    enabled: false
  sla:
    maxQueueTimeMinutes: 1440  # 24 hours
    guaranteedResources: false

---
# Best-Effort Priority (lowest)
apiVersion: gryvia.io/v1
kind: FabricPriority
metadata:
  name: best-effort
spec:
  value: 10
  description: "Opportunistic jobs, use spare capacity only"
  preemptionPolicy: Never
  quotaOverride:
    enabled: false
  sla:
    maxQueueTimeMinutes: 10080  # 1 week
    guaranteedResources: false

---
# Spot Priority (for spot instance jobs)
apiVersion: gryvia.io/v1
kind: FabricPriority
metadata:
  name: spot
spec:
  value: 50
  description: "Jobs using spot instances"
  preemptionPolicy: Never
  quotaOverride:
    enabled: false
  sla:
    maxQueueTimeMinutes: 2880  # 48 hours
    guaranteedResources: false

---
# Example Job with Priority
apiVersion: gryvia.io/v1
kind: FabricAIJob
metadata:
  name: critical-training
spec:
  # Use high priority
  priorityClassName: high

  framework: pytorch
  resources:
    gpuType: A100-80G
    gpuCount: 32

  image: nvcr.io/nvidia/pytorch:24.01-py3
  command: ["python", "train.py"]

---
# Example: Preemptible Job
apiVersion: gryvia.io/v1
kind: FabricAIJob
metadata:
  name: batch-job
spec:
  # Low priority, can be preempted
  priorityClassName: low

  framework: pytorch
  resources:
    gpuType: A100-40G
    gpuCount: 8

  # Checkpoint configuration for preemption
  checkpointing:
    enabled: true
    frequency: 10m
    path: /checkpoints

  image: nvcr.io/nvidia/pytorch:24.01-py3
  command: ["python", "train.py", "--checkpoint-dir=/checkpoints"]

---
# Example: Production Serving (highest priority)
apiVersion: gryvia.io/v1
kind: FabricAIJob
metadata:
  name: llm-serving
spec:
  priorityClassName: production

  framework: vllm
  resources:
    gpuType: H100
    gpuCount: 8

  # SLA requirements
  sla:
    maxLatencyMs: 100
    minThroughput: 1000  # tokens/sec

  image: vllm/vllm:v0.6.6
  command: ["python", "-m", "vllm.entrypoints.api_server"]

---
# Preemption Event Example
apiVersion: v1
kind: Event
metadata:
  name: job-preempted
type: Warning
reason: Preempted
message: |
  Job 'batch-job' preempted to make room for higher priority job 'critical-training'

  Preempted Job:
    Name: batch-job
    Priority: low (100)
    Resources: 8x A100-40G

  Preempting Job:
    Name: critical-training
    Priority: high (10000)
    Resources: 32x A100-80G
    Reason: Insufficient cluster capacity

  Preemption Actions:
    • Created checkpoint at /checkpoints/batch-job-1705834562
    • Gracefully terminated batch-job
    • Queued batch-job for restart when capacity available
    • Started critical-training

---
# Priority Queue Status
apiVersion: gryvia.io/v1
kind: FabricQueue
metadata:
  name: default
status:
  jobs:
    - name: llm-serving
      priority: 100000
      queueTime: 0m
      state: running

    - name: critical-training
      priority: 10000
      queueTime: 2m
      state: running

    - name: normal-job-1
      priority: 1000
      queueTime: 15m
      state: pending

    - name: normal-job-2
      priority: 1000
      queueTime: 25m
      state: pending

    - name: batch-job
      priority: 100
      queueTime: 45m
      state: pending
      preempted: true
      preemptedAt: "2024-01-21T08:30:00Z"
      preemptedBy: critical-training

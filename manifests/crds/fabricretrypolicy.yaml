---
# Advanced Retry Policies for Jobs
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricretrypolicies.kubefabric.io
spec:
  group: kubefabric.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Basic retry settings
                maxRetries:
                  type: integer
                  minimum: 0
                  maximum: 100
                  default: 3

                # Backoff strategy
                backoff:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [fixed, exponential, fibonacci, random]
                      default: exponential

                    initialDelay:
                      type: string
                      description: "Initial delay (e.g., 30s, 5m)"
                      default: "1m"

                    maxDelay:
                      type: string
                      description: "Maximum delay between retries"
                      default: "1h"

                    multiplier:
                      type: number
                      minimum: 1
                      default: 2
                      description: "Backoff multiplier (for exponential)"

                # Conditional retry
                retryOn:
                  type: object
                  properties:
                    exitCodes:
                      type: array
                      items:
                        type: integer
                      description: "Only retry on these exit codes"

                    errors:
                      type: array
                      items:
                        type: string
                      description: "Retry if error message contains these strings"

                    conditions:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            enum: [OutOfMemory, NodeFailure, NetworkError,
                                   StorageError, SpotInterruption, Timeout]
                          enabled:
                            type: boolean

                # Don't retry on these conditions
                noRetryOn:
                  type: object
                  properties:
                    exitCodes:
                      type: array
                      items:
                        type: integer

                    errors:
                      type: array
                      items:
                        type: string

                # Resource adjustment on retry
                resourceAdjustment:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false

                    # Increase resources on OOM
                    onOutOfMemory:
                      type: object
                      properties:
                        increaseMemory:
                          type: string
                          description: "Amount to increase (e.g., 50%)"
                        increaseGPUMemory:
                          type: boolean
                          default: true
                          description: "Switch to larger GPU type"

                    # Scale down on success
                    onSuccess:
                      type: object
                      properties:
                        decreaseResources:
                          type: boolean
                          default: false

                # Retry budget
                budget:
                  type: object
                  properties:
                    maxCostUSD:
                      type: number
                      description: "Max cost for all retries"
                    maxTotalTime:
                      type: string
                      description: "Max total time for all attempts"

                # Circuit breaker
                circuitBreaker:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    failureThreshold:
                      type: integer
                      default: 5
                      description: "Stop retrying after N consecutive failures"
                    resetTimeout:
                      type: string
                      default: "1h"

            status:
              type: object
              properties:
                attempts:
                  type: integer
                successRate:
                  type: number
                lastAttemptTime:
                  type: string
                  format: date-time
                nextRetryTime:
                  type: string
                  format: date-time
                state:
                  type: string
                  enum: [active, circuit-open, budget-exceeded]

      additionalPrinterColumns:
        - name: Max-Retries
          type: integer
          jsonPath: .spec.maxRetries
        - name: Backoff
          type: string
          jsonPath: .spec.backoff.type
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Cluster
  names:
    plural: fabricretrypolicies
    singular: fabricretrypolicy
    kind: FabricRetryPolicy
    shortNames:
      - frp

---
# Example: Standard Retry Policy
apiVersion: kubefabric.io/v1
kind: FabricRetryPolicy
metadata:
  name: standard-retry
spec:
  maxRetries: 3

  backoff:
    type: exponential
    initialDelay: 1m
    maxDelay: 30m
    multiplier: 2

  # Retry on common transient failures
  retryOn:
    conditions:
      - type: NodeFailure
        enabled: true
      - type: NetworkError
        enabled: true
      - type: SpotInterruption
        enabled: true

  # Don't retry on user errors
  noRetryOn:
    exitCodes: [1, 2]  # User script errors
    errors:
      - "invalid argument"
      - "permission denied"

---
# Example: Aggressive Retry with Resource Adjustment
apiVersion: kubefabric.io/v1
kind: FabricRetryPolicy
metadata:
  name: adaptive-retry
spec:
  maxRetries: 5

  backoff:
    type: exponential
    initialDelay: 30s
    maxDelay: 1h
    multiplier: 2

  retryOn:
    conditions:
      - type: OutOfMemory
        enabled: true
      - type: NodeFailure
        enabled: true
      - type: SpotInterruption
        enabled: true

  # Automatically adjust resources on retry
  resourceAdjustment:
    enabled: true

    onOutOfMemory:
      increaseMemory: 50%  # Increase memory by 50%
      increaseGPUMemory: true  # Switch to GPU with more memory

  budget:
    maxCostUSD: 1000  # Don't spend more than $1000 on retries
    maxTotalTime: 24h  # Give up after 24 hours

  circuitBreaker:
    enabled: true
    failureThreshold: 5  # Stop after 5 consecutive failures
    resetTimeout: 2h

---
# Example: Spot Instance Retry Policy
apiVersion: kubefabric.io/v1
kind: FabricRetryPolicy
metadata:
  name: spot-retry
spec:
  maxRetries: 10  # Spot can be interrupted frequently

  backoff:
    type: fixed
    initialDelay: 2m  # Quick retry for spot interruptions

  retryOn:
    conditions:
      - type: SpotInterruption
        enabled: true
      - type: NodeFailure
        enabled: true

  budget:
    maxCostUSD: 500

---
# Example: Job Using Retry Policy
apiVersion: kubefabric.io/v1
kind: FabricAIJob
metadata:
  name: resilient-training
spec:
  framework: pytorch

  # Reference retry policy
  retryPolicyRef: adaptive-retry

  # Or inline retry config
  retryPolicy:
    maxRetries: 3
    backoff:
      type: exponential
      initialDelay: 1m

  resources:
    gpuType: A100-40G
    gpuCount: 8

  # Must enable checkpointing for retries
  checkpointing:
    enabled: true
    frequency: 10m
    path: /checkpoints

  image: nvcr.io/nvidia/pytorch:24.01-py3
  command: ["python", "train.py", "--checkpoint-dir=/checkpoints"]

---
# Retry History Example
apiVersion: v1
kind: Event
metadata:
  name: job-retry-history
type: Normal
reason: JobRetried
message: |
  Job Retry History: resilient-training
  =====================================

  Attempt 1:
    Start: 2024-01-21 08:00:00
    End: 2024-01-21 08:45:00 (FAILED)
    Failure: SpotInterruption
    Exit Code: 143 (SIGTERM)
    Cost: $12.00
    Action: Retry in 1m

  Attempt 2:
    Start: 2024-01-21 08:46:00
    End: 2024-01-21 10:15:00 (FAILED)
    Failure: OutOfMemory
    Exit Code: 137
    Cost: $29.20
    Action: Increased memory A100-40G → A100-80G, retry in 2m

  Attempt 3:
    Start: 2024-01-21 10:17:00
    End: 2024-01-21 14:30:00 (SUCCESS)
    Exit Code: 0
    Cost: $87.20
    Checkpoint: Resumed from epoch 23

  Summary:
    Total Attempts: 3
    Total Time: 6h 30m
    Total Cost: $128.40
    Success: Yes
    Final Resource: 8x A100-80G

---
# Retry with Different Resources
apiVersion: kubefabric.io/v1
kind: FabricRetryPolicy
metadata:
  name: escalating-resources
spec:
  maxRetries: 4

  # Try with progressively larger resources
  resourceEscalation:
    - attempt: 1
      resources:
        gpuType: A100-40G
        gpuCount: 4

    - attempt: 2
      resources:
        gpuType: A100-80G  # More memory
        gpuCount: 4

    - attempt: 3
      resources:
        gpuType: A100-80G
        gpuCount: 8  # More GPUs

    - attempt: 4
      resources:
        gpuType: H100  # Fastest GPU
        gpuCount: 8

---
# Fibonacci Backoff Example
apiVersion: kubefabric.io/v1
kind: FabricRetryPolicy
metadata:
  name: fibonacci-retry
spec:
  maxRetries: 10

  backoff:
    type: fibonacci
    initialDelay: 1m
    maxDelay: 2h

  # Backoff sequence:
  # 1m, 1m, 2m, 3m, 5m, 8m, 13m, 21m, 34m, 55m, 89m (capped at 2h)

---
# CLI Usage Examples
#
# List retry policies:
#   kfctl retry policies list
#
# View retry policy:
#   kfctl retry policy describe adaptive-retry
#
# Create retry policy:
#   kfctl retry policy create my-policy \
#     --max-retries 5 \
#     --backoff exponential \
#     --initial-delay 1m
#
# View job retry history:
#   kfctl job retry-history my-job
#
# Output:
# Retry History: my-job
#
# Attempt  Status   Duration  Failure Reason       Next Retry  Cost
# 1        Failed   45m       SpotInterruption     1m          $12.00
# 2        Failed   1h 30m    OutOfMemory          2m          $29.20
# 3        Success  4h 15m    -                    -           $87.20
#
# Total: 3 attempts, 6h 30m, $128.40
#
# Manual retry:
#   kfctl job retry my-job --force
#
# Retry with different resources:
#   kfctl job retry my-job --gpu-type A100-80G

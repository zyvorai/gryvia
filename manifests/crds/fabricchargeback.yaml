# Export to CSV:
#   kfctl chargeback export monthly-chargeback --month 2024-01 --format csv
#
# View optimization recommendations:
#   kfctl chargeback optimize monthly-chargeback
#
# Output:
# Cost Optimization Recommendations
#
# 1. Use Spot Instances
#    Jobs: 15 training jobs
#    Savings: $8,400/month (40% discount)
#
# 2. Right-Size Resources
#    Jobs: 8 over-provisioned jobs
#    Savings: $4,200/month
#
# 3. Use MIG Instances for Dev
#    Jobs: 12 development jobs
#    Savings: $6,800/month (86% savings)
#
# Total Potential Savings: $19,400/month
#
# Compare periods:
#   kfctl chargeback compare --months 2023-12,2024-01
#
# Output:
# Chargeback Comparison
#
# Period          Total Cost   Change
# December 2023   $225,400     -
# January 2024    $248,500     +$23,100 (+10.3%)
#
# Top Increases:
#   Product ML Team: +$18,200 (+15%)
#   ML Research Team: +$6,400 (+9.5%)
#
# Drivers:
#   - 3 new H100 training jobs (+$12,800)
#   - Increased storage usage (+$2,400)
#   - Higher network egress (+$1,200)
#
# Set budget alerts:
#   kfctl chargeback alert create \
#     --cost-center cc-product-ml \
#     --threshold 80,90,100 \
#     --notify bob@company.com

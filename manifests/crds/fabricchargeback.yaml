---
# Cost Allocation and Chargeback
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricchargebacks.kubefabric.ai
spec:
  group: kubefabric.ai
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Billing period
                period:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [monthly, quarterly, annual, custom]
                      default: monthly

                    # Start and end dates
                    startDate:
                      type: string
                      format: date
                    endDate:
                      type: string
                      format: date

                    # Timezone
                    timezone:
                      type: string
                      default: UTC

                # Cost allocation model
                allocationModel:
                  type: object
                  properties:
                    # How to allocate shared costs
                    method:
                      type: string
                      enum: [actual-usage, reserved-capacity, equal-split, weighted]
                      default: actual-usage
                      description: "Method for allocating shared infrastructure costs"

                    # Include platform overhead
                    includePlatformCosts:
                      type: boolean
                      default: true

                    # Platform overhead percentage
                    platformOverhead:
                      type: number
                      minimum: 0
                      maximum: 100
                      default: 15
                      description: "Platform/management overhead percentage"

                # Pricing model
                pricing:
                  type: object
                  properties:
                    # Currency
                    currency:
                      type: string
                      default: USD

                    # GPU pricing
                    gpuRates:
                      type: object
                      additionalProperties:
                        type: object
                        properties:
                          hourlyRate:
                            type: number
                          monthlyReserved:
                            type: number
                          spotDiscount:
                            type: number

                    # Storage pricing (per GB/month)
                    storage:
                      type: object
                      properties:
                        standard:
                          type: number
                        performance:
                          type: number
                        archive:
                          type: number

                    # Network pricing
                    network:
                      type: object
                      properties:
                        egressPerGB:
                          type: number
                        ingressPerGB:
                          type: number
                          default: 0

                    # Support tiers
                    support:
                      type: object
                      properties:
                        basic:
                          type: number
                          default: 0
                        standard:
                          type: number
                        premium:
                          type: number

                # Cost centers
                costCenters:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      description:
                        type: string

                      # Teams/users in this cost center
                      teams:
                        type: array
                        items:
                          type: string

                      # Budget allocation
                      budget:
                        type: object
                        properties:
                          monthly:
                            type: number
                          quarterly:
                            type: number
                          annual:
                            type: number

                      # Billing contact
                      billingContact:
                        type: object
                        properties:
                          name:
                            type: string
                          email:
                            type: string
                          department:
                            type: string

                # Tagging for cost allocation
                tags:
                  type: object
                  properties:
                    required:
                      type: array
                      items:
                        type: string
                      description: "Tags required on all jobs for cost allocation"

                    custom:
                      type: object
                      additionalProperties:
                        type: string

                # Discounts and credits
                discounts:
                  type: object
                  properties:
                    # Volume discounts
                    volume:
                      type: array
                      items:
                        type: object
                        properties:
                          threshold:
                            type: number
                            description: "Spend threshold"
                          discount:
                            type: number
                            description: "Discount percentage"

                    # Reserved capacity discount
                    reserved:
                      type: number
                      description: "Discount for reserved capacity"

                    # Spot instance discount
                    spot:
                      type: number
                      default: 40
                      description: "Spot instance discount percentage"

                # Report generation
                reports:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true

                    # Report frequency
                    frequency:
                      type: string
                      enum: [daily, weekly, monthly, quarterly]
                      default: monthly

                    # Report format
                    formats:
                      type: array
                      items:
                        type: string
                        enum: [pdf, csv, excel, json, html]

                    # Recipients
                    recipients:
                      type: array
                      items:
                        type: object
                        properties:
                          email:
                            type: string
                          costCenters:
                            type: array
                            items:
                              type: string

                    # Include details
                    includeDetails:
                      type: boolean
                      default: true

                # Showback vs Chargeback
                mode:
                  type: string
                  enum: [showback, chargeback]
                  default: showback
                  description: "showback = informational only, chargeback = actual billing"

                # Integration with billing systems
                integration:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false

                    system:
                      type: string
                      enum: [netsuite, sap, quickbooks, xero, custom]

                    # API endpoint
                    endpoint:
                      type: string

                    credentials:
                      type: object
                      properties:
                        secretRef:
                          type: string

            status:
              type: object
              properties:
                # Current period status
                currentPeriod:
                  type: object
                  properties:
                    startDate:
                      type: string
                      format: date
                    endDate:
                      type: string
                      format: date

                    # Total costs
                    totalCost:
                      type: number

                    # Breakdown by cost center
                    costCenters:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          cost:
                            type: number
                          budget:
                            type: number
                          variance:
                            type: number
                          percentUsed:
                            type: number

                    # Breakdown by resource type
                    byResourceType:
                      type: object
                      properties:
                        compute:
                          type: number
                        storage:
                          type: number
                        network:
                          type: number
                        support:
                          type: number
                        platform:
                          type: number

                # Last report generated
                lastReport:
                  type: object
                  properties:
                    timestamp:
                      type: string
                      format: date-time
                    period:
                      type: string
                    path:
                      type: string

      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Period
          type: string
          jsonPath: .spec.period.type
        - name: Total-Cost
          type: string
          jsonPath: .status.currentPeriod.totalCost
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Cluster
  names:
    plural: fabricchargebacks
    singular: fabricchargeback
    kind: FabricChargeback
    shortNames:
      - fcharge

---
# Example: Monthly Chargeback Configuration
apiVersion: kubefabric.ai/v1
kind: FabricChargeback
metadata:
  name: monthly-chargeback
spec:
  period:
    type: monthly
    timezone: America/Los_Angeles

  allocationModel:
    method: actual-usage
    includePlatformCosts: true
    platformOverhead: 15

  pricing:
    currency: USD

    gpuRates:
      H100:
        hourlyRate: 32.00
        monthlyReserved: 18000  # ~25% discount
        spotDiscount: 40
      A100-80G:
        hourlyRate: 24.00
        monthlyReserved: 14400
        spotDiscount: 40
      A100-40G:
        hourlyRate: 18.00
        monthlyReserved: 11000
        spotDiscount: 40
      V100:
        hourlyRate: 16.00
        monthlyReserved: 9600
        spotDiscount: 45
      T4:
        hourlyRate: 8.00
        monthlyReserved: 4800
        spotDiscount: 50

    storage:
      standard: 0.10  # per GB/month
      performance: 0.25
      archive: 0.02

    network:
      egressPerGB: 0.05
      ingressPerGB: 0

    support:
      basic: 0
      standard: 2000  # per month
      premium: 10000

  costCenters:
    - id: cc-ml-research
      name: ML Research Team
      description: Machine Learning R&D
      teams: [ml-research, cv-team]
      budget:
        monthly: 75000
        quarterly: 225000
        annual: 900000
      billingContact:
        name: Alice Johnson
        email: alice@company.com
        department: AI Research

    - id: cc-product-ml
      name: Product ML Team
      description: Production ML Systems
      teams: [product-ml, nlp-team]
      budget:
        monthly: 125000
        quarterly: 375000
        annual: 1500000
      billingContact:
        name: Bob Smith
        email: bob@company.com
        department: Engineering

    - id: cc-data-science
      name: Data Science Team
      description: Analytics and Data Science
      teams: [data-science]
      budget:
        monthly: 50000
        quarterly: 150000
        annual: 600000
      billingContact:
        name: Carol Davis
        email: carol@company.com
        department: Analytics

  tags:
    required: [cost-center, project, environment]
    custom:
      company: acme-corp
      platform: kubefabric

  discounts:
    volume:
      - threshold: 50000
        discount: 5
      - threshold: 100000
        discount: 10
      - threshold: 200000
        discount: 15
    reserved: 25
    spot: 40

  reports:
    enabled: true
    frequency: monthly
    formats: [pdf, csv, excel]
    recipients:
      - email: finance@company.com
        costCenters: [cc-ml-research, cc-product-ml, cc-data-science]
      - email: alice@company.com
        costCenters: [cc-ml-research]
      - email: bob@company.com
        costCenters: [cc-product-ml]
    includeDetails: true

  mode: chargeback

  integration:
    enabled: true
    system: netsuite
    endpoint: https://api.netsuite.com/v1
    credentials:
      secretRef: netsuite-credentials

---
# Example: Cost Center Report
apiVersion: kubefabric.ai/v1
kind: FabricChargebackReport
metadata:
  name: jan-2024-chargeback
spec:
  chargebackRef: monthly-chargeback

  period:
    month: 2024-01
    startDate: "2024-01-01"
    endDate: "2024-01-31"

  # Generated report data
  summary:
    totalCost: 248500.00
    currency: USD

    # By cost center
    costCenters:
      - id: cc-ml-research
        name: ML Research Team
        costs:
          compute: 58400.00
          storage: 3200.00
          network: 850.00
          support: 2000.00
          platform: 9367.50
        total: 73817.50
        budget: 75000.00
        variance: -1182.50
        percentUsed: 98.4

      - id: cc-product-ml
        name: Product ML Team
        costs:
          compute: 104600.00
          storage: 5800.00
          network: 1450.00
          support: 10000.00
          platform: 18277.50
        total: 140127.50
        budget: 125000.00
        variance: 15127.50
        percentUsed: 112.1

      - id: cc-data-science
        name: Data Science Team
        costs:
          compute: 28900.00
          storage: 1600.00
          network: 420.00
          support: 0
          platform: 3635.00
        total: 34555.00
        budget: 50000.00
        variance: -15445.00
        percentUsed: 69.1

    # By resource type
    byResourceType:
      compute: 191900.00
      storage: 10600.00
      network: 2720.00
      support: 12000.00
      platform: 31280.00

    # By GPU type
    byGPUType:
      H100: 64800.00
      A100-80G: 95400.00
      V100: 24500.00
      T4: 7200.00

  # Top cost drivers
  topJobs:
    - name: llm-training-gpt
      costCenter: cc-product-ml
      cost: 18450.00
      gpuHours: 768
      gpuType: A100-80G

    - name: vision-model-v2
      costCenter: cc-ml-research
      cost: 12800.00
      gpuHours: 400
      gpuType: H100

    - name: recommendation-training
      costCenter: cc-product-ml
      cost: 9600.00
      gpuHours: 600
      gpuType: V100

  # Optimization opportunities
  recommendations:
    - type: spot-instances
      description: "15 training jobs could use spot instances"
      potentialSavings: 8400.00

    - type: right-sizing
      description: "8 jobs over-provisioned by >25%"
      potentialSavings: 4200.00

    - type: mig-instances
      description: "12 dev jobs could use MIG instances"
      potentialSavings: 6800.00

---
# CLI Usage Examples
#
# List chargeback policies:
#   kfctl chargeback list
#
# Output:
# NAME               MODE        PERIOD    TOTAL-COST   AGE
# monthly-chargeback chargeback  monthly   $248,500     30d
#
# View current period costs:
#   kfctl chargeback status monthly-chargeback
#
# Output:
# Chargeback Status: monthly-chargeback
#
# Current Period: January 2024 (Jan 1 - Jan 31)
# Total Cost: $248,500
#
# By Cost Center:
#   ML Research Team:    $73,817.50 / $75,000 (98.4%)
#   Product ML Team:     $140,127.50 / $125,000 (112.1%) ⚠️ OVER BUDGET
#   Data Science Team:   $34,555 / $50,000 (69.1%)
#
# By Resource:
#   Compute: $191,900 (77%)
#   Storage: $10,600 (4%)
#   Network: $2,720 (1%)
#   Support: $12,000 (5%)
#   Platform: $31,280 (13%)
#
# View cost center details:
#   kfctl chargeback cost-center cc-product-ml --month 2024-01
#
# Output:
# Cost Center: Product ML Team (January 2024)
#
# Total: $140,127.50 / $125,000 (112.1% of budget)
# Variance: +$15,127.50 OVER BUDGET
#
# Breakdown:
#   Compute: $104,600 (75%)
#   Storage: $5,800 (4%)
#   Network: $1,450 (1%)
#   Support: $10,000 (7%)
#   Platform: $18,277.50 (13%)
#
# Top Jobs:
#   llm-training-gpt:        $18,450
#   recommendation-training: $9,600
#   bert-fine-tuning:        $7,200
#
# GPU Usage:
#   A100-80G: 3,120 hours @ $24/hr = $74,880
#   H100: 640 hours @ $32/hr = $20,480
#   V100: 600 hours @ $16/hr = $9,600
#
# Generate report:
#   kfctl chargeback report monthly-chargeback --month 2024-01 --format pdf
#
# Output:
# Generating chargeback report for January 2024...
# Report generated: /tmp/chargeback-2024-01.pdf
# Sent to: finance@company.com, bob@company.com

---
# Job Lifecycle Hooks
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricjobhooks.kubefabric.io
spec:
  group: kubefabric.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Hook triggers
                trigger:
                  type: string
                  enum: [pre-start, post-start, pre-completion, post-completion,
                         on-failure, on-success, on-timeout, on-preemption,
                         on-checkpoint, pre-retry, post-retry]

                # Selector for which jobs this hook applies to
                selector:
                  type: object
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                    matchExpressions:
                      type: array
                      items:
                        type: object

                # Hook action type
                action:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [exec, webhook, k8s-job, script, notification]

                    # For exec action
                    exec:
                      type: object
                      properties:
                        command:
                          type: array
                          items:
                            type: string
                        env:
                          type: array
                          items:
                            type: object
                        timeout:
                          type: string
                          default: "5m"

                    # For webhook action
                    webhook:
                      type: object
                      properties:
                        url:
                          type: string
                        method:
                          type: string
                          enum: [GET, POST, PUT]
                          default: POST
                        headers:
                          type: object
                          additionalProperties:
                            type: string
                        body:
                          type: string
                        timeout:
                          type: string
                          default: "30s"

                    # For k8s-job action
                    k8sJob:
                      type: object
                      properties:
                        image:
                          type: string
                        command:
                          type: array
                          items:
                            type: string
                        resources:
                          type: object

                    # For notification action
                    notification:
                      type: object
                      properties:
                        channels:
                          type: array
                          items:
                            type: string
                            enum: [email, slack, pagerduty, webhook]
                        template:
                          type: string
                        recipients:
                          type: array
                          items:
                            type: string

                # Failure policy
                failurePolicy:
                  type: string
                  enum: [ignore, fail-job, retry]
                  default: ignore

                # Retry configuration
                retry:
                  type: object
                  properties:
                    attempts:
                      type: integer
                      minimum: 0
                      default: 0
                    backoff:
                      type: string
                      default: "30s"

                # Conditional execution
                condition:
                  type: string
                  description: "Expression to evaluate (e.g., {{job.exitCode}} == 0)"

            status:
              type: object
              properties:
                lastExecutionTime:
                  type: string
                  format: date-time
                executionCount:
                  type: integer
                lastStatus:
                  type: string
                  enum: [success, failed, skipped]

      additionalPrinterColumns:
        - name: Trigger
          type: string
          jsonPath: .spec.trigger
        - name: Action
          type: string
          jsonPath: .spec.action.type
        - name: Last-Execution
          type: string
          jsonPath: .status.lastExecutionTime
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Cluster
  names:
    plural: fabricjobhooks
    singular: fabricjobhook
    kind: FabricJobHook
    shortNames:
      - fjhook

---
# Example: Pre-Start Data Validation Hook
apiVersion: kubefabric.io/v1
kind: FabricJobHook
metadata:
  name: validate-data-pre-start
spec:
  trigger: pre-start

  selector:
    matchLabels:
      framework: pytorch

  action:
    type: exec
    exec:
      command:
        - python
        - /scripts/validate_data.py
        - --data-path={{ .job.spec.volumes.data.path }}
      timeout: 5m

  failurePolicy: fail-job  # Don't start job if validation fails

---
# Example: Post-Completion Model Upload
apiVersion: kubefabric.io/v1
kind: FabricJobHook
metadata:
  name: upload-model-post-completion
spec:
  trigger: post-completion

  selector:
    matchLabels:
      type: training

  condition: "{{job.exitCode}} == 0"  # Only on success

  action:
    type: k8sJob
    k8sJob:
      image: amazon/aws-cli:latest
      command:
        - aws
        - s3
        - sync
        - /checkpoints/{{ .job.name }}
        - s3://models-bucket/{{ .job.metadata.namespace }}/{{ .job.name }}
      resources:
        memory: 2Gi
        cpu: 2

  failurePolicy: retry
  retry:
    attempts: 3
    backoff: 1m

---
# Example: On-Failure Notification
apiVersion: kubefabric.io/v1
kind: FabricJobHook
metadata:
  name: notify-on-failure
spec:
  trigger: on-failure

  selector:
    matchLabels:
      priority: high

  action:
    type: notification
    notification:
      channels: [email, slack, pagerduty]
      recipients:
        - ml-team@company.com
        - on-call@company.com
      template: |
        🚨 High Priority Job Failed

        Job: {{ .job.name }}
        Namespace: {{ .job.namespace }}
        Exit Code: {{ .job.exitCode }}
        Duration: {{ .job.duration }}
        Cost: ${{ .job.cost }}

        Error: {{ .job.error }}

        Logs: kubectl logs {{ .job.name }}

  failurePolicy: ignore

---
# Example: Pre-Checkpoint Hook
apiVersion: kubefabric.io/v1
kind: FabricJobHook
metadata:
  name: optimize-checkpoint
spec:
  trigger: on-checkpoint

  action:
    type: exec
    exec:
      command:
        - python
        - /scripts/compress_checkpoint.py
        - --checkpoint-dir=/checkpoints
      timeout: 2m

  failurePolicy: ignore  # Don't fail checkpoint if compression fails

---
# Example: Webhook Integration (Weights & Biases)
apiVersion: kubefabric.io/v1
kind: FabricJobHook
metadata:
  name: wandb-integration
spec:
  trigger: post-completion

  action:
    type: webhook
    webhook:
      url: https://api.wandb.ai/api/v1/runs
      method: POST
      headers:
        Authorization: "Bearer ${WANDB_API_KEY}"
        Content-Type: "application/json"
      body: |
        {
          "job_name": "{{ .job.name }}",
          "status": "{{ .job.status }}",
          "duration": {{ .job.duration }},
          "cost": {{ .job.cost }},
          "gpu_type": "{{ .job.spec.resources.gpuType }}",
          "gpu_count": {{ .job.spec.resources.gpuCount }},
          "metrics": {{ .job.metrics | toJson }}
        }
      timeout: 30s

  failurePolicy: ignore

---
# Example: Pre-Retry Resource Adjustment
apiVersion: kubefabric.io/v1
kind: FabricJobHook
metadata:
  name: adjust-resources-pre-retry
spec:
  trigger: pre-retry

  condition: "{{job.failureReason}} contains 'out of memory'"

  action:
    type: exec
    exec:
      command:
        - kubectl
        - patch
        - fabricaijob
        - "{{ .job.name }}"
        - -n
        - "{{ .job.namespace }}"
        - --type=json
        - -p
        - '[{"op": "replace", "path": "/spec/resources/gpuType", "value": "A100-80G"}]'

  failurePolicy: ignore

---
# Example: Cost Tracking Hook
apiVersion: kubefabric.io/v1
kind: FabricJobHook
metadata:
  name: track-job-cost
spec:
  trigger: post-completion

  action:
    type: webhook
    webhook:
      url: https://cost-tracker.company.com/api/jobs
      method: POST
      body: |
        {
          "job_id": "{{ .job.name }}",
          "team": "{{ .job.spec.owner.name }}",
          "cost": {{ .job.cost }},
          "gpu_hours": {{ .job.gpuHours }},
          "timestamp": "{{ .job.completionTime }}"
        }

---
# Example: Model Registry Hook
apiVersion: kubefabric.io/v1
kind: FabricJobHook
metadata:
  name: register-model
spec:
  trigger: post-completion

  selector:
    matchLabels:
      type: training

  condition: "{{job.metrics.accuracy}} > 0.95"

  action:
    type: k8sJob
    k8sJob:
      image: python:3.11
      command:
        - python
        - -c
        - |
          import mlflow
          mlflow.set_tracking_uri("http://mlflow:5000")
          mlflow.register_model(
              model_uri="/checkpoints/{{ .job.name }}/best-model",
              name="{{ .job.metadata.labels.model-name }}"
          )

---
# Example: Slack Notification with Rich Format
apiVersion: kubefabric.io/v1
kind: FabricJobHook
metadata:
  name: slack-job-completion
spec:
  trigger: post-completion

  action:
    type: webhook
    webhook:
      url: "${SLACK_WEBHOOK_URL}"
      method: POST
      headers:
        Content-Type: "application/json"
      body: |
        {
          "text": "Job {{ .job.name }} completed",
          "blocks": [
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "*Job Completed*\n\n*Job:* {{ .job.name }}\n*Status:* {{ .job.status }}\n*Duration:* {{ .job.duration }}\n*Cost:* ${{ .job.cost }}"
              }
            },
            {
              "type": "section",
              "fields": [
                {"type": "mrkdwn", "text": "*GPU Type:*\n{{ .job.spec.resources.gpuType }}"},
                {"type": "mrkdwn", "text": "*GPU Count:*\n{{ .job.spec.resources.gpuCount }}"},
                {"type": "mrkdwn", "text": "*Team:*\n{{ .job.spec.owner.name }}"},
                {"type": "mrkdwn", "text": "*Priority:*\n{{ .job.spec.priority }}"}
              ]
            }
          ]
        }

---
# Example: Auto-Cleanup Hook
apiVersion: kubefabric.io/v1
kind: FabricJobHook
metadata:
  name: cleanup-scratch
spec:
  trigger: post-completion

  action:
    type: exec
    exec:
      command:
        - bash
        - -c
        - |
          # Clean up scratch space
          rm -rf /scratch/{{ .job.name }}/*
          # Keep checkpoints
          echo "Cleaned up scratch space for {{ .job.name }}"
      timeout: 5m

  failurePolicy: ignore

---
# CLI Usage Examples
#
# List job hooks:
#   kfctl hooks list
#
# View hook details:
#   kfctl hooks describe validate-data-pre-start
#
# Test hook:
#   kfctl hooks test validate-data-pre-start --job my-job
#
# View hook execution history:
#   kfctl hooks history --job my-job
#
# Output:
# Hook Execution History: my-job
#
# Hook                        Trigger          Status   Duration  Timestamp
# validate-data-pre-start     pre-start        success  2.3s      2024-01-21 10:00:00
# upload-model-post-completion post-completion  success  45s       2024-01-21 14:30:15
# notify-on-failure           on-failure       skipped  -         -
# track-job-cost              post-completion  success  0.5s      2024-01-21 14:30:20
#
# Create hook:
#   kfctl hooks create my-hook \
#     --trigger post-completion \
#     --webhook https://api.example.com/jobs
#
# Delete hook:
#   kfctl hooks delete my-hook

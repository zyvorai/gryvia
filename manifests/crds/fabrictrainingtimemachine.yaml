---
# Training Time Machine CRD
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabrictrainingtimemachines.kubefabric.ai
spec:
  group: kubefabric.ai
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - sourceJob
              properties:
                # Reference to the FabricAIJob to track
                sourceJob:
                  type: string
                  description: "Name of the FabricAIJob to track checkpoints for"

                # Timeline configuration
                timeline:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                      description: "Enable checkpoint timeline indexing"
                    indexCheckpoints:
                      type: boolean
                      default: true
                      description: "Automatically discover and index checkpoints from the source job"
                    metadataPerCheckpoint:
                      type: array
                      description: "Metadata fields to extract and store per checkpoint"
                      items:
                        type: object
                        required:
                          - name
                          - source
                        properties:
                          name:
                            type: string
                            description: "Name of the metadata field (e.g., loss, accuracy, lr)"
                          source:
                            type: string
                            enum: [metric, log, file]
                            description: "Source type for the metadata value"
                          path:
                            type: string
                            description: "Path to extract value (log pattern or file path)"

                # Retention policy
                retention:
                  type: object
                  properties:
                    keepAll:
                      type: boolean
                      default: false
                      description: "Keep all checkpoints (overrides other retention settings)"
                    keepEveryNth:
                      type: integer
                      minimum: 1
                      description: "Keep every Nth checkpoint (e.g., 5 keeps every 5th)"
                    keepBest:
                      type: integer
                      minimum: 1
                      description: "Keep the N best checkpoints by primary metric"
                    keepMilestones:
                      type: array
                      description: "Specific checkpoint steps or epochs to always keep"
                      items:
                        type: integer
                    maxStorageGi:
                      type: integer
                      minimum: 1
                      description: "Maximum storage in GiB for all retained checkpoints"

                # Fork definitions
                forks:
                  type: array
                  description: "Fork requests to create new training jobs from checkpoints"
                  items:
                    type: object
                    required:
                      - name
                      - fromCheckpoint
                    properties:
                      name:
                        type: string
                        description: "Unique name for this fork"
                      fromCheckpoint:
                        type: object
                        description: "Checkpoint selector for the fork point"
                        properties:
                          step:
                            type: integer
                            description: "Fork from a specific training step"
                          epoch:
                            type: integer
                            description: "Fork from a specific epoch"
                          metric:
                            type: object
                            description: "Fork from the checkpoint with the best metric value"
                            properties:
                              name:
                                type: string
                                description: "Metric name (e.g., val_loss, accuracy)"
                              selector:
                                type: string
                                enum: [min, max]
                                description: "Select checkpoint with min or max metric value"
                      overrides:
                        type: object
                        description: "Overrides to apply to the forked job"
                        properties:
                          env:
                            type: array
                            items:
                              type: object
                              required:
                                - name
                                - value
                              properties:
                                name:
                                  type: string
                                value:
                                  type: string
                          args:
                            type: array
                            items:
                              type: string
                      newJobName:
                        type: string
                        description: "Name for the forked FabricAIJob (auto-generated if omitted)"

            status:
              type: object
              properties:
                checkpointTimeline:
                  type: object
                  description: "Timeline of indexed checkpoints"
                  properties:
                    totalCheckpoints:
                      type: integer
                      description: "Total number of indexed checkpoints"
                    bestCheckpoint:
                      type: object
                      properties:
                        step:
                          type: integer
                        epoch:
                          type: integer
                        metricName:
                          type: string
                        metricValue:
                          type: number
                          format: double
                    latestCheckpoint:
                      type: object
                      properties:
                        step:
                          type: integer
                        epoch:
                          type: integer
                        timestamp:
                          type: string
                          format: date-time

                forks:
                  type: array
                  description: "Status of each fork request"
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: "Fork name"
                      sourceStep:
                        type: integer
                        description: "Step from which the fork was created"
                      forkedJob:
                        type: string
                        description: "Name of the forked FabricAIJob"
                      status:
                        type: string
                        enum: [Pending, Creating, Running, Succeeded, Failed]
                        description: "Current status of the fork"
                      currentMetric:
                        type: number
                        format: double
                        description: "Current primary metric value of the forked job"

                storageUsed:
                  type: string
                  description: "Total storage used by retained checkpoints (e.g., 45Gi)"

                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time

      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Source-Job
          type: string
          jsonPath: .spec.sourceJob
        - name: Checkpoints
          type: integer
          jsonPath: .status.checkpointTimeline.totalCheckpoints
        - name: Forks
          type: integer
          jsonPath: .status.forks
          priority: 1
        - name: Storage
          type: string
          jsonPath: .status.storageUsed
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Namespaced
  names:
    plural: fabrictrainingtimemachines
    singular: fabrictrainingtimemachine
    kind: FabricTrainingTimeMachine
    shortNames:
      - fttm

---
# Example: Time Machine for LLM fine-tuning job
apiVersion: kubefabric.ai/v1
kind: FabricTrainingTimeMachine
metadata:
  name: llama-finetune-timemachine
  namespace: ml-team
spec:
  sourceJob: llama-70b-finetune

  timeline:
    enabled: true
    indexCheckpoints: true
    metadataPerCheckpoint:
      - name: loss
        source: metric
      - name: val_loss
        source: metric
      - name: learning_rate
        source: metric

  retention:
    keepAll: false
    keepEveryNth: 5
    keepBest: 3
    keepMilestones:
      - 100
      - 500
      - 1000
    maxStorageGi: 500

  forks:
    - name: lower-lr-from-best
      fromCheckpoint:
        metric:
          name: val_loss
          selector: min
      overrides:
        env:
          - name: LEARNING_RATE
            value: "1e-5"
          - name: WARMUP_STEPS
            value: "0"
        args:
          - "--resume-from-checkpoint"

    - name: longer-training-from-epoch-10
      fromCheckpoint:
        epoch: 10
      overrides:
        env:
          - name: MAX_EPOCHS
            value: "50"
      newJobName: llama-70b-extended

---
# Example: Time Machine with step-based fork
apiVersion: kubefabric.ai/v1
kind: FabricTrainingTimeMachine
metadata:
  name: resnet-experiment-timemachine
  namespace: cv-team
spec:
  sourceJob: resnet50-imagenet-training

  timeline:
    enabled: true
    indexCheckpoints: true
    metadataPerCheckpoint:
      - name: train_loss
        source: metric
      - name: val_accuracy
        source: metric

  retention:
    keepBest: 5
    maxStorageGi: 100

  forks:
    - name: augmentation-experiment
      fromCheckpoint:
        step: 50000
      overrides:
        env:
          - name: AUGMENTATION
            value: "heavy"
          - name: LEARNING_RATE
            value: "5e-4"

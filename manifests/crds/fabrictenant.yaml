---
# Multi-Tenancy and Team Management
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabrictenants.kubefabric.io
spec:
  group: kubefabric.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Tenant details
                displayName:
                  type: string
                description:
                  type: string

                # Parent tenant for hierarchical organization
                parentTenant:
                  type: string
                  description: "Parent tenant for sub-teams"

                # Members
                members:
                  type: array
                  items:
                    type: object
                    properties:
                      username:
                        type: string
                      role:
                        type: string
                        enum: [admin, member, viewer]
                      joinedAt:
                        type: string
                        format: date-time

                # Resource quotas
                quotas:
                  type: object
                  properties:
                    gpuHours:
                      type: object
                      properties:
                        monthly:
                          type: number
                        burst:
                          type: number
                          description: "Burst capacity above quota"

                    costUSD:
                      type: object
                      properties:
                        monthly:
                          type: number
                        burst:
                          type: number

                    concurrentJobs:
                      type: integer
                    concurrentGPUs:
                      type: integer

                    # Per-GPU-type quotas
                    perGPUType:
                      type: object
                      additionalProperties:
                        type: object
                        properties:
                          count:
                            type: integer
                          hours:
                            type: number

                # Resource priorities
                priorities:
                  type: object
                  properties:
                    default:
                      type: string
                      enum: [low, normal, high]

                    allowHighPriority:
                      type: boolean
                      default: false

                    preemptionAllowed:
                      type: boolean
                      default: true

                # Network isolation
                networkPolicy:
                  type: object
                  properties:
                    isolated:
                      type: boolean
                      default: false
                      description: "Network isolation from other tenants"

                    allowedTenants:
                      type: array
                      items:
                        type: string
                      description: "Tenants allowed to communicate with"

                # Storage quotas
                storageQuotas:
                  type: object
                  properties:
                    home:
                      type: string
                      description: "Home directory quota (e.g., 1Ti)"
                    scratch:
                      type: string
                    datasets:
                      type: string
                    models:
                      type: string

                # Job defaults
                jobDefaults:
                  type: object
                  properties:
                    image:
                      type: string
                    priorityClass:
                      type: string
                    checkpointing:
                      type: boolean
                    retryPolicy:
                      type: string

                # Cost center and billing
                billing:
                  type: object
                  properties:
                    costCenter:
                      type: string
                    billingContact:
                      type: string
                    purchaseOrder:
                      type: string
                    paymentMethod:
                      type: string
                      enum: [credit, invoice, prepaid]

                # Notifications
                notifications:
                  type: object
                  properties:
                    email:
                      type: array
                      items:
                        type: string
                    slack:
                      type: object
                      properties:
                        channel:
                          type: string
                        webhook:
                          type: string

                # Compliance and governance
                governance:
                  type: object
                  properties:
                    dataClassification:
                      type: string
                      enum: [public, internal, confidential, restricted]

                    complianceRequirements:
                      type: array
                      items:
                        type: string
                        enum: [HIPAA, SOC2, GDPR, FedRAMP]

                    auditRetention:
                      type: string
                      description: "How long to retain audit logs"

            status:
              type: object
              properties:
                memberCount:
                  type: integer

                currentUsage:
                  type: object
                  properties:
                    gpuHours:
                      type: number
                    costUSD:
                      type: number
                    runningJobs:
                      type: integer
                    usedGPUs:
                      type: integer

                quotaUtilization:
                  type: object
                  properties:
                    gpuHoursPercent:
                      type: number
                    costPercent:
                      type: number
                    jobsPercent:
                      type: number

                health:
                  type: string
                  enum: [healthy, warning, quota-exceeded]

      additionalPrinterColumns:
        - name: Members
          type: integer
          jsonPath: .status.memberCount
        - name: Running-Jobs
          type: integer
          jsonPath: .status.currentUsage.runningJobs
        - name: GPUs
          type: integer
          jsonPath: .status.currentUsage.usedGPUs
        - name: Quota-Usage
          type: string
          jsonPath: .status.quotaUtilization.costPercent
        - name: Health
          type: string
          jsonPath: .status.health
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Cluster
  names:
    plural: fabrictenants
    singular: fabrictenant
    kind: FabricTenant
    shortNames:
      - ftenant

---
# Example: ML Research Team
apiVersion: kubefabric.io/v1
kind: FabricTenant
metadata:
  name: ml-research
spec:
  displayName: "Machine Learning Research"
  description: "Core ML research team"

  members:
    - username: alice
      role: admin
    - username: bob
      role: member
    - username: charlie
      role: member
    - username: david
      role: viewer

  quotas:
    gpuHours:
      monthly: 2000
      burst: 500  # Can use 2500 hours total

    costUSD:
      monthly: 50000
      burst: 10000

    concurrentJobs: 50
    concurrentGPUs: 128

    perGPUType:
      H100:
        count: 32
        hours: 200
      A100-80G:
        count: 64
        hours: 1000
      A100-40G:
        count: 32
        hours: 500

  priorities:
    default: normal
    allowHighPriority: true
    preemptionAllowed: false  # Don't allow preemption of this team's jobs

  networkPolicy:
    isolated: false  # Can communicate with all tenants

  storageQuotas:
    home: 10Ti
    scratch: 50Ti
    datasets: 100Ti
    models: 20Ti

  jobDefaults:
    priorityClass: normal
    checkpointing: true
    retryPolicy: standard-retry

  billing:
    costCenter: "CC-ML-001"
    billingContact: ml-lead@company.com
    paymentMethod: credit

  notifications:
    email:
      - ml-team@company.com
    slack:
      channel: "#ml-research"
      webhook: "https://hooks.slack.com/..."

  governance:
    dataClassification: internal
    complianceRequirements: [SOC2]
    auditRetention: 1y

---
# Example: Production Inference Team
apiVersion: kubefabric.io/v1
kind: FabricTenant
metadata:
  name: production-inference
spec:
  displayName: "Production Inference"
  description: "Production model serving team"

  members:
    - username: ops-lead
      role: admin
    - username: sre-1
      role: member

  quotas:
    costUSD:
      monthly: 100000  # Higher budget for production

    concurrentJobs: 200
    concurrentGPUs: 256

  priorities:
    default: high  # Production gets high priority
    allowHighPriority: true
    preemptionAllowed: false

  networkPolicy:
    isolated: true  # Isolated for security
    allowedTenants:
      - ml-research  # Can communicate with ML team

  jobDefaults:
    priorityClass: production
    checkpointing: false  # Stateless serving

  billing:
    costCenter: "CC-PROD-001"
    paymentMethod: invoice

  governance:
    dataClassification: confidential
    complianceRequirements: [SOC2, HIPAA]
    auditRetention: 7y

---
# Example: Sub-Team (Hierarchical)
apiVersion: kubefabric.io/v1
kind: FabricTenant
metadata:
  name: ml-research-cv
spec:
  displayName: "Computer Vision Sub-Team"
  description: "Computer vision research within ML team"

  parentTenant: ml-research  # Inherits from parent

  members:
    - username: cv-lead
      role: admin
    - username: vision-researcher-1
      role: member

  # Sub-quota from parent team
  quotas:
    gpuHours:
      monthly: 500  # 500 of parent's 2000
    costUSD:
      monthly: 12000

    concurrentJobs: 20
    concurrentGPUs: 32

---
# Example: External Collaborator Tenant
apiVersion: kubefabric.io/v1
kind: FabricTenant
metadata:
  name: university-collab
spec:
  displayName: "University Collaboration"
  description: "External academic partners"

  members:
    - username: prof-smith
      role: admin
    - username: phd-student-1
      role: member

  quotas:
    gpuHours:
      monthly: 200  # Limited quota for external
    costUSD:
      monthly: 5000

    concurrentJobs: 10
    concurrentGPUs: 16

    perGPUType:
      T4:
        count: 16  # Only access to T4 GPUs
        hours: 200

  priorities:
    default: low
    allowHighPriority: false
    preemptionAllowed: true  # Can be preempted

  networkPolicy:
    isolated: true  # Isolated from internal teams
    allowedTenants: []

  storageQuotas:
    home: 1Ti
    scratch: 5Ti

  governance:
    dataClassification: public
    auditRetention: 2y

---
# Tenant Status Example
apiVersion: kubefabric.io/v1
kind: FabricTenant
metadata:
  name: ml-research
status:
  memberCount: 4

  currentUsage:
    gpuHours: 1450  # This month
    costUSD: 37500
    runningJobs: 23
    usedGPUs: 64

  quotaUtilization:
    gpuHoursPercent: 72.5
    costPercent: 75.0
    jobsPercent: 46.0

  health: healthy

---
# CLI Usage Examples
#
# Create tenant:
#   kfctl tenant create ml-research \
#     --display-name "ML Research Team" \
#     --quota-gpus 128 \
#     --quota-cost 50000
#
# List tenants:
#   kfctl tenant list
#
# Output:
# NAME                  MEMBERS  JOBS  GPUS  QUOTA-USAGE  HEALTH
# ml-research           4        23    64    75%          healthy
# production-inference  2        45    128   82%          warning
# university-collab     2        3     8     40%          healthy
#
# Add member:
#   kfctl tenant add-member ml-research alice --role admin
#
# View tenant details:
#   kfctl tenant describe ml-research
#
# View tenant usage:
#   kfctl tenant usage ml-research
#
# Output:
# Tenant Usage: ml-research
# Period: January 2024
#
# Resource Usage:
#   GPU Hours: 1,450 / 2,000 (72.5%)
#   Cost: $37,500 / $50,000 (75%)
#   Running Jobs: 23 / 50 (46%)
#   GPUs in Use: 64 / 128 (50%)
#
# By GPU Type:
#   H100: 150 hours / 200 hours
#   A100-80G: 750 hours / 1,000 hours
#   A100-40G: 400 hours / 500 hours
#
# By User:
#   alice: $12,000 (32%)
#   bob: $9,000 (24%)
#   charlie: $8,500 (23%)
#   david: $0 (0%, viewer only)
#
# Storage Usage:
#   Home: 7.2Ti / 10Ti (72%)
#   Scratch: 38Ti / 50Ti (76%)
#   Datasets: 85Ti / 100Ti (85%)
#   Models: 15Ti / 20Ti (75%)
#
# Set tenant quota:
#   kfctl tenant set-quota ml-research --cost 60000
#
# Generate tenant report:
#   kfctl tenant report ml-research --month 2024-01 --output report.pdf

---
# Intelligent Checkpoint & Restore System for AI Training Jobs
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabriccheckpointguards.gryvia.io
spec:
  group: gryvia.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - jobSelector
                - checkpointPolicy
              properties:
                # Job targeting
                jobSelector:
                  type: object
                  description: "Label selector to match FabricAIJob resources"
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string

                # Checkpoint policy
                checkpointPolicy:
                  type: object
                  properties:
                    intervalMinutes:
                      type: integer
                      minimum: 1
                      default: 30
                      description: "Interval in minutes between periodic checkpoints"

                    emergencyCheckpoint:
                      type: object
                      description: "Emergency checkpoint triggers"
                      properties:
                        triggers:
                          type: array
                          items:
                            type: string
                            enum:
                              - GpuHealthDegraded
                              - SpotPreemptionSignal
                              - MemoryPressure
                              - LossDivergence
                              - NvlinkDegraded
                          description: "List of conditions that trigger an emergency checkpoint"

                    replication:
                      type: object
                      description: "Checkpoint replication configuration"
                      properties:
                        backend:
                          type: string
                          enum: [s3, gcs, azure-blob, nfs, pvc]
                          default: pvc
                          description: "Storage backend for replicated checkpoints"
                        copies:
                          type: integer
                          minimum: 1
                          default: 2
                          description: "Number of checkpoint copies to maintain"
                        asyncUpload:
                          type: boolean
                          default: true
                          description: "Upload checkpoints asynchronously to avoid blocking training"

                # Checkpoint validation
                validation:
                  type: object
                  properties:
                    checksumVerify:
                      type: boolean
                      default: true
                      description: "Verify checkpoint file checksums after writing"
                    tensorShapeVerify:
                      type: boolean
                      default: false
                      description: "Verify tensor shapes match expected model architecture"
                    loadTest:
                      type: boolean
                      default: false
                      description: "Attempt a trial load of the checkpoint to verify integrity"
                    retainValidOnly:
                      type: boolean
                      default: true
                      description: "Only retain checkpoints that pass validation"
                    retentionCount:
                      type: integer
                      minimum: 1
                      default: 5
                      description: "Number of valid checkpoints to retain"

                # Restore configuration
                restore:
                  type: object
                  properties:
                    autoRestore:
                      type: boolean
                      default: true
                      description: "Automatically restore from the latest valid checkpoint on job restart"
                    preferNearStorage:
                      type: boolean
                      default: true
                      description: "Prefer scheduling restored jobs near checkpoint storage"
                    injectEnvVars:
                      type: object
                      additionalProperties:
                        type: string
                      description: "Environment variables injected into restored job pods"

                # Monitoring
                monitoring:
                  type: object
                  properties:
                    exportMetrics:
                      type: boolean
                      default: true
                      description: "Export Prometheus metrics for checkpoint operations"
                    alertOnFailure:
                      type: boolean
                      default: true
                      description: "Send alerts when checkpoint operations fail"

            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Idle, Monitoring, Checkpointing, Restoring, Error]
                  description: "Current phase of the checkpoint guard"

                totalCheckpoints:
                  type: integer
                  description: "Total number of checkpoints taken"

                validCheckpoints:
                  type: integer
                  description: "Number of checkpoints that passed validation"

                lastCheckpointTime:
                  type: string
                  format: date-time
                  description: "Timestamp of the last checkpoint"

                lastValidCheckpoint:
                  type: string
                  description: "Name/path of the last valid checkpoint"

                emergencyCheckpointsTaken:
                  type: integer
                  description: "Number of emergency checkpoints triggered"

                storageUsed:
                  type: string
                  description: "Total storage consumed by retained checkpoints (e.g., 42Gi)"

                avgCheckpointDuration:
                  type: string
                  description: "Average time to complete a checkpoint (e.g., 2m30s)"

                matchedJobs:
                  type: integer
                  description: "Number of FabricAIJob resources matched by jobSelector"

                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time

      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Name
          type: string
          jsonPath: .metadata.name
        - name: Valid
          type: integer
          jsonPath: .status.validCheckpoints
        - name: LastCheckpoint
          type: string
          jsonPath: .status.lastCheckpointTime
        - name: StorageUsed
          type: string
          jsonPath: .status.storageUsed
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Namespaced
  names:
    plural: fabriccheckpointguards
    singular: fabriccheckpointguard
    kind: FabricCheckpointGuard
    shortNames:
      - fcg

---
# Example: Checkpoint guard for LLM training
apiVersion: gryvia.io/v1
kind: FabricCheckpointGuard
metadata:
  name: llm-training-guard
  namespace: default
spec:
  jobSelector:
    matchLabels:
      gryvia.io/team: ml-research
      gryvia.io/type: training

  checkpointPolicy:
    intervalMinutes: 15
    emergencyCheckpoint:
      triggers:
        - GpuHealthDegraded
        - SpotPreemptionSignal
        - MemoryPressure
        - LossDivergence
    replication:
      backend: s3
      copies: 3
      asyncUpload: true

  validation:
    checksumVerify: true
    tensorShapeVerify: true
    loadTest: false
    retainValidOnly: true
    retentionCount: 10

  restore:
    autoRestore: true
    preferNearStorage: true
    injectEnvVars:
      CHECKPOINT_DIR: "/checkpoints"
      RESUME_FROM_CHECKPOINT: "true"

  monitoring:
    exportMetrics: true
    alertOnFailure: true

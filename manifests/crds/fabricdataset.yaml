---
# Dataset Management and Versioning
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricdatasets.kubefabric.io
spec:
  group: kubefabric.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Dataset metadata
                description:
                  type: string
                type:
                  type: string
                  enum: [image, text, audio, video, tabular, multimodal]
                license:
                  type: string
                tags:
                  type: array
                  items:
                    type: string

                # Data source
                source:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [s3, gcs, azure-blob, nfs, http, git-lfs, vast]

                    # S3 configuration
                    s3:
                      type: object
                      properties:
                        bucket:
                          type: string
                        prefix:
                          type: string
                        region:
                          type: string
                        credentialsSecret:
                          type: string

                    # NFS configuration
                    nfs:
                      type: object
                      properties:
                        server:
                          type: string
                        path:
                          type: string

                    # HTTP configuration
                    http:
                      type: object
                      properties:
                        url:
                          type: string
                        checksumURL:
                          type: string

                # Versioning
                versioning:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    strategy:
                      type: string
                      enum: [snapshot, incremental, git-lfs]
                      default: snapshot
                    retentionPolicy:
                      type: object
                      properties:
                        keepLast:
                          type: integer
                          default: 10
                        keepDays:
                          type: integer

                # Current version
                version:
                  type: string
                  description: "Semantic version (e.g., 1.2.3)"

                # Caching
                cache:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    storageClass:
                      type: string
                      default: vast-data
                    size:
                      type: string
                      description: "Cache size (e.g., 100Gi)"
                    warmup:
                      type: boolean
                      default: false
                      description: "Pre-load cache on first access"

                # Access control
                access:
                  type: object
                  properties:
                    public:
                      type: boolean
                      default: false
                    allowedTeams:
                      type: array
                      items:
                        type: string
                    allowedUsers:
                      type: array
                      items:
                        type: string

                # Preprocessing
                preprocessing:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    pipeline:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          type:
                            type: string
                            enum: [resize, normalize, augment, tokenize, custom]
                          params:
                            type: object

                # Statistics
                statistics:
                  type: object
                  properties:
                    sampleCount:
                      type: integer
                    totalSizeBytes:
                      type: integer
                    fileCount:
                      type: integer
                    checksums:
                      type: object
                      additionalProperties:
                        type: string

            status:
              type: object
              properties:
                state:
                  type: string
                  enum: [initializing, ready, error, syncing]

                currentVersion:
                  type: string

                versions:
                  type: array
                  items:
                    type: object
                    properties:
                      version:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                      size:
                        type: integer
                      checksum:
                        type: string
                      changes:
                        type: string

                cacheStatus:
                  type: object
                  properties:
                    cached:
                      type: boolean
                    hitRate:
                      type: number
                    lastAccess:
                      type: string
                      format: date-time

                usage:
                  type: object
                  properties:
                    jobsUsing:
                      type: integer
                    lastUsedBy:
                      type: string
                    totalAccesses:
                      type: integer

      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Version
          type: string
          jsonPath: .status.currentVersion
        - name: Size
          type: string
          jsonPath: .status.versions[0].size
        - name: State
          type: string
          jsonPath: .status.state
        - name: Jobs-Using
          type: integer
          jsonPath: .status.usage.jobsUsing
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Cluster
  names:
    plural: fabricdatasets
    singular: fabricdataset
    kind: FabricDataset
    shortNames:
      - fds

---
# Example: ImageNet Dataset
apiVersion: kubefabric.io/v1
kind: FabricDataset
metadata:
  name: imagenet-2012
spec:
  description: "ImageNet ILSVRC 2012 classification dataset"
  type: image
  license: "research-only"
  tags: [imagenet, classification, vision]

  source:
    type: s3
    s3:
      bucket: datasets-archive
      prefix: imagenet/ILSVRC2012
      region: us-west-2
      credentialsSecret: aws-credentials

  versioning:
    enabled: true
    strategy: snapshot
    retentionPolicy:
      keepLast: 5

  version: "1.0.0"

  cache:
    enabled: true
    storageClass: vast-data
    size: 200Gi
    warmup: true  # Pre-load for faster access

  access:
    public: false
    allowedTeams:
      - ml-research
      - vision-team

  preprocessing:
    enabled: true
    pipeline:
      - name: resize
        type: resize
        params:
          size: [224, 224]
      - name: normalize
        type: normalize
        params:
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]

  statistics:
    sampleCount: 1281167
    totalSizeBytes: 147000000000  # 147 GB
    fileCount: 1281167

---
# Example: LLM Training Corpus
apiVersion: kubefabric.io/v1
kind: FabricDataset
metadata:
  name: llm-training-corpus-v2
spec:
  description: "Large language model training corpus"
  type: text
  license: "internal-use"
  tags: [llm, text, pre-training]

  source:
    type: vast
    nfs:
      server: vast-cluster.company.com
      path: /datasets/llm-corpus-v2

  versioning:
    enabled: true
    strategy: incremental
    retentionPolicy:
      keepLast: 10
      keepDays: 90

  version: "2.1.0"

  cache:
    enabled: true
    size: 2Ti
    warmup: false

  access:
    public: false
    allowedTeams:
      - nlp-team
      - llm-research

  preprocessing:
    enabled: true
    pipeline:
      - name: tokenize
        type: tokenize
        params:
          tokenizer: sentencepiece
          vocab_size: 50000

  statistics:
    sampleCount: 500000000  # 500M documents
    totalSizeBytes: 5000000000000  # 5 TB
    fileCount: 10000

---
# Example: Audio Dataset with Augmentation
apiVersion: kubefabric.io/v1
kind: FabricDataset
metadata:
  name: speech-recognition-corpus
spec:
  description: "Multi-lingual speech recognition dataset"
  type: audio
  tags: [speech, asr, audio]

  source:
    type: gcs
    gcs:
      bucket: speech-datasets
      prefix: multi-lingual-v3

  version: "3.0.0"

  cache:
    enabled: true
    size: 500Gi

  preprocessing:
    enabled: true
    pipeline:
      - name: resample
        type: custom
        params:
          sample_rate: 16000
      - name: augment
        type: augment
        params:
          noise_injection: 0.1
          time_stretch: [0.9, 1.1]
          pitch_shift: [-2, 2]

  statistics:
    sampleCount: 10000000
    totalSizeBytes: 500000000000

---
# Example: Using Dataset in Job
apiVersion: kubefabric.io/v1
kind: FabricAIJob
metadata:
  name: imagenet-training
spec:
  framework: pytorch

  # Reference dataset
  datasets:
    - name: training-data
      datasetRef: imagenet-2012
      mountPath: /data/imagenet
      version: "1.0.0"  # Pin to specific version

  resources:
    gpuType: A100-80G
    gpuCount: 8

  image: nvcr.io/nvidia/pytorch:24.01-py3
  command:
    - python
    - train.py
    - --data=/data/imagenet
    - --batch-size=256

---
# Dataset Version History
apiVersion: kubefabric.io/v1
kind: FabricDataset
metadata:
  name: imagenet-2012
status:
  state: ready
  currentVersion: "1.0.0"

  versions:
    - version: "1.0.0"
      createdAt: "2024-01-01T00:00:00Z"
      size: 147000000000
      checksum: sha256:abcd1234...
      changes: "Initial version"

    - version: "1.0.1"
      createdAt: "2024-01-15T00:00:00Z"
      size: 147000000000
      checksum: sha256:efgh5678...
      changes: "Fixed corrupted images in validation set"

  cacheStatus:
    cached: true
    hitRate: 98.5
    lastAccess: "2024-01-21T14:00:00Z"

  usage:
    jobsUsing: 5
    lastUsedBy: "imagenet-training-42"
    totalAccesses: 1247

---
# CLI Usage Examples
#
# List datasets:
#   kfctl dataset list
#
# Output:
# NAME                      TYPE    VERSION  SIZE    STATE   JOBS  AGE
# imagenet-2012             image   1.0.0    147GB   ready   5     45d
# llm-training-corpus-v2    text    2.1.0    5TB     ready   12    20d
# speech-recognition-corpus audio   3.0.0    500GB   ready   3     10d
#
# View dataset details:
#   kfctl dataset describe imagenet-2012
#
# Create new version:
#   kfctl dataset version create imagenet-2012 \
#     --version 1.0.2 \
#     --changes "Added 10k new samples"
#
# Download dataset:
#   kfctl dataset download imagenet-2012 \
#     --version 1.0.0 \
#     --output /local/path
#
# Upload dataset:
#   kfctl dataset upload my-dataset \
#     --source /local/data \
#     --type image \
#     --description "My custom dataset"
#
# View version history:
#   kfctl dataset versions imagenet-2012
#
# Output:
# VERSION  DATE                SIZE   CHANGES
# 1.0.1    2024-01-15 00:00   147GB  Fixed corrupted validation images
# 1.0.0    2024-01-01 00:00   147GB  Initial version
#
# Cache dataset:
#   kfctl dataset cache imagenet-2012 --warmup
#
# View cache statistics:
#   kfctl dataset cache-stats imagenet-2012
#
# Output:
# Cache Statistics: imagenet-2012
#
# Status: Cached
# Hit Rate: 98.5%
# Cache Size: 147 GB / 200 GB (73%)
# Last Access: 2 hours ago
# Access Count: 1,247
#
# Jobs Using:
#   - imagenet-training-42 (running)
#   - imagenet-training-41 (completed)
#   - resnet-benchmark (running)
#   - efficientnet-training (running)
#   - vit-finetuning (queued)
#
# Share dataset:
#   kfctl dataset share imagenet-2012 --team vision-team
#
# Generate dataset card:
#   kfctl dataset card imagenet-2012 --output dataset-card.md

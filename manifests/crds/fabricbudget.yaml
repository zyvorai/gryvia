---
# Enhanced Budget Management CRD
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricbudgets.gryvia.io
spec:
  group: gryvia.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Team or namespace this budget applies to
                scope:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [team, namespace, user, project]
                    name:
                      type: string
                  required: [type, name]

                # Budget period
                period:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [daily, weekly, monthly, quarterly, annual, custom]
                    startDate:
                      type: string
                      format: date-time
                    endDate:
                      type: string
                      format: date-time
                  required: [type]

                # Budget limits
                limits:
                  type: object
                  properties:
                    # Cost limit in USD
                    costUSD:
                      type: number
                      minimum: 0

                    # GPU hours limit
                    gpuHours:
                      type: number
                      minimum: 0

                    # Per-GPU-type limits
                    gpuTypeHours:
                      type: object
                      additionalProperties:
                        type: number

                    # Maximum concurrent jobs
                    maxConcurrentJobs:
                      type: integer
                      minimum: 1

                    # Maximum concurrent GPUs
                    maxConcurrentGPUs:
                      type: integer
                      minimum: 1

                # Alert thresholds
                alerts:
                  type: array
                  items:
                    type: object
                    properties:
                      threshold:
                        type: number
                        minimum: 0
                        maximum: 100
                        description: "Percentage of budget consumed"
                      actions:
                        type: array
                        items:
                          type: string
                          enum: [email, slack, webhook, block]
                      recipients:
                        type: array
                        items:
                          type: string
                    required: [threshold, actions]

                # Enforcement policy
                enforcement:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    action:
                      type: string
                      enum: [warn, block, throttle]
                      default: warn
                    gracePeriod:
                      type: string
                      description: "Duration (e.g., 1h, 24h) before enforcement"

                # Rollover policy
                rollover:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    maxRolloverPercent:
                      type: integer
                      minimum: 0
                      maximum: 100
                      default: 20

                # Priority levels
                priority:
                  type: object
                  properties:
                    # Allow overriding budget for high priority jobs
                    allowOverride:
                      type: boolean
                      default: false
                    overrideLimitPercent:
                      type: integer
                      minimum: 0
                      default: 10

            status:
              type: object
              properties:
                # Current period status
                currentPeriod:
                  type: object
                  properties:
                    startDate:
                      type: string
                      format: date-time
                    endDate:
                      type: string
                      format: date-time
                    daysRemaining:
                      type: integer

                # Current usage
                usage:
                  type: object
                  properties:
                    costUSD:
                      type: number
                    gpuHours:
                      type: number
                    gpuTypeHours:
                      type: object
                      additionalProperties:
                        type: number
                    jobCount:
                      type: integer
                    currentConcurrentJobs:
                      type: integer
                    currentConcurrentGPUs:
                      type: integer

                # Utilization percentages
                utilization:
                  type: object
                  properties:
                    costPercent:
                      type: number
                    gpuHoursPercent:
                      type: number
                    jobsPercent:
                      type: number

                # Budget status
                state:
                  type: string
                  enum: [active, warning, exceeded, blocked]

                # Alert history
                alerts:
                  type: array
                  items:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                      threshold:
                        type: number
                      message:
                        type: string

                # Projected end-of-period usage
                forecast:
                  type: object
                  properties:
                    projectedCostUSD:
                      type: number
                    projectedGPUHours:
                      type: number
                    budgetSufficient:
                      type: boolean
                    estimatedExhaustionDate:
                      type: string
                      format: date-time

      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Scope
          type: string
          jsonPath: .spec.scope.name
        - name: Period
          type: string
          jsonPath: .spec.period.type
        - name: Budget
          type: string
          jsonPath: .spec.limits.costUSD
        - name: Used
          type: string
          jsonPath: .status.usage.costUSD
        - name: Utilization
          type: string
          jsonPath: .status.utilization.costPercent
        - name: State
          type: string
          jsonPath: .status.state
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Cluster
  names:
    plural: fabricbudgets
    singular: fabricbudget
    kind: FabricBudget
    shortNames:
      - fbudget
      - fbudgets

---
# Example: Monthly Team Budget
apiVersion: gryvia.io/v1
kind: FabricBudget
metadata:
  name: ml-research-monthly
spec:
  scope:
    type: team
    name: ml-research

  period:
    type: monthly
    # Auto-creates new period at start of each month

  limits:
    costUSD: 50000  # $50k/month
    gpuHours: 2000  # 2000 GPU hours
    gpuTypeHours:
      H100: 200      # Max 200 H100 hours
      A100-80G: 1000
      A100-40G: 500
      T4: 300
    maxConcurrentJobs: 50
    maxConcurrentGPUs: 128

  alerts:
    # Alert at 50% usage
    - threshold: 50
      actions: [email]
      recipients:
        - ml-team-lead@company.com

    # Alert at 75% usage
    - threshold: 75
      actions: [email, slack]
      recipients:
        - ml-team-lead@company.com

    # Alert and warn at 90% usage
    - threshold: 90
      actions: [email, slack, webhook]
      recipients:
        - ml-team-lead@company.com
        - finance@company.com

    # Block at 100% usage
    - threshold: 100
      actions: [block, email]
      recipients:
        - ml-team-lead@company.com
        - finance@company.com

  enforcement:
    enabled: true
    action: block  # Block new jobs when budget exceeded
    gracePeriod: 2h  # 2 hour grace period

  rollover:
    enabled: true
    maxRolloverPercent: 20  # Can roll over up to 20% unused budget

  priority:
    allowOverride: true
    overrideLimitPercent: 10  # High-priority jobs can use 10% over budget

---
# Example: Quarterly Project Budget
apiVersion: gryvia.io/v1
kind: FabricBudget
metadata:
  name: llm-training-q1
spec:
  scope:
    type: project
    name: llm-training

  period:
    type: quarterly
    startDate: "2024-01-01T00:00:00Z"
    endDate: "2024-03-31T23:59:59Z"

  limits:
    costUSD: 500000  # $500k for the quarter
    gpuHours: 20000

  alerts:
    - threshold: 80
      actions: [email, slack]
      recipients:
        - project-manager@company.com

  enforcement:
    enabled: true
    action: warn  # Just warn, don't block
    gracePeriod: 24h

  rollover:
    enabled: false  # No rollover for project budgets

---
# Example: User Daily Budget (Development)
apiVersion: gryvia.io/v1
kind: FabricBudget
metadata:
  name: dev-user-alice-daily
spec:
  scope:
    type: user
    name: alice

  period:
    type: daily

  limits:
    costUSD: 500  # $500/day for development
    gpuHours: 20
    maxConcurrentJobs: 5
    maxConcurrentGPUs: 8

  alerts:
    - threshold: 80
      actions: [email]
      recipients:
        - alice@company.com

  enforcement:
    enabled: true
    action: throttle  # Throttle to lower priority
    gracePeriod: 1h

---
# Example: Namespace Weekly Budget
apiVersion: gryvia.io/v1
kind: FabricBudget
metadata:
  name: production-weekly
spec:
  scope:
    type: namespace
    name: production

  period:
    type: weekly

  limits:
    costUSD: 25000  # $25k/week
    gpuHours: 1000
    maxConcurrentGPUs: 64

  alerts:
    - threshold: 90
      actions: [email, slack, webhook]
      recipients:
        - ops-team@company.com
        - on-call@company.com

  enforcement:
    enabled: true
    action: block
    gracePeriod: 30m  # Short grace period for production

  priority:
    allowOverride: true
    overrideLimitPercent: 25  # Production can burst to 125%

---
# Budget Status Example
apiVersion: gryvia.io/v1
kind: FabricBudget
metadata:
  name: ml-research-monthly
status:
  currentPeriod:
    startDate: "2024-01-01T00:00:00Z"
    endDate: "2024-01-31T23:59:59Z"
    daysRemaining: 12

  usage:
    costUSD: 37500  # $37.5k used
    gpuHours: 1500
    gpuTypeHours:
      H100: 150
      A100-80G: 750
      A100-40G: 400
      T4: 200
    jobCount: 342
    currentConcurrentJobs: 23
    currentConcurrentGPUs: 64

  utilization:
    costPercent: 75  # 75% of budget used
    gpuHoursPercent: 75
    jobsPercent: 46

  state: warning  # In warning state

  alerts:
    - timestamp: "2024-01-10T08:00:00Z"
      threshold: 50
      message: "Budget 50% consumed"
    - timestamp: "2024-01-18T14:30:00Z"
      threshold: 75
      message: "Budget 75% consumed - warning state"

  forecast:
    projectedCostUSD: 64285  # Projected to exceed budget
    projectedGPUHours: 2571
    budgetSufficient: false
    estimatedExhaustionDate: "2024-01-28T16:00:00Z"

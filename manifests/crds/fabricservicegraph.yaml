apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricservicegraphs.gryvia.io
spec:
  group: gryvia.io
  names:
    kind: FabricServiceGraph
    listKind: FabricServiceGraphList
    plural: fabricservicegraphs
    singular: fabricservicegraph
    shortNames: [fsg]
    categories: [gryvia, all]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                namespaces:
                  type: array
                  items:
                    type: string
                refreshInterval:
                  type: string
                  description: "Interval between graph refreshes (e.g., 30s, 5m)"
                includeExternal:
                  type: boolean
                depth:
                  type: integer
                  minimum: 1
                  maximum: 10
            status:
              type: object
              properties:
                nodes:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      namespace: {type: string}
                      type: {type: string}
                      health: {type: string, enum: [healthy, degraded, unhealthy, unknown]}
                edges:
                  type: array
                  items:
                    type: object
                    properties:
                      source: {type: string}
                      destination: {type: string}
                      protocol: {type: string}
                      port: {type: integer}
                      latencyP99: {type: string}
                      throughput: {type: string}
                      verdict: {type: string, enum: [forwarded, dropped, error]}
                lastUpdated: {type: string, format: date-time}
      subresources:
        status: {}

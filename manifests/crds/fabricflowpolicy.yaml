apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricflowpolicies.tensorreaper.ai
spec:
  group: tensorreaper.ai
  names:
    kind: FabricFlowPolicy
    listKind: FabricFlowPolicyList
    plural: fabricflowpolicies
    singular: fabricflowpolicy
    shortNames: [ffp]
    categories: [tensorreaper, all]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                source:
                  type: object
                  properties:
                    service: {type: string}
                    namespace: {type: string}
                    labels: {type: object, additionalProperties: {type: string}}
                destination:
                  type: object
                  properties:
                    service: {type: string}
                    namespace: {type: string}
                    port: {type: integer}
                    labels: {type: object, additionalProperties: {type: string}}
                protocol: {type: string, enum: [tcp, udp, icmp, any]}
                action: {type: string, enum: [allow, deny, log]}
                intent: {type: string, enum: [low-latency, high-throughput, secure, default]}
                priority: {type: integer, minimum: 0, maximum: 1000}
            status:
              type: object
              properties:
                phase: {type: string}
                ciliumPolicyRef: {type: string}
                enforced: {type: boolean}
                lastApplied: {type: string, format: date-time}
                matchedFlows: {type: integer}
      subresources:
        status: {}

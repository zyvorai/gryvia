---
# FabricTrainingProfiler - Automatic GPU Efficiency Analysis
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabrictrainingprofilers.tensorreaper.ai
spec:
  group: tensorreaper.ai
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Target configuration - which jobs to profile
                target:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [auto, on-demand, job-ref]
                      default: auto
                      description: "Profiling mode: auto profiles all matching jobs, on-demand waits for trigger, job-ref targets a specific job"
                    jobSelector:
                      type: object
                      additionalProperties:
                        type: string
                      description: "Label selector to match FabricAIJob resources"
                    jobRef:
                      type: string
                      description: "Name of a specific FabricAIJob to profile (used with type: job-ref)"
                    autoProfile:
                      type: object
                      properties:
                        warmupSteps:
                          type: integer
                          default: 100
                          description: "Number of training steps to skip before profiling begins"
                        profileSteps:
                          type: integer
                          default: 50
                          description: "Number of steps to profile"
                        cooldownMinutes:
                          type: integer
                          default: 30
                          description: "Minimum minutes between profiling sessions for the same job"

                # Metrics to collect
                metrics:
                  type: object
                  properties:
                    gpuCompute:
                      type: object
                      properties:
                        smUtilization:
                          type: boolean
                          default: true
                          description: "Collect streaming multiprocessor utilization"
                        tensorCoreUtilization:
                          type: boolean
                          default: true
                          description: "Collect tensor core utilization"
                        flopsEfficiency:
                          type: boolean
                          default: true
                          description: "Calculate FLOPS efficiency vs theoretical peak"
                    gpuMemory:
                      type: object
                      properties:
                        memoryBandwidthUtilization:
                          type: boolean
                          default: true
                          description: "Measure HBM bandwidth utilization"
                        peakMemoryUsage:
                          type: boolean
                          default: true
                          description: "Track peak GPU memory usage"
                    dataPipeline:
                      type: object
                      properties:
                        ioWaitRatio:
                          type: boolean
                          default: true
                          description: "Measure ratio of time GPU waits for data"
                        dataloaderThroughput:
                          type: boolean
                          default: true
                          description: "Measure data loading throughput in samples/sec"
                    communication:
                      type: object
                      properties:
                        ncclBandwidth:
                          type: boolean
                          default: true
                          description: "Measure NCCL collective bandwidth"
                        allReduceTime:
                          type: boolean
                          default: true
                          description: "Measure time spent in allreduce operations"
                        computeCommOverlap:
                          type: boolean
                          default: true
                          description: "Measure compute-communication overlap efficiency"

                # Analysis configuration
                analysis:
                  type: object
                  properties:
                    compareBaseline:
                      type: boolean
                      default: true
                      description: "Compare metrics against known baselines for the GPU type"
                    baselineSource:
                      type: string
                      enum: [builtin, custom]
                      default: builtin
                      description: "Source of baseline data for comparison"
                    recommendations:
                      type: object
                      properties:
                        batchSize:
                          type: boolean
                          default: true
                          description: "Recommend batch size adjustments"
                        dataLoading:
                          type: boolean
                          default: true
                          description: "Recommend data loading optimizations"
                        mixedPrecision:
                          type: boolean
                          default: true
                          description: "Recommend mixed precision training"
                        compilationOptimization:
                          type: boolean
                          default: true
                          description: "Recommend torch.compile or XLA optimizations"
                        distributedStrategy:
                          type: boolean
                          default: true
                          description: "Recommend distributed training strategy changes"
                        gpuTypeRecommendation:
                          type: boolean
                          default: true
                          description: "Recommend alternative GPU types for cost-performance"
                    severityThreshold:
                      type: string
                      enum: [info, warning, critical]
                      default: warning
                      description: "Minimum severity level for recommendations"

                # Output configuration
                output:
                  type: object
                  properties:
                    storeInJobStatus:
                      type: boolean
                      default: true
                      description: "Store profiling results in FabricAIJob status"
                    emitEvents:
                      type: boolean
                      default: true
                      description: "Emit Kubernetes events for recommendations"
                    prometheusMetrics:
                      type: boolean
                      default: true
                      description: "Expose profiling data as Prometheus metrics"

            status:
              type: object
              properties:
                jobsProfiled:
                  type: integer
                  description: "Total number of jobs profiled"
                avgMFU:
                  type: number
                  format: double
                  description: "Average Model FLOPS Utilization across profiled jobs (0-100%)"
                topRecommendations:
                  type: array
                  items:
                    type: object
                    properties:
                      jobName:
                        type: string
                      category:
                        type: string
                      severity:
                        type: string
                        enum: [info, warning, critical]
                      description:
                        type: string
                      estimatedImpact:
                        type: string
                      timestamp:
                        type: string
                        format: date-time
                  description: "Most recent high-impact recommendations"
                clusterEfficiencyScore:
                  type: number
                  format: double
                  description: "Overall cluster GPU efficiency score (0-100)"
                lastProfileTime:
                  type: string
                  format: date-time
                  description: "Timestamp of the last profiling run"
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time

      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Name
          type: string
          jsonPath: .metadata.name
        - name: JobsProfiled
          type: integer
          jsonPath: .status.jobsProfiled
        - name: AvgMFU
          type: number
          jsonPath: .status.avgMFU
          format: float
        - name: EfficiencyScore
          type: number
          jsonPath: .status.clusterEfficiencyScore
          format: float
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Namespaced
  names:
    plural: fabrictrainingprofilers
    singular: fabrictrainingprofiler
    kind: FabricTrainingProfiler
    shortNames:
      - ftp
      - fprofiler

---
# Example: Automatic GPU Profiler for all training jobs
apiVersion: tensorreaper.ai/v1
kind: FabricTrainingProfiler
metadata:
  name: cluster-gpu-profiler
  namespace: default
spec:
  target:
    type: auto
    jobSelector:
      tensorreaper.ai/type: training
    autoProfile:
      warmupSteps: 100
      profileSteps: 50
      cooldownMinutes: 30

  metrics:
    gpuCompute:
      smUtilization: true
      tensorCoreUtilization: true
      flopsEfficiency: true
    gpuMemory:
      memoryBandwidthUtilization: true
      peakMemoryUsage: true
    dataPipeline:
      ioWaitRatio: true
      dataloaderThroughput: true
    communication:
      ncclBandwidth: true
      allReduceTime: true
      computeCommOverlap: true

  analysis:
    compareBaseline: true
    baselineSource: builtin
    recommendations:
      batchSize: true
      dataLoading: true
      mixedPrecision: true
      compilationOptimization: true
      distributedStrategy: true
      gpuTypeRecommendation: true
    severityThreshold: warning

  output:
    storeInJobStatus: true
    emitEvents: true
    prometheusMetrics: true

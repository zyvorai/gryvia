---
# Advanced Networking for GPU Workloads
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricnetworkpolicies.kubefabric.io
spec:
  group: kubefabric.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Network topology
                topology:
                  type: string
                  enum: [infiniband, roce, ethernet, multi-rail]
                  description: "Network topology type"

                # InfiniBand configuration
                infiniband:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false

                    # IB speed
                    speed:
                      type: string
                      enum: [HDR200, HDR, EDR, FDR]
                      default: HDR200
                      description: "200Gb/s, 100Gb/s, 56Gb/s, 40Gb/s"

                    # Subnet manager
                    subnetManager:
                      type: string

                    # RDMA configuration
                    rdma:
                      type: object
                      properties:
                        mode:
                          type: string
                          enum: [exclusive, shared]
                          default: exclusive

                        devicesPerNode:
                          type: integer
                          default: 8

                # RoCE configuration
                roce:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false

                    version:
                      type: string
                      enum: [v1, v2]
                      default: v2

                    # Flow control
                    pfc:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true
                        priorities:
                          type: array
                          items:
                            type: integer

                    # ECN
                    ecn:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: true

                # SR-IOV configuration
                sriov:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false

                    # Virtual functions per physical NIC
                    vfsPerNIC:
                      type: integer
                      minimum: 1
                      maximum: 128
                      default: 8

                    # Resource pool
                    resourcePool:
                      type: string
                      description: "SR-IOV resource pool name"

                # GPUDirect RDMA
                gpuDirect:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                      description: "Enable GPUDirect RDMA for peer-to-peer GPU communication"

                    # Require NVLink + IB on same NUMA
                    numaAffinity:
                      type: boolean
                      default: true

                # NCCL optimization
                nccl:
                  type: object
                  properties:
                    # Network interface to use
                    socketIfName:
                      type: string
                      description: "Network interface for NCCL (e.g., ib0)"

                    # IB settings
                    ibGidIndex:
                      type: integer
                      default: 3

                    ibTc:
                      type: integer
                      default: 136

                    # Tuning
                    minNRings:
                      type: integer
                      default: 8

                    maxNRings:
                      type: integer
                      default: 16

                    # Protocols
                    ibDisable:
                      type: boolean
                      default: false

                    p2pDisable:
                      type: boolean
                      default: false

                # Bandwidth reservations
                bandwidthReservation:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false

                    # Minimum guaranteed bandwidth
                    minBandwidthGbps:
                      type: number

                    # Maximum bandwidth limit
                    maxBandwidthGbps:
                      type: number

                # Network segmentation
                segmentation:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false

                    # VLANs for isolation
                    vlans:
                      type: object
                      properties:
                        management:
                          type: integer
                        storage:
                          type: integer
                        compute:
                          type: integer

                # Quality of Service
                qos:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false

                    trafficClasses:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          priority:
                            type: integer
                          bandwidth:
                            type: string

            status:
              type: object
              properties:
                state:
                  type: string
                  enum: [active, configuring, error]

                interfaces:
                  type: array
                  items:
                    type: object
                    properties:
                      node:
                        type: string
                      interface:
                        type: string
                      speed:
                        type: string
                      state:
                        type: string

                bandwidth:
                  type: object
                  properties:
                    total:
                      type: number
                    used:
                      type: number
                    available:
                      type: number

      additionalPrinterColumns:
        - name: Topology
          type: string
          jsonPath: .spec.topology
        - name: GPUDirect
          type: boolean
          jsonPath: .spec.gpuDirect.enabled
        - name: State
          type: string
          jsonPath: .status.state
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Cluster
  names:
    plural: fabricnetworkpolicies
    singular: fabricnetworkpolicy
    kind: FabricNetworkPolicy
    shortNames:
      - fnetpol

---
# Example: InfiniBand HDR200 Configuration
apiVersion: kubefabric.io/v1
kind: FabricNetworkPolicy
metadata:
  name: infiniband-hdr200
spec:
  topology: infiniband

  infiniband:
    enabled: true
    speed: HDR200  # 200 Gb/s
    subnetManager: ib-sm.cluster.local
    rdma:
      mode: exclusive
      devicesPerNode: 8

  gpuDirect:
    enabled: true
    numaAffinity: true

  nccl:
    socketIfName: "ib0"
    ibGidIndex: 3
    ibTc: 136
    minNRings: 8
    maxNRings: 16
    ibDisable: false
    p2pDisable: false

  bandwidthReservation:
    enabled: true
    minBandwidthGbps: 100
    maxBandwidthGbps: 200

---
# Example: RoCEv2 Configuration
apiVersion: kubefabric.io/v1
kind: FabricNetworkPolicy
metadata:
  name: roce-v2
spec:
  topology: roce

  roce:
    enabled: true
    version: v2
    pfc:
      enabled: true
      priorities: [3, 4]
    ecn:
      enabled: true

  sriov:
    enabled: true
    vfsPerNIC: 16
    resourcePool: mellanox-rdma

  gpuDirect:
    enabled: true

  nccl:
    socketIfName: "enp0s3f0"
    minNRings: 4
    maxNRings: 8

---
# Example: Multi-Rail Network
apiVersion: kubefabric.io/v1
kind: FabricNetworkPolicy
metadata:
  name: multi-rail
spec:
  topology: multi-rail

  # Use multiple network interfaces for bandwidth aggregation
  infiniband:
    enabled: true
    speed: HDR200
    rdma:
      mode: exclusive
      devicesPerNode: 8  # 8 IB interfaces per node

  nccl:
    # Use all IB interfaces
    socketIfName: "ib0,ib1,ib2,ib3,ib4,ib5,ib6,ib7"
    minNRings: 16
    maxNRings: 32

  segmentation:
    enabled: true
    vlans:
      management: 100
      storage: 200
      compute: 300

---
# Example: Job with Network Requirements
apiVersion: kubefabric.io/v1
kind: FabricAIJob
metadata:
  name: distributed-training-ib
spec:
  framework: pytorch

  # Network requirements
  network:
    policyRef: infiniband-hdr200
    gpuDirectRequired: true
    minBandwidthGbps: 100

  # Enable NCCL optimizations
  env:
    - name: NCCL_SOCKET_IFNAME
      value: "ib0"
    - name: NCCL_IB_GID_INDEX
      value: "3"
    - name: NCCL_IB_TC
      value: "136"
    - name: NCCL_IB_DISABLE
      value: "0"
    - name: NCCL_NET_GDR_LEVEL
      value: "5"  # Enable GPUDirect RDMA

  distributed:
    enabled: true
    strategy: ddp
    worldSize: 64

  resources:
    gpuType: A100-80G
    gpuCount: 64

  image: nvcr.io/nvidia/pytorch:24.01-py3
  command:
    - torchrun
    - --nproc_per_node=8
    - --nnodes=8
    - train.py

---
# Network Performance Test
apiVersion: kubefabric.io/v1
kind: FabricNetworkTest
metadata:
  name: ib-bandwidth-test
spec:
  testType: bandwidth

  # Test configuration
  nodes:
    - gpu-node-01
    - gpu-node-02

  duration: 60s

  tests:
    - name: all-reduce
      type: nccl-test
      messageSize: [8, 16, 32, 64, 128, 256, 512, 1024, 2048]  # MB
      iterations: 100

    - name: ib-write-bw
      type: perftest
      command: ib_write_bw
      args: [-a, -d, mlx5_0, -s, 1048576]

    - name: gpu-direct-bw
      type: perftest
      command: ib_write_bw
      args: [--use_cuda, -d, mlx5_0]

---
# CLI Usage Examples
#
# List network policies:
#   kfctl network policies list
#
# Output:
# NAME              TOPOLOGY     GPUDIRECT  BANDWIDTH      STATE
# infiniband-hdr200 infiniband   enabled    100-200 Gb/s   active
# roce-v2           roce         enabled    25-100 Gb/s    active
# multi-rail        multi-rail   enabled    1.6 Tb/s       active
#
# View network policy:
#   kfctl network policy describe infiniband-hdr200
#
# Test network performance:
#   kfctl network test bandwidth \
#     --nodes gpu-node-01,gpu-node-02 \
#     --gpus-per-node 8

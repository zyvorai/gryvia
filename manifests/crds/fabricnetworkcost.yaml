apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricnetworkcosts.gryvia.io
spec:
  group: gryvia.io
  names:
    kind: FabricNetworkCost
    listKind: FabricNetworkCostList
    plural: fabricnetworkcosts
    singular: fabricnetworkcost
    shortNames: [fnc]
    categories: [gryvia, all]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                targetNamespaces:
                  type: array
                  items:
                    type: string
                costPerGB:
                  type: object
                  properties:
                    sameZone:
                      type: number
                      format: double
                    crossZone:
                      type: number
                      format: double
                    internetEgress:
                      type: number
                      format: double
                reportingInterval:
                  type: string
                  description: "Interval between cost reports (e.g., 1h, 24h)"
                costCenters:
                  type: array
                  items:
                    type: object
                    properties:
                      namespace:
                        type: string
                      team:
                        type: string
                      costCenter:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                reports:
                  type: array
                  items:
                    type: object
                    properties:
                      period:
                        type: string
                      namespace:
                        type: string
                      team:
                        type: string
                      sameZoneBytes:
                        type: integer
                        format: int64
                      crossZoneBytes:
                        type: integer
                        format: int64
                      externalBytes:
                        type: integer
                        format: int64
                      totalCostUSD:
                        type: number
                        format: double
                lastReport:
                  type: string
                  format: date-time
      subresources:
        status: {}

---
# Multi-Cluster Federation
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricfederations.gryvia.io
spec:
  group: gryvia.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Member clusters
                clusters:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      region:
                        type: string
                        description: "Geographic region (us-west, us-east, eu-central, etc.)"

                      # Connection info
                      apiServer:
                        type: string
                      credentials:
                        type: object
                        properties:
                          secretRef:
                            type: string

                      # Capacity
                      capacity:
                        type: object
                        properties:
                          gpuTypes:
                            type: array
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                total:
                                  type: integer
                                available:
                                  type: integer

                      # Pricing
                      pricing:
                        type: object
                        properties:
                          currency:
                            type: string
                            default: USD
                          gpuHourlyRates:
                            type: object
                            additionalProperties:
                              type: number

                      # Network connectivity
                      network:
                        type: object
                        properties:
                          latency:
                            type: string
                            description: "Network latency to other clusters"
                          bandwidth:
                            type: string

                      # Status
                      enabled:
                        type: boolean
                        default: true
                      priority:
                        type: integer
                        default: 100

                # Job distribution policy
                distribution:
                  type: object
                  properties:
                    # How to distribute jobs
                    strategy:
                      type: string
                      enum: [cost-optimized, latency-optimized, locality-preferred, round-robin, capacity-based]
                      default: cost-optimized

                    # Affinity rules
                    affinity:
                      type: object
                      properties:
                        # Prefer specific regions
                        regionAffinity:
                          type: array
                          items:
                            type: string

                        # Data locality
                        dataLocality:
                          type: boolean
                          default: true
                          description: "Prefer cluster where data is located"

                    # Constraints
                    constraints:
                      type: object
                      properties:
                        # Maximum latency between clusters
                        maxLatency:
                          type: string

                        # Data sovereignty
                        dataSovereignty:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                            allowedRegions:
                              type: array
                              items:
                                type: string

                # Failover configuration
                failover:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false

                    # Automatic failover
                    automatic:
                      type: boolean
                      default: true

                    # Health check
                    healthCheck:
                      type: object
                      properties:
                        interval:
                          type: string
                          default: 30s
                        timeout:
                          type: string
                          default: 10s
                        failureThreshold:
                          type: integer
                          default: 3

                # Load balancing
                loadBalancing:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true

                    # Algorithm
                    algorithm:
                      type: string
                      enum: [round-robin, least-loaded, weighted, random]
                      default: least-loaded

                    # Weights per cluster
                    weights:
                      type: object
                      additionalProperties:
                        type: integer

                # Resource sharing
                resourceSharing:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true

                    # Burst to other clusters
                    burstingEnabled:
                      type: boolean
                      default: true

                    # Max resources to share
                    maxSharedPercentage:
                      type: integer
                      minimum: 0
                      maximum: 100
                      default: 50

                # Cost management
                costManagement:
                  type: object
                  properties:
                    # Optimize for cost
                    enabled:
                      type: boolean
                      default: true

                    # Maximum cost per hour
                    maxCostPerHour:
                      type: number

                    # Prefer cheaper clusters
                    preferCheaper:
                      type: boolean
                      default: true

            status:
              type: object
              properties:
                # Overall status
                state:
                  type: string
                  enum: [healthy, degraded, unavailable]

                # Per-cluster status
                clusterStatus:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      state:
                        type: string
                        enum: [healthy, unhealthy, unreachable]
                      lastHealthCheck:
                        type: string
                        format: date-time

                      # Current utilization
                      utilization:
                        type: object
                        properties:
                          gpus:
                            type: integer
                          percentage:
                            type: number

                # Aggregate stats
                aggregateStats:
                  type: object
                  properties:
                    totalGPUs:
                      type: integer
                    availableGPUs:
                      type: integer
                    jobsRunning:
                      type: integer
                    totalCostPerHour:
                      type: number

                # Job distribution
                jobDistribution:
                  type: object
                  additionalProperties:
                    type: integer

      additionalPrinterColumns:
        - name: State
          type: string
          jsonPath: .status.state
        - name: Clusters
          type: integer
          jsonPath: .status.aggregateStats.totalClusters
        - name: Total-GPUs
          type: integer
          jsonPath: .status.aggregateStats.totalGPUs
        - name: Available
          type: integer
          jsonPath: .status.aggregateStats.availableGPUs
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Cluster
  names:
    plural: fabricfederations
    singular: fabricfederation
    kind: FabricFederation
    shortNames:
      - ffed

---
# Example: Multi-Region Federation
apiVersion: gryvia.io/v1
kind: FabricFederation
metadata:
  name: global-federation
spec:
  clusters:
    - name: us-west-prod
      region: us-west-2
      apiServer: https://kube-usw.company.com
      credentials:
        secretRef: usw-kubeconfig
      capacity:
        gpuTypes:
          - type: A100-80G
            total: 128
            available: 64
          - type: H100
            total: 64
            available: 32
      pricing:
        currency: USD
        gpuHourlyRates:
          A100-80G: 24.00
          H100: 32.00
      network:
        latency: 0ms
        bandwidth: 100Gbps
      enabled: true
      priority: 100

    - name: us-east-prod
      region: us-east-1
      apiServer: https://kube-use.company.com
      credentials:
        secretRef: use-kubeconfig
      capacity:
        gpuTypes:
          - type: A100-80G
            total: 96
            available: 48
          - type: V100
            total: 64
            available: 32
      pricing:
        currency: USD
        gpuHourlyRates:
          A100-80G: 24.00
          V100: 16.00
      network:
        latency: 65ms
        bandwidth: 10Gbps
      enabled: true
      priority: 90

    - name: eu-central-prod
      region: eu-central-1
      apiServer: https://kube-eu.company.com
      credentials:
        secretRef: eu-kubeconfig
      capacity:
        gpuTypes:
          - type: A100-80G
            total: 64
            available: 32
      pricing:
        currency: EUR
        gpuHourlyRates:
          A100-80G: 22.00
      network:
        latency: 120ms
        bandwidth: 10Gbps
      enabled: true
      priority: 80

  distribution:
    strategy: cost-optimized
    affinity:
      regionAffinity: [us-west-2, us-east-1]
      dataLocality: true
    constraints:
      maxLatency: 100ms
      dataSovereignty:
        enabled: true
        allowedRegions: [us-west-2, us-east-1, eu-central-1]

  failover:
    enabled: true
    automatic: true
    healthCheck:
      interval: 30s
      timeout: 10s
      failureThreshold: 3

  loadBalancing:
    enabled: true
    algorithm: least-loaded
    weights:
      us-west-prod: 100
      us-east-prod: 90
      eu-central-prod: 80

  resourceSharing:
    enabled: true
    burstingEnabled: true
    maxSharedPercentage: 50

  costManagement:
    enabled: true
    maxCostPerHour: 5000
    preferCheaper: true

---
# Example: Federated Job
apiVersion: gryvia.io/v1
kind: FabricAIJob
metadata:
  name: federated-training
spec:
  framework: pytorch

  # Federation configuration
  federation:
    enabled: true
    federationRef: global-federation

    # Placement preference
    placement:
      strategy: cost-optimized
      # Prefer us-west, but allow failover
      regionPreference: [us-west-2, us-east-1]
      # Require GPU type
      gpuTypeRequired: A100-80G

    # Multi-cluster spanning
    multiCluster:
      enabled: false  # Run in single cluster
      # If true, can span job across clusters

  resources:
    gpuType: A100-80G
    gpuCount: 16

  image: nvcr.io/nvidia/pytorch:24.01-py3
  command: [python, train.py]

---
# Federated Job Status
apiVersion: gryvia.io/v1
kind: FabricAIJob
metadata:
  name: federated-training
status:
  # Where job was placed
  federation:
    placedIn: us-west-prod
    reason: "Lowest cost and available capacity"
    alternatives:
      - cluster: us-east-prod
        reason: "Higher cost: $384/hr vs $360/hr"
      - cluster: eu-central-prod
        reason: "Higher latency: 120ms"

  # Cost breakdown
  cost:
    cluster: us-west-prod
    rate: 24.00
    hours: 4.5
    total: 1728.00
    currency: USD

---
# Example: Burst Configuration
apiVersion: gryvia.io/v1
kind: FabricBurstPolicy
metadata:
  name: burst-to-cloud
spec:
  # Source cluster
  sourceCluster: on-prem-cluster

  # Target clusters for bursting
  targetClusters:
    - name: aws-us-west
      maxGPUs: 64
      maxCostPerHour: 2000
      priority: 100

    - name: gcp-us-central
      maxGPUs: 32
      maxCostPerHour: 1500
      priority: 90

  # When to burst
  triggers:
    - type: capacity
      threshold: 90  # When >90% utilized

    - type: queue-time
      threshold: 30m  # When jobs wait >30 min

  # What to burst
  jobFilter:
    priorityClass: [normal, low]
    # Don't burst high-priority jobs

  # Cost controls
  costLimits:
    maxMonthlySpend: 50000
    approvalRequired: true
    approvers:
      - finance-team@company.com

---
# CLI Usage Examples
#
# List federations:
#   kfctl federation list
#
# Output:
# NAME                STATE    CLUSTERS  TOTAL-GPUS  AVAILABLE  JOBS
# global-federation   healthy  3         352         176        145
#
# View federation details:
#   kfctl federation describe global-federation
#
# Output:
# Federation: global-federation
#
# Clusters:
#   us-west-prod (us-west-2)
#     GPUs: 128 A100-80G, 64 H100
#     Available: 64 A100-80G, 32 H100
#     Utilization: 50%
#     Pricing: $24/hr (A100), $32/hr (H100)
#     Status: Healthy
#
#   us-east-prod (us-east-1)
#     GPUs: 96 A100-80G, 64 V100
#     Available: 48 A100-80G, 32 V100
#     Utilization: 50%
#     Pricing: $24/hr (A100), $16/hr (V100)
#     Status: Healthy
#
#   eu-central-prod (eu-central-1)
#     GPUs: 64 A100-80G
#     Available: 32 A100-80G
#     Utilization: 50%
#     Pricing: €22/hr (A100)
#     Status: Healthy
#
# Strategy: cost-optimized
# Total Cost: $4,256/hour
#
# Submit federated job:
#   kfctl submit job.yaml --federation global-federation
#
# View job placement:
#   kfctl job placement my-job
#
# Output:
# Job Placement: my-job
#
# Placed In: us-west-prod
# Reason: Lowest cost and available capacity
# Cost: $360/hour (15x A100-80G @ $24/hr)
#
# Alternatives Considered:
#   us-east-prod: Higher queue time (15 min wait)
#   eu-central-prod: Higher latency (120ms vs 0ms)
#
# Move job to different cluster:
#   kfctl job migrate my-job --target-cluster us-east-prod
#
# View federation costs:
#   kfctl federation costs global-federation --last 30d
#
# Output:
# Federation Costs: global-federation (Last 30 days)
#
# By Cluster:
#   us-west-prod: $245,600 (58%)
#   us-east-prod: $128,400 (30%)
#   eu-central-prod: $52,000 (12%)
#
# Total: $426,000
#
# By Job Type:
#   Training: $325,000 (76%)
#   Inference: $85,000 (20%)
#   Development: $16,000 (4%)
#
# Optimize federation:
#   kfctl federation optimize global-federation
#
# Output:
# Federation Optimization Recommendations:
#
# 1. Migrate 12 jobs from us-west-prod to us-east-prod
#    Reason: Lower utilization in us-east-prod
#    Savings: $145/hour
#
# 2. Enable bursting to spot instances
#    Reason: 15 low-priority jobs in queue
#    Savings: $2,400/month
#
# 3. Consolidate small jobs on shared GPUs
#    Reason: 8 jobs using <25% of GPU
#    Savings: $180/hour
#
# Total Potential Savings: $65,000/month

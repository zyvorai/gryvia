---
# GPU Memory Optimizer CRD
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricgpumemoryoptimizers.tensorreaper.ai
spec:
  group: tensorreaper.ai
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - scope
              properties:
                # Scope of the optimizer
                scope:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      enum: [cluster, namespace, job-selector]
                      description: "Scope type: cluster-wide, namespace-scoped, or job-selector-scoped"
                    namespace:
                      type: string
                      description: "Target namespace (required when type is namespace)"
                    jobSelector:
                      type: object
                      description: "Label selector for jobs (required when type is job-selector)"
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string

                # OOM Prevention configuration
                oomPrevention:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                      description: "Enable OOM prevention monitoring"
                    memoryGrowthProfiling:
                      type: object
                      description: "Configure memory growth profiling for running jobs"
                      properties:
                        profileSteps:
                          type: integer
                          minimum: 5
                          default: 20
                          description: "Number of profiling steps to collect before projecting"
                        projectionMethod:
                          type: string
                          enum: [linear, exponential, polynomial]
                          default: linear
                          description: "Method used to project future memory usage"
                    preemptiveAction:
                      type: object
                      description: "Actions to take when OOM is predicted"
                      properties:
                        type:
                          type: string
                          enum: [warn, auto-mitigate, evict]
                          default: warn
                          description: "Action type: warn only, auto-mitigate, or evict the job"
                        warningThresholdPercent:
                          type: integer
                          minimum: 50
                          maximum: 99
                          default: 85
                          description: "Memory utilization percentage at which to trigger warning"
                        autoEnableGradientCheckpointing:
                          type: boolean
                          default: false
                          description: "Automatically enable gradient checkpointing via env var injection"
                        autoEnableMixedPrecision:
                          type: boolean
                          default: false
                          description: "Automatically enable mixed precision training via env var injection"
                        autoReduceBatchSize:
                          type: boolean
                          default: false
                          description: "Automatically reduce batch size via env var injection"

                # Right-sizing configuration
                rightSizing:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                      description: "Enable right-sizing recommendations"
                    analysisWindow:
                      type: string
                      default: "24h"
                      description: "Time window for analyzing memory usage patterns (e.g., 1h, 24h, 7d)"
                    recommendations:
                      type: object
                      description: "Types of right-sizing recommendations to generate"
                      properties:
                        gpuTypeDowngrade:
                          type: boolean
                          default: true
                          description: "Recommend downgrading to a GPU with less memory"
                        gpuCountReduction:
                          type: boolean
                          default: true
                          description: "Recommend reducing the number of GPUs"
                    minimumGpuMemoryHeadroom:
                      type: integer
                      minimum: 5
                      maximum: 50
                      default: 15
                      description: "Minimum headroom percentage above peak usage for recommendations"

                # Inference packing configuration
                inferencePacking:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                      description: "Enable inference model packing on shared GPUs"
                    memoryUtilizationTarget:
                      type: integer
                      minimum: 50
                      maximum: 95
                      default: 80
                      description: "Target memory utilization percentage when packing models"
                    compatibilityCheck:
                      type: boolean
                      default: true
                      description: "Verify model compatibility before co-locating on a GPU"
                    isolationLevel:
                      type: string
                      enum: [none, mps, mig]
                      default: mps
                      description: "GPU isolation level for packed workloads"

            status:
              type: object
              properties:
                jobsAnalyzed:
                  type: integer
                  description: "Total number of jobs analyzed"
                oomPrevented:
                  type: integer
                  description: "Number of OOM events prevented"
                rightSizingRecommendations:
                  type: integer
                  description: "Number of active right-sizing recommendations"
                memoryEfficiency:
                  type: object
                  description: "Aggregate memory efficiency metrics"
                  properties:
                    avgPeakUtilization:
                      type: number
                      format: double
                      description: "Average peak GPU memory utilization percentage across jobs"
                    avgSteadyStateUtilization:
                      type: number
                      format: double
                      description: "Average steady-state GPU memory utilization percentage"
                lastAnalysisTime:
                  type: string
                  format: date-time
                  description: "Timestamp of the last analysis run"
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time

      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Scope
          type: string
          jsonPath: .spec.scope.type
        - name: OOM-Prevention
          type: boolean
          jsonPath: .spec.oomPrevention.enabled
        - name: Right-Sizing
          type: boolean
          jsonPath: .spec.rightSizing.enabled
        - name: Jobs-Analyzed
          type: integer
          jsonPath: .status.jobsAnalyzed
        - name: OOM-Prevented
          type: integer
          jsonPath: .status.oomPrevented
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Cluster
  names:
    plural: fabricgpumemoryoptimizers
    singular: fabricgpumemoryoptimizer
    kind: FabricGpuMemoryOptimizer
    shortNames:
      - fgmo

---
# Example: Cluster-wide GPU Memory Optimizer
apiVersion: tensorreaper.ai/v1
kind: FabricGpuMemoryOptimizer
metadata:
  name: cluster-memory-optimizer
spec:
  scope:
    type: cluster

  oomPrevention:
    enabled: true
    memoryGrowthProfiling:
      profileSteps: 20
      projectionMethod: linear
    preemptiveAction:
      type: auto-mitigate
      warningThresholdPercent: 85
      autoEnableGradientCheckpointing: true
      autoEnableMixedPrecision: true
      autoReduceBatchSize: false

  rightSizing:
    enabled: true
    analysisWindow: "24h"
    recommendations:
      gpuTypeDowngrade: true
      gpuCountReduction: true
    minimumGpuMemoryHeadroom: 15

  inferencePacking:
    enabled: false

---
# Example: Namespace-scoped optimizer with inference packing
apiVersion: tensorreaper.ai/v1
kind: FabricGpuMemoryOptimizer
metadata:
  name: inference-ns-optimizer
spec:
  scope:
    type: namespace
    namespace: inference-prod

  oomPrevention:
    enabled: true
    memoryGrowthProfiling:
      profileSteps: 10
      projectionMethod: exponential
    preemptiveAction:
      type: warn
      warningThresholdPercent: 90

  rightSizing:
    enabled: true
    analysisWindow: "7d"
    recommendations:
      gpuTypeDowngrade: true
      gpuCountReduction: false
    minimumGpuMemoryHeadroom: 10

  inferencePacking:
    enabled: true
    memoryUtilizationTarget: 80
    compatibilityCheck: true
    isolationLevel: mps

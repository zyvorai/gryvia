---
# Model Lineage and Provenance Tracking
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricmodellineages.kubefabric.ai
spec:
  group: kubefabric.ai
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Model identification
                model:
                  type: object
                  required:
                    - name
                    - version
                  properties:
                    name:
                      type: string
                      description: "Model name"
                    version:
                      type: string
                      description: "Model version (semver or custom)"
                    registry:
                      type: string
                      description: "Model registry URL or reference"
                    format:
                      type: string
                      enum:
                        - pytorch
                        - onnx
                        - tensorrt
                        - safetensors
                      description: "Model serialization format"

                # Provenance tracking
                provenance:
                  type: object
                  properties:
                    autoCapture:
                      type: boolean
                      default: true
                      description: "Automatically capture provenance from referenced jobs"

                    # Source code
                    code:
                      type: object
                      properties:
                        gitRepo:
                          type: string
                          description: "Git repository URL"
                        gitCommit:
                          type: string
                          description: "Git commit SHA"
                        gitBranch:
                          type: string
                          description: "Git branch name"
                        containerImage:
                          type: string
                          description: "Container image used for training"

                    # Training data
                    data:
                      type: object
                      properties:
                        datasets:
                          type: array
                          items:
                            type: object
                            properties:
                              datasetRef:
                                type: string
                                description: "Reference to dataset (FabricDataset name or URI)"
                              version:
                                type: string
                                description: "Dataset version"
                              checksum:
                                type: string
                                description: "SHA256 checksum of the dataset"

                    # Training configuration
                    training:
                      type: object
                      properties:
                        jobRef:
                          type: string
                          description: "Reference to FabricAIJob that produced this model"
                        hyperparameters:
                          type: object
                          additionalProperties:
                            type: string
                          description: "Hyperparameters used during training"
                        distributedConfig:
                          type: string
                          description: "Distributed training configuration summary"

                    # Infrastructure used
                    infrastructure:
                      type: object
                      properties:
                        gpuNodes:
                          type: array
                          items:
                            type: string
                          description: "GPU node names used during training"
                        networkType:
                          type: string
                          description: "Network type used (rdma, sriov, standard)"
                        storageBackend:
                          type: string
                          description: "Storage backend used"
                        totalGpuHours:
                          type: number
                          description: "Total GPU hours consumed"
                        totalCost:
                          type: number
                          description: "Total cost in USD"

                    # Events during training
                    events:
                      type: object
                      properties:
                        anomalies:
                          type: array
                          items:
                            type: object
                            properties:
                              timestamp:
                                type: string
                                format: date-time
                              type:
                                type: string
                              description:
                                type: string
                          description: "Anomalies detected during training"
                        interventions:
                          type: array
                          items:
                            type: object
                            properties:
                              timestamp:
                                type: string
                                format: date-time
                              action:
                                type: string
                              reason:
                                type: string
                          description: "Manual interventions during training"
                        checkpointTimeline:
                          type: array
                          items:
                            type: object
                            properties:
                              timestamp:
                                type: string
                                format: date-time
                              epoch:
                                type: integer
                              step:
                                type: integer
                              checkpointPath:
                                type: string
                          description: "Checkpoint save timeline"

                    # Evaluation results
                    evaluation:
                      type: object
                      properties:
                        metrics:
                          type: object
                          additionalProperties:
                            type: number
                          description: "Evaluation metrics (e.g., accuracy: 0.95, f1: 0.93)"
                        evaluationJob:
                          type: string
                          description: "Reference to evaluation FabricAIJob"
                        benchmarks:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                description: "Benchmark name"
                              score:
                                type: number
                                description: "Benchmark score"
                              date:
                                type: string
                                format: date-time

                # Compliance and audit
                compliance:
                  type: object
                  properties:
                    immutableRecord:
                      type: boolean
                      default: true
                      description: "Prevent modifications to lineage after initial creation"
                    cryptographicChain:
                      type: boolean
                      default: true
                      description: "Enable SHA256 hash chain for tamper detection"
                    signedBy:
                      type: string
                      description: "Identity that signed the model artifact"
                    attestation:
                      type: object
                      properties:
                        format:
                          type: string
                          enum: [in-toto, sigstore, custom]
                          description: "Attestation format"
                        attachToRegistry:
                          type: boolean
                          default: false
                          description: "Attach attestation to container/model registry"
                    regulatoryFramework:
                      type: array
                      items:
                        type: string
                      description: "Regulatory frameworks this model must comply with (e.g., EU-AI-Act, NIST-AI-RMF)"
                    dataPrivacy:
                      type: object
                      properties:
                        piiScanned:
                          type: boolean
                          default: false
                          description: "Whether training data was scanned for PII"
                        piiFound:
                          type: boolean
                          description: "Whether PII was found in training data"
                        dpiaCompleted:
                          type: boolean
                          default: false
                          description: "Whether a Data Protection Impact Assessment was completed"

            status:
              type: object
              properties:
                lineageComplete:
                  type: boolean
                  description: "Whether all provenance data has been collected"
                provenanceHash:
                  type: string
                  description: "SHA256 hash of the complete provenance record"
                createdAt:
                  type: string
                  format: date-time
                  description: "Timestamp when lineage was created"
                attestationAttached:
                  type: boolean
                  description: "Whether attestation was attached to registry"
                complianceStatus:
                  type: string
                  enum:
                    - Compliant
                    - NonCompliant
                    - Pending
                    - Unknown
                  description: "Overall compliance status"
                reproducibilityVerified:
                  type: boolean
                  description: "Whether the model can be reproduced from recorded provenance"

                # Conditions
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time

      additionalPrinterColumns:
        - name: Model
          type: string
          jsonPath: .spec.model.name
        - name: Version
          type: string
          jsonPath: .spec.model.version
        - name: Format
          type: string
          jsonPath: .spec.model.format
        - name: Lineage
          type: boolean
          jsonPath: .status.lineageComplete
        - name: Compliance
          type: string
          jsonPath: .status.complianceStatus
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

      subresources:
        status: {}

  scope: Namespaced
  names:
    plural: fabricmodellineages
    singular: fabricmodellineage
    kind: FabricModelLineage
    shortNames:
      - fml

---
# Example: Model Lineage for LLaMA Fine-Tune
apiVersion: kubefabric.ai/v1
kind: FabricModelLineage
metadata:
  name: llama-70b-finetune-v1
  namespace: ml-training
spec:
  model:
    name: llama-70b-domain-adapted
    version: "1.0.0"
    registry: "registry.company.com/models/llama-70b-domain"
    format: safetensors

  provenance:
    autoCapture: true
    code:
      gitRepo: "https://github.com/company/llm-training"
      gitCommit: "a1b2c3d4e5f6"
      gitBranch: "main"
      containerImage: "registry.company.com/training:v1.2.0"
    data:
      datasets:
        - datasetRef: "domain-corpus-v3"
          version: "3.1.0"
          checksum: "sha256:abcdef1234567890"
        - datasetRef: "instruction-dataset"
          version: "2.0.0"
          checksum: "sha256:0987654321fedcba"
    training:
      jobRef: "llama-70b-finetune-job"
      hyperparameters:
        learning_rate: "2e-5"
        batch_size: "32"
        epochs: "3"
        warmup_steps: "500"
        weight_decay: "0.01"
      distributedConfig: "8xH100, FSDP, NCCL over RDMA"
    infrastructure:
      gpuNodes:
        - gpu-node-01
        - gpu-node-02
      networkType: rdma
      storageBackend: lustre-fast
      totalGpuHours: 384
      totalCost: 3072.00

  compliance:
    immutableRecord: true
    cryptographicChain: true
    signedBy: "ml-pipeline@company.com"
    attestation:
      format: in-toto
      attachToRegistry: true
    regulatoryFramework:
      - EU-AI-Act
      - NIST-AI-RMF
    dataPrivacy:
      piiScanned: true
      piiFound: false
      dpiaCompleted: true

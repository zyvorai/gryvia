---
# Service Level Agreements for GPU Jobs
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricslas.kubefabric.ai
spec:
  group: kubefabric.ai
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - tier
                - scope
              properties:
                # SLA tier
                tier:
                  type: string
                  enum: [platinum, gold, silver, bronze, best-effort]

                # Scope
                scope:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [team, user, job-type, namespace]
                    name:
                      type: string

                # Performance guarantees
                performance:
                  type: object
                  properties:
                    # Queue time guarantee
                    maxQueueTime:
                      type: string
                      description: "Max time job can wait in queue"

                    # Job start guarantee
                    guaranteedStart:
                      type: boolean
                      default: false
                      description: "Job guaranteed to start within maxQueueTime"

                    # Completion time SLA
                    targetCompletionTime:
                      type: string
                      description: "Target time for job completion"

                    # Minimum throughput
                    minThroughput:
                      type: object
                      properties:
                        value:
                          type: number
                        unit:
                          type: string
                          enum: [samples/sec, tokens/sec, images/sec, requests/sec]

                # Availability guarantees
                availability:
                  type: object
                  properties:
                    uptime:
                      type: number
                      minimum: 0
                      maximum: 100
                      description: "Uptime percentage (e.g., 99.9)"

                    # Allowed downtime per month
                    maxDowntimeMinutes:
                      type: number

                    # Scheduled maintenance windows
                    maintenanceWindows:
                      type: array
                      items:
                        type: object
                        properties:
                          dayOfWeek:
                            type: string
                          startTime:
                            type: string
                          duration:
                            type: string

                # Resource guarantees
                resources:
                  type: object
                  properties:
                    # Guaranteed GPU types
                    guaranteedGPUTypes:
                      type: array
                      items:
                        type: string

                    # Reserved capacity
                    reservedCapacity:
                      type: object
                      properties:
                        gpuCount:
                          type: integer
                        always:
                          type: boolean
                          default: false

                    # Fallback options
                    fallbackAllowed:
                      type: boolean
                      default: true
                      description: "Allow fallback to different GPU type"

                # Failure handling
                failureHandling:
                  type: object
                  properties:
                    # Auto-retry on failure
                    autoRetry:
                      type: boolean
                      default: true

                    maxRetries:
                      type: integer
                      default: 3

                    # Compensation for SLA breach
                    compensation:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        type:
                          type: string
                          enum: [credit, refund, priority-boost]
                        percentage:
                          type: number

                # Support level
                support:
                  type: object
                  properties:
                    responseTime:
                      type: string
                      description: "Max response time for support requests"

                    channels:
                      type: array
                      items:
                        type: string
                        enum: [email, slack, phone, pagerduty]

                    businessHours:
                      type: boolean
                      default: true

                # Monitoring and reporting
                monitoring:
                  type: object
                  properties:
                    metricsRetention:
                      type: string
                      default: "90d"

                    reports:
                      type: object
                      properties:
                        frequency:
                          type: string
                          enum: [daily, weekly, monthly, quarterly]
                        recipients:
                          type: array
                          items:
                            type: string

            status:
              type: object
              properties:
                # Current SLA compliance
                compliance:
                  type: object
                  properties:
                    current:
                      type: number
                      description: "Current compliance percentage"

                    trend:
                      type: string
                      enum: [improving, stable, degrading]

                    lastMonth:
                      type: number

                # Metrics
                metrics:
                  type: object
                  properties:
                    avgQueueTime:
                      type: string
                    p95QueueTime:
                      type: string
                    p99QueueTime:
                      type: string
                    uptime:
                      type: number
                    breaches:
                      type: integer

                # Breaches
                breaches:
                  type: array
                  items:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                      type:
                        type: string
                      severity:
                        type: string
                      duration:
                        type: string
                      compensated:
                        type: boolean

      additionalPrinterColumns:
        - name: Tier
          type: string
          jsonPath: .spec.tier
        - name: Scope
          type: string
          jsonPath: .spec.scope.name
        - name: Compliance
          type: string
          jsonPath: .status.compliance.current
        - name: Breaches
          type: integer
          jsonPath: .status.metrics.breaches
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Cluster
  names:
    plural: fabricslas
    singular: fabricsla
    kind: FabricSLA
    shortNames:
      - fsla

---
# Example: Platinum SLA (Production)
apiVersion: kubefabric.ai/v1
kind: FabricSLA
metadata:
  name: production-platinum
spec:
  tier: platinum

  scope:
    type: job-type
    name: production

  performance:
    maxQueueTime: 5m
    guaranteedStart: true
    minThroughput:
      value: 1000
      unit: requests/sec

  availability:
    uptime: 99.99  # Four nines
    maxDowntimeMinutes: 4.38  # Per month
    maintenanceWindows:
      - dayOfWeek: Sunday
        startTime: "02:00"
        duration: "2h"

  resources:
    guaranteedGPUTypes:
      - H100
      - A100-80G
    reservedCapacity:
      gpuCount: 64
      always: true
    fallbackAllowed: false

  failureHandling:
    autoRetry: true
    maxRetries: 5
    compensation:
      enabled: true
      type: credit
      percentage: 100  # 100% credit for SLA breach

  support:
    responseTime: 15m
    channels: [slack, pagerduty, phone]
    businessHours: false  # 24/7 support

  monitoring:
    metricsRetention: 1y
    reports:
      frequency: weekly
      recipients:
        - production-team@company.com
        - sre-team@company.com

---
# Example: Gold SLA (Research)
apiVersion: kubefabric.ai/v1
kind: FabricSLA
metadata:
  name: research-gold
spec:
  tier: gold

  scope:
    type: team
    name: ml-research

  performance:
    maxQueueTime: 30m
    guaranteedStart: true

  availability:
    uptime: 99.9  # Three nines
    maxDowntimeMinutes: 43.2  # Per month

  resources:
    guaranteedGPUTypes:
      - A100-80G
      - A100-40G
    fallbackAllowed: true

  failureHandling:
    autoRetry: true
    maxRetries: 3
    compensation:
      enabled: true
      type: priority-boost
      percentage: 50

  support:
    responseTime: 4h
    channels: [email, slack]
    businessHours: true

  monitoring:
    metricsRetention: 90d
    reports:
      frequency: monthly
      recipients:
        - ml-team-lead@company.com

---
# Example: Silver SLA (Development)
apiVersion: kubefabric.ai/v1
kind: FabricSLA
metadata:
  name: dev-silver
spec:
  tier: silver

  scope:
    type: team
    name: dev-team

  performance:
    maxQueueTime: 2h
    guaranteedStart: false

  availability:
    uptime: 99.0
    maxDowntimeMinutes: 432  # Per month

  resources:
    guaranteedGPUTypes:
      - T4
      - V100
    fallbackAllowed: true

  failureHandling:
    autoRetry: true
    maxRetries: 2
    compensation:
      enabled: false

  support:
    responseTime: 1d
    channels: [email]
    businessHours: true

  monitoring:
    metricsRetention: 30d
    reports:
      frequency: monthly
      recipients:
        - dev-team@company.com

---
# Example: Job with SLA
apiVersion: kubefabric.ai/v1
kind: FabricAIJob
metadata:
  name: production-inference
spec:
  # Reference SLA
  slaRef: production-platinum

  framework: vllm

  resources:
    gpuType: H100
    gpuCount: 8

  # SLA requirements enforced
  # - Max 5 minute queue time
  # - Guaranteed H100 GPUs
  # - Auto-retry on failure
  # - 24/7 support

  image: vllm/vllm:v0.6.6
  command: ["python", "-m", "vllm.entrypoints.api_server"]

---
# SLA Status Example
apiVersion: kubefabric.ai/v1
kind: FabricSLA
metadata:
  name: production-platinum
status:
  compliance:
    current: 99.95
    trend: stable
    lastMonth: 99.92

  metrics:
    avgQueueTime: 2m30s
    p95QueueTime: 4m45s
    p99QueueTime: 4m58s
    uptime: 99.95
    breaches: 1

  breaches:
    - timestamp: "2024-01-15T10:30:00Z"
      type: queue-time-exceeded
      severity: medium
      duration: 2m  # Queue time was 7m instead of 5m
      compensated: true

---
# CLI Usage Examples
#
# List SLAs:
#   kfctl sla list
#
# Output:
# NAME                  TIER      SCOPE         COMPLIANCE  BREACHES  AGE
# production-platinum   platinum  production    99.95%      1         30d
# research-gold         gold      ml-research   99.87%      3         30d
# dev-silver            silver    dev-team      98.92%      8         30d
#
# View SLA details:
#   kfctl sla describe production-platinum
#
# Check SLA compliance:
#   kfctl sla compliance production-platinum
#
# Output:
# SLA Compliance: production-platinum
#
# Current Period: January 2024
# Compliance: 99.95% (Target: 99.99%)
#
# Performance Metrics:
#   Avg Queue Time: 2m30s (Target: <5m)
#   P95 Queue Time: 4m45s
#   P99 Queue Time: 4m58s
#   Uptime: 99.95%
#
# Breaches: 1
#   2024-01-15 10:30: Queue time exceeded (7m vs 5m target)
#   Duration: 2 minutes
#   Compensation: 100% credit applied
#
# View SLA breaches:
#   kfctl sla breaches production-platinum --last 30d
#
# SLA report:
#   kfctl sla report production-platinum --month 2024-01
#
# Calculate SLA credits:
#   kfctl sla credits production-platinum
#
# Output:
# SLA Credits: production-platinum (January 2024)
#
# Breach                  Duration  Compensation
# queue-time-exceeded     2m        $32.00
#
# Total Credits: $32.00

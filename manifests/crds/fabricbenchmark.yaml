---
# Performance Benchmarking Framework
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricbenchmarks.gryvia.io
spec:
  group: gryvia.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Benchmark type
                type:
                  type: string
                  enum: [mlperf, nccl, gpu-memory, io-throughput, custom]
                  description: "Type of benchmark to run"

                # Target resources
                target:
                  type: object
                  properties:
                    # GPU selection
                    gpuType:
                      type: string
                    gpuCount:
                      type: integer
                      minimum: 1

                    # Node selection
                    nodeSelector:
                      type: object
                      additionalProperties:
                        type: string

                    # Network requirements
                    networkType:
                      type: string
                      enum: [infiniband, roce, ethernet]

                # MLPerf benchmarks
                mlperf:
                  type: object
                  properties:
                    workload:
                      type: string
                      enum: [resnet50, bert, gpt3, dlrm, maskrcnn, ssd, unet3d]

                    # Training parameters
                    batchSize:
                      type: integer
                    precision:
                      type: string
                      enum: [fp32, fp16, bf16, int8]

                    # Target metrics
                    targetMetric:
                      type: string
                      enum: [throughput, time-to-train, accuracy]

                # NCCL benchmarks
                nccl:
                  type: object
                  properties:
                    operations:
                      type: array
                      items:
                        type: string
                        enum: [all-reduce, all-gather, reduce-scatter, broadcast, reduce]

                    # Message sizes (in MB)
                    messageSizes:
                      type: array
                      items:
                        type: integer

                    iterations:
                      type: integer
                      default: 100

                    # Warmup iterations
                    warmupIters:
                      type: integer
                      default: 20

                # GPU memory bandwidth
                gpuMemory:
                  type: object
                  properties:
                    testType:
                      type: string
                      enum: [bandwidth, latency, both]

                    # Transfer sizes
                    sizes:
                      type: array
                      items:
                        type: string

                    # Host-to-device, device-to-host, device-to-device
                    directions:
                      type: array
                      items:
                        type: string
                        enum: [h2d, d2h, d2d]

                # I/O throughput
                ioThroughput:
                  type: object
                  properties:
                    # Storage backend
                    storageClass:
                      type: string

                    # Test parameters
                    fileSize:
                      type: string
                    blockSize:
                      type: string
                    operations:
                      type: array
                      items:
                        type: string
                        enum: [read, write, random-read, random-write]

                    # Number of threads
                    threads:
                      type: integer
                      default: 4

                # Custom benchmark
                custom:
                  type: object
                  properties:
                    image:
                      type: string
                    command:
                      type: array
                      items:
                        type: string
                    args:
                      type: array
                      items:
                        type: string

                    # Expected metrics
                    metrics:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          unit:
                            type: string
                          higherIsBetter:
                            type: boolean
                            default: true

                # Comparison baseline
                baseline:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false

                    # Reference to previous benchmark
                    benchmarkRef:
                      type: string

                    # Or explicit values
                    values:
                      type: object
                      additionalProperties:
                        type: number

                    # Regression threshold
                    regressionThreshold:
                      type: number
                      default: 5
                      description: "Percentage drop that triggers regression alert"

                # Scheduling
                schedule:
                  type: object
                  properties:
                    # Run once or recurring
                    type:
                      type: string
                      enum: [once, recurring]
                      default: once

                    # Cron expression for recurring
                    cron:
                      type: string

                    # Suspend scheduling
                    suspend:
                      type: boolean
                      default: false

                # Notifications
                notifications:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false

                    # When to notify
                    events:
                      type: array
                      items:
                        type: string
                        enum: [completion, regression, failure]

                    # Notification channels
                    slack:
                      type: object
                      properties:
                        webhook:
                          type: string
                    email:
                      type: object
                      properties:
                        recipients:
                          type: array
                          items:
                            type: string

            status:
              type: object
              properties:
                # Current state
                state:
                  type: string
                  enum: [pending, running, completed, failed, regressed]

                # Execution info
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
                duration:
                  type: string

                # Results
                results:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      value:
                        type: number
                      unit:
                        type: string
                      percentile95:
                        type: number
                      percentile99:
                        type: number

                # Comparison with baseline
                comparison:
                  type: object
                  properties:
                    improved:
                      type: integer
                    regressed:
                      type: integer
                    stable:
                      type: integer

                    details:
                      type: array
                      items:
                        type: object
                        properties:
                          metric:
                            type: string
                          current:
                            type: number
                          baseline:
                            type: number
                          change:
                            type: number
                          status:
                            type: string
                            enum: [improved, regressed, stable]

                # Hardware info
                hardware:
                  type: object
                  properties:
                    gpuModel:
                      type: string
                    gpuCount:
                      type: integer
                    driverVersion:
                      type: string
                    cudaVersion:
                      type: string

      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: State
          type: string
          jsonPath: .status.state
        - name: GPUs
          type: integer
          jsonPath: .spec.target.gpuCount
        - name: Duration
          type: string
          jsonPath: .status.duration
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Namespaced
  names:
    plural: fabricbenchmarks
    singular: fabricbenchmark
    kind: FabricBenchmark
    shortNames:
      - fbench

---
# Example: MLPerf ResNet50 Benchmark
apiVersion: gryvia.io/v1
kind: FabricBenchmark
metadata:
  name: mlperf-resnet50
  namespace: benchmarks
spec:
  type: mlperf

  target:
    gpuType: A100-80G
    gpuCount: 8

  mlperf:
    workload: resnet50
    batchSize: 256
    precision: fp16
    targetMetric: throughput

  baseline:
    enabled: true
    values:
      throughput: 9200  # images/sec
    regressionThreshold: 5

  schedule:
    type: recurring
    cron: "0 2 * * 0"  # Weekly on Sunday 2 AM

  notifications:
    enabled: true
    events: [completion, regression]
    slack:
      webhook: https://hooks.slack.com/services/xxx
    email:
      recipients:
        - ml-team@company.com

---
# Example: NCCL All-Reduce Benchmark
apiVersion: gryvia.io/v1
kind: FabricBenchmark
metadata:
  name: nccl-allreduce
  namespace: benchmarks
spec:
  type: nccl

  target:
    gpuType: A100-80G
    gpuCount: 16
    networkType: infiniband

  nccl:
    operations: [all-reduce]
    messageSizes: [8, 16, 32, 64, 128, 256, 512, 1024, 2048]  # MB
    iterations: 100
    warmupIters: 20

  baseline:
    enabled: true
    benchmarkRef: nccl-allreduce-baseline
    regressionThreshold: 3

---
# Example: GPU Memory Bandwidth Benchmark
apiVersion: gryvia.io/v1
kind: FabricBenchmark
metadata:
  name: gpu-memory-bw
  namespace: benchmarks
spec:
  type: gpu-memory

  target:
    gpuType: H100
    gpuCount: 1

  gpuMemory:
    testType: both
    sizes: [1MB, 10MB, 100MB, 1GB, 10GB]
    directions: [h2d, d2h, d2d]

  baseline:
    enabled: true
    values:
      h2d_bandwidth: 26  # GB/s
      d2h_bandwidth: 26  # GB/s
      d2d_bandwidth: 3350  # GB/s (H100 HBM3)

---
# Example: Storage I/O Benchmark
apiVersion: gryvia.io/v1
kind: FabricBenchmark
metadata:
  name: storage-io
  namespace: benchmarks
spec:
  type: io-throughput

  target:
    gpuType: T4
    gpuCount: 1

  ioThroughput:
    storageClass: vast-data
    fileSize: 10GB
    blockSize: 1MB
    operations: [read, write, random-read, random-write]
    threads: 8

  baseline:
    enabled: true
    values:
      read_throughput: 2000  # MB/s
      write_throughput: 1500  # MB/s

---
# Example: Custom PyTorch Benchmark
apiVersion: gryvia.io/v1
kind: FabricBenchmark
metadata:
  name: custom-pytorch
  namespace: benchmarks
spec:
  type: custom

  target:
    gpuType: A100-80G
    gpuCount: 8

  custom:
    image: nvcr.io/nvidia/pytorch:24.01-py3
    command: [python]
    args:
      - benchmark.py
      - --model=bert-large
      - --batch-size=64
      - --iterations=100

    metrics:
      - name: throughput
        unit: samples/sec
        higherIsBetter: true
      - name: gpu_memory
        unit: GB
        higherIsBetter: false
      - name: training_time
        unit: seconds
        higherIsBetter: false

---
# Benchmark Suite (multiple benchmarks)
apiVersion: gryvia.io/v1
kind: FabricBenchmarkSuite
metadata:
  name: weekly-regression-suite
  namespace: benchmarks
spec:
  # List of benchmarks to run
  benchmarks:
    - name: mlperf-resnet50
    - name: mlperf-bert
    - name: nccl-allreduce
    - name: gpu-memory-bw
    - name: storage-io

  # Run in sequence or parallel
  execution:
    mode: parallel
    maxConcurrent: 3

  # Schedule
  schedule:
    type: recurring
    cron: "0 2 * * 0"  # Weekly

  # Report generation
  report:
    enabled: true
    format: [html, pdf, json]
    recipients:
      - ml-team@company.com
      - sre-team@company.com

---
# CLI Usage Examples
#
# List benchmarks:
#   kfctl benchmark list
#
# Output:
# NAME              TYPE       STATE      GPUS  DURATION  AGE
# mlperf-resnet50   mlperf     completed  8     45m       2d
# nccl-allreduce    nccl       completed  16    15m       2d
# gpu-memory-bw     gpu-memory completed  1     5m        2d
#
# Run benchmark:
#   kfctl benchmark run mlperf-resnet50
#
# View results:
#   kfctl benchmark results mlperf-resnet50
#
# Output:
# Benchmark Results: mlperf-resnet50
#
# Hardware:
#   GPU: A100-80G
#   Count: 8
#   Driver: 535.129.03
#   CUDA: 12.3
#
# Metrics:
#   Throughput: 9,456 images/sec
#   GPU Utilization: 94%
#   Training Time: 42m 15s
#
# Comparison with Baseline:
#   Baseline: 9,200 images/sec
#   Current: 9,456 images/sec
#   Change: +2.8% ✓ IMPROVED
#
# Compare benchmarks:
#   kfctl benchmark compare mlperf-resnet50-v1 mlperf-resnet50-v2
#
# Generate report:
#   kfctl benchmark report --suite weekly-regression-suite --format pdf
#
# Schedule benchmark:
#   kfctl benchmark schedule mlperf-resnet50 --cron "0 2 * * 0"

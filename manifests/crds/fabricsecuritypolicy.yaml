apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricsecuritypolicies.tensorreaper.ai
spec:
  group: tensorreaper.ai
  names:
    kind: FabricSecurityPolicy
    listKind: FabricSecurityPolicyList
    plural: fabricsecuritypolicies
    singular: fabricsecuritypolicy
    shortNames: [fsp]
    categories: [tensorreaper, all]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                targetNamespaces:
                  type: array
                  items:
                    type: string
                detectionRules:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [escape, mining, exfiltration, privesc, driver_fim]
                      enabled:
                        type: boolean
                      sensitivity:
                        type: string
                        enum: [low, medium, high]
                alertWebhook:
                  type: string
                autoBlock:
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                activeDetections:
                  type: integer
                alertsTriggered:
                  type: integer
                lastAlert:
                  type: string
                  format: date-time
                detectionCounts:
                  type: object
                  additionalProperties:
                    type: integer
      subresources:
        status: {}

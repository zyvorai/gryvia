apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabrictrafficinsights.tensorreaper.ai
spec:
  group: tensorreaper.ai
  names:
    kind: FabricTrafficInsight
    listKind: FabricTrafficInsightList
    plural: fabrictrafficinsights
    singular: fabrictrafficinsight
    shortNames: [fti]
    categories: [tensorreaper, all]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                service: {type: string}
                namespace: {type: string}
                window:
                  type: string
                  description: "Duration window for traffic analysis (e.g., 5m, 1h)"
                metrics:
                  type: array
                  items:
                    type: string
                    enum: [latency, throughput, drops, retransmits]
            status:
              type: object
              properties:
                p50Latency: {type: string}
                p99Latency: {type: string}
                throughputBps: {type: integer}
                dropCount: {type: integer}
                topTalkers:
                  type: array
                  items:
                    type: object
                    properties:
                      service: {type: string}
                      bytes: {type: integer}
                      latency: {type: string}
                anomalies:
                  type: array
                  items:
                    type: object
                    properties:
                      type: {type: string}
                      severity: {type: string}
                      description: {type: string}
                      detected: {type: string, format: date-time}
                lastUpdated: {type: string, format: date-time}
      subresources:
        status: {}

---
# Queue-Based Auto-Scaling Policy
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricautoscalers.kubefabric.ai
spec:
  group: kubefabric.ai
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Queue to monitor
                queueRef:
                  type: string
                  description: "Name of FabricQueue to autoscale"

                # GPU type to scale
                gpuType:
                  type: string
                  description: "GPU type to add/remove"

                # Scaling limits
                minNodes:
                  type: integer
                  minimum: 0
                  default: 0

                maxNodes:
                  type: integer
                  minimum: 1
                  default: 100

                # Scaling triggers
                scaleUpPolicy:
                  type: object
                  properties:
                    # Queue-based triggers
                    pendingJobs:
                      type: integer
                      description: "Scale up if pending jobs > threshold"
                    queueTimeMinutes:
                      type: integer
                      description: "Scale up if avg queue time > threshold"
                    utilizationPercent:
                      type: integer
                      description: "Scale up if utilization > threshold"

                    # How many nodes to add
                    increment:
                      type: integer
                      minimum: 1
                      default: 1

                    # Cooldown period
                    cooldownMinutes:
                      type: integer
                      minimum: 0
                      default: 5

                scaleDownPolicy:
                  type: object
                  properties:
                    # Scale down triggers
                    idleTimeMinutes:
                      type: integer
                      description: "Scale down if idle > threshold"
                    utilizationPercent:
                      type: integer
                      description: "Scale down if utilization < threshold"

                    # How many nodes to remove
                    decrement:
                      type: integer
                      minimum: 1
                      default: 1

                    # Cooldown period
                    cooldownMinutes:
                      type: integer
                      minimum: 0
                      default: 15

                # Node provider configuration
                nodeProvider:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [bare-metal, cloud-provision]

                    # For cloud provisioning
                    cloud:
                      type: object
                      properties:
                        provider:
                          type: string
                          enum: [aws, gcp, azure]
                        instanceType:
                          type: string
                        region:
                          type: string
                        zone:
                          type: string
                        spotInstances:
                          type: boolean
                          default: false

                # Cost controls
                costControls:
                  type: object
                  properties:
                    maxHourlyCost:
                      type: number
                      description: "Maximum hourly cost for autoscaled nodes"
                    preferSpot:
                      type: boolean
                      default: true
                    maxSpotPrice:
                      type: number

                # Advanced options
                advanced:
                  type: object
                  properties:
                    predictive:
                      type: boolean
                      default: false
                      description: "Use ML to predict scaling needs"

                    scaleToZero:
                      type: boolean
                      default: false
                      description: "Allow scaling down to 0 nodes"

            status:
              type: object
              properties:
                currentNodes:
                  type: integer
                desiredNodes:
                  type: integer
                pendingNodes:
                  type: integer

                lastScaleTime:
                  type: string
                  format: date-time
                lastScaleAction:
                  type: string
                  enum: [scale-up, scale-down, none]

                metrics:
                  type: object
                  properties:
                    pendingJobs:
                      type: integer
                    avgQueueTimeMinutes:
                      type: number
                    utilizationPercent:
                      type: number

                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string

      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Queue
          type: string
          jsonPath: .spec.queueRef
        - name: GPU-Type
          type: string
          jsonPath: .spec.gpuType
        - name: Current
          type: integer
          jsonPath: .status.currentNodes
        - name: Desired
          type: integer
          jsonPath: .status.desiredNodes
        - name: Min
          type: integer
          jsonPath: .spec.minNodes
        - name: Max
          type: integer
          jsonPath: .spec.maxNodes
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Cluster
  names:
    plural: fabricautoscalers
    singular: fabricautoscaler
    kind: FabricAutoScaler
    shortNames:
      - fas

---
# Example: A100 Queue Auto-Scaler
apiVersion: kubefabric.ai/v1
kind: FabricAutoScaler
metadata:
  name: a100-autoscaler
spec:
  queueRef: ml-research-queue
  gpuType: A100-80G

  minNodes: 2    # Always keep 2 nodes
  maxNodes: 20   # Scale up to 20 nodes

  scaleUpPolicy:
    # Scale up if:
    # - More than 10 pending jobs
    # - OR queue time > 30 minutes
    # - OR utilization > 85%
    pendingJobs: 10
    queueTimeMinutes: 30
    utilizationPercent: 85

    increment: 2  # Add 2 nodes at a time
    cooldownMinutes: 5

  scaleDownPolicy:
    # Scale down if:
    # - Idle for > 15 minutes
    # - AND utilization < 30%
    idleTimeMinutes: 15
    utilizationPercent: 30

    decrement: 1  # Remove 1 node at a time
    cooldownMinutes: 15

  nodeProvider:
    type: bare-metal  # Use existing bare metal nodes

  costControls:
    maxHourlyCost: 1000  # Max $1000/hour for autoscaled nodes

---
# Example: Cloud-Based Auto-Scaler with Spot Instances
apiVersion: kubefabric.ai/v1
kind: FabricAutoScaler
metadata:
  name: t4-spot-autoscaler
spec:
  queueRef: inference-queue
  gpuType: T4

  minNodes: 0     # Can scale to zero
  maxNodes: 50    # Scale up to 50 nodes

  scaleUpPolicy:
    pendingJobs: 5
    queueTimeMinutes: 10
    increment: 3
    cooldownMinutes: 3

  scaleDownPolicy:
    idleTimeMinutes: 10
    utilizationPercent: 20
    decrement: 2
    cooldownMinutes: 10

  nodeProvider:
    type: cloud-provision
    cloud:
      provider: aws
      instanceType: g4dn.xlarge  # 1x T4
      region: us-west-2
      zone: us-west-2a
      spotInstances: true  # Use spot for 70% savings

  costControls:
    maxHourlyCost: 500
    preferSpot: true
    maxSpotPrice: 0.50  # Max $0.50/hour per instance

  advanced:
    scaleToZero: true  # Allow complete scale-down

---
# Example: Predictive Auto-Scaler
apiVersion: kubefabric.ai/v1
kind: FabricAutoScaler
metadata:
  name: h100-predictive-autoscaler
spec:
  queueRef: training-queue
  gpuType: H100

  minNodes: 4
  maxNodes: 16

  scaleUpPolicy:
    pendingJobs: 5
    queueTimeMinutes: 20
    increment: 2
    cooldownMinutes: 5

  scaleDownPolicy:
    idleTimeMinutes: 20
    utilizationPercent: 40
    decrement: 1
    cooldownMinutes: 20

  nodeProvider:
    type: bare-metal

  advanced:
    predictive: true  # Use ML to predict scaling needs
    # Will scale up BEFORE jobs arrive based on patterns

---
# Auto-Scaler Status Example
apiVersion: kubefabric.ai/v1
kind: FabricAutoScaler
metadata:
  name: a100-autoscaler
status:
  currentNodes: 6
  desiredNodes: 8
  pendingNodes: 2  # 2 nodes being provisioned

  lastScaleTime: "2024-01-21T10:30:00Z"
  lastScaleAction: scale-up

  metrics:
    pendingJobs: 15
    avgQueueTimeMinutes: 35
    utilizationPercent: 88

  conditions:
    - type: ScalingActive
      status: "True"
      reason: HighQueueTime
      message: "Scaled up by 2 nodes due to queue time >30min"

    - type: AtMaxCapacity
      status: "False"
      reason: "BelowMax"
      message: "Current: 6, Max: 20"

    - type: CostLimitReached
      status: "False"
      reason: "WithinBudget"
      message: "Current cost: $720/hr, Limit: $1000/hr"

---
# Scaling Events
apiVersion: v1
kind: Event
metadata:
  name: autoscaler-scale-up
type: Normal
reason: ScaledUp
message: |
  FabricAutoScaler 'a100-autoscaler' scaled up

  Trigger: Queue time exceeded threshold
  Queue Time: 35 minutes (threshold: 30 minutes)
  Pending Jobs: 15

  Scaling Action:
    Previous Nodes: 6
    New Nodes: 8 (+2)

  New Nodes:
    - gpu-node-07 (8x A100-80G) - provisioning
    - gpu-node-08 (8x A100-80G) - provisioning

  Estimated Time: 5-10 minutes
  Estimated Cost: +$192/hour

---
# CLI Usage Examples
#
# List autoscalers:
#   kfctl autoscale list
#
# View autoscaler status:
#   kfctl autoscale status a100-autoscaler
#
# Create autoscaler:
#   kfctl autoscale create --queue ml-research \
#     --gpu-type A100-80G \
#     --min 2 --max 20 \
#     --scale-up-jobs 10 \
#     --scale-down-idle 15
#
# Update autoscaler:
#   kfctl autoscale update a100-autoscaler --max 30
#
# Pause autoscaling:
#   kfctl autoscale pause a100-autoscaler
#
# Resume autoscaling:
#   kfctl autoscale resume a100-autoscaler
#
# Manual scale:
#   kfctl autoscale set a100-autoscaler --nodes 10
#
# View scaling history:
#   kfctl autoscale history a100-autoscaler
#
# Output:
# TIMESTAMP            ACTION      FROM  TO   REASON
# 2024-01-21 10:30     scale-up    6     8    High queue time (35min)
# 2024-01-21 08:15     scale-down  8     6    Low utilization (25%)
# 2024-01-21 06:00     scale-up    6     8    Pending jobs (15)

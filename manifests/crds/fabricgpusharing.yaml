---
# Advanced GPU Sharing and Fractional GPUs
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricgpusharingpolicies.tensorreaper.ai
spec:
  group: tensorreaper.ai
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - strategy
              properties:
                # GPU nodes this policy applies to
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string

                # Sharing strategy
                strategy:
                  type: string
                  enum: [time-slicing, mig, fractional, spatial]
                  description: |
                    time-slicing: Share GPU via time-slicing (V100, T4)
                    mig: Use Multi-Instance GPU (A100, H100)
                    fractional: Fractional GPU allocation
                    spatial: Spatial partitioning

                # Time-slicing configuration
                timeSlicing:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false

                    # Max pods per GPU
                    maxPodsPerGPU:
                      type: integer
                      minimum: 1
                      maximum: 16
                      default: 4

                    # Time slice duration
                    sliceDuration:
                      type: string
                      default: "100ms"

                    # Memory limits per pod
                    memoryLimitPercent:
                      type: integer
                      minimum: 1
                      maximum: 100

                    # Enforce limits
                    enforcement:
                      type: string
                      enum: [soft, hard]
                      default: soft

                # Fractional GPU configuration
                fractionalGPU:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false

                    # Granularity of fractions
                    granularity:
                      type: string
                      enum: ["1/2", "1/4", "1/8", "1/16"]
                      default: "1/4"

                    # Allow oversubscription
                    oversubscription:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        maxRatio:
                          type: number
                          default: 1.5
                          description: "1.5 = allow 150% allocation"

                # MIG configuration
                mig:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false

                    # MIG profile distribution
                    profiles:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          count:
                            type: integer

                # Quality of Service
                qos:
                  type: object
                  properties:
                    guaranteedMemory:
                      type: boolean
                      default: true

                    guaranteedCompute:
                      type: boolean
                      default: false

                    isolationLevel:
                      type: string
                      enum: [none, memory, compute, full]
                      default: memory

                # Priority-based allocation
                priority:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false

                    highPriorityShare:
                      type: integer
                      description: "Percentage for high priority jobs"

                    preemptLowPriority:
                      type: boolean
                      default: false

                # Per-tenant GPU sharing quotas
                tenantQuotas:
                  type: array
                  items:
                    type: object
                    required:
                      - tenant
                    properties:
                      tenant:
                        type: string
                        description: "Tenant or team name"
                      maxFractionalGPUs:
                        type: integer
                        description: "Maximum fractional GPU units for this tenant"
                      maxMemoryGB:
                        type: integer
                        description: "Maximum GPU memory in GB for this tenant"

            status:
              type: object
              properties:
                affectedNodes:
                  type: array
                  items:
                    type: string

                totalGPUs:
                  type: integer

                effectiveGPUs:
                  type: integer
                  description: "Total allocatable GPU units after sharing"

                currentAllocations:
                  type: object
                  properties:
                    physical:
                      type: integer
                    fractional:
                      type: integer
                    utilization:
                      type: number

      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Strategy
          type: string
          jsonPath: .spec.strategy
        - name: Physical-GPUs
          type: integer
          jsonPath: .status.totalGPUs
        - name: Effective-GPUs
          type: integer
          jsonPath: .status.effectiveGPUs
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Cluster
  names:
    plural: fabricgpusharingpolicies
    singular: fabricgpusharingpolicy
    kind: FabricGPUSharingPolicy
    shortNames:
      - fgpushare

---
# Example: Time-Slicing for V100 GPUs
apiVersion: tensorreaper.ai/v1
kind: FabricGPUSharingPolicy
metadata:
  name: v100-time-slicing
spec:
  nodeSelector:
    tensorreaper.ai/gpu-type: V100

  strategy: time-slicing

  timeSlicing:
    enabled: true
    maxPodsPerGPU: 4  # 4 pods can share each GPU
    sliceDuration: 100ms
    memoryLimitPercent: 25  # Each pod gets 25% memory
    enforcement: soft

  qos:
    guaranteedMemory: true
    guaranteedCompute: false
    isolationLevel: memory

---
# Example: Fractional T4 GPUs
apiVersion: tensorreaper.ai/v1
kind: FabricGPUSharingPolicy
metadata:
  name: t4-fractional
spec:
  nodeSelector:
    tensorreaper.ai/gpu-type: T4

  strategy: fractional

  fractionalGPU:
    enabled: true
    granularity: "1/8"  # Support 1/8, 1/4, 1/2, 1 GPU
    oversubscription:
      enabled: true
      maxRatio: 1.25  # Allow 125% allocation

  qos:
    guaranteedMemory: true
    isolationLevel: memory

---
# Example: MIG Profiles for A100
apiVersion: tensorreaper.ai/v1
kind: FabricGPUSharingPolicy
metadata:
  name: a100-mig-mixed
spec:
  nodeSelector:
    tensorreaper.ai/gpu-type: A100-80G

  strategy: mig

  mig:
    enabled: true
    profiles:
      - name: 1g.10gb
        count: 4  # 4x 1g.10gb per GPU
      - name: 3g.40gb
        count: 2  # 2x 3g.40gb per GPU
      # Total: 6 instances per GPU (4+2)

---
# Example: Priority-Based Sharing
apiVersion: tensorreaper.ai/v1
kind: FabricGPUSharingPolicy
metadata:
  name: priority-based-sharing
spec:
  nodeSelector:
    tensorreaper.ai/node-pool: shared

  strategy: time-slicing

  timeSlicing:
    enabled: true
    maxPodsPerGPU: 8

  priority:
    enabled: true
    highPriorityShare: 60  # High priority gets 60% of GPU time
    preemptLowPriority: true

---
# Example: Job Requesting Fractional GPU
apiVersion: tensorreaper.ai/v1
kind: FabricAIJob
metadata:
  name: inference-fractional
spec:
  framework: pytorch

  resources:
    # Request fractional GPU
    fractionalGPU:
      fraction: "1/4"  # Request 1/4 of a GPU
      memoryGB: 4      # 4GB GPU memory
    memory: 8Gi
    cpu: 4

  image: nvcr.io/nvidia/pytorch:24.01-py3
  command: ["python", "inference.py"]

---
# Example: Job with Time-Sliced GPU
apiVersion: tensorreaper.ai/v1
kind: FabricAIJob
metadata:
  name: dev-environment
spec:
  framework: jupyter

  resources:
    # Request shared GPU access
    sharedGPU:
      enabled: true
      memoryGB: 8  # Request 8GB from shared pool
    memory: 16Gi
    cpu: 8

  image: jupyter/tensorflow-notebook:2024.10.0

---
# GPU Sharing Status Example
apiVersion: tensorreaper.ai/v1
kind: FabricGPUSharingPolicy
metadata:
  name: t4-fractional
status:
  affectedNodes:
    - gpu-node-10
    - gpu-node-11
    - gpu-node-12

  totalGPUs: 12  # 4 GPUs per node × 3 nodes

  effectiveGPUs: 96  # 12 × 8 (1/8 granularity)

  currentAllocations:
    physical: 12
    fractional: 45  # 45 fractional allocations active
    utilization: 0.625  # 62.5% average utilization

---
# Resource Advertisement Example
# After applying sharing policy, nodes advertise:
#
# apiVersion: v1
# kind: Node
# metadata:
#   name: gpu-node-10
# status:
#   allocatable:
#     nvidia.com/gpu: 4  # Physical GPUs
#     tensorreaper.ai/gpu-1-8: 32  # 4 GPUs × 8 fractions
#     tensorreaper.ai/gpu-1-4: 16  # 4 GPUs × 4 fractions
#     tensorreaper.ai/gpu-1-2: 8   # 4 GPUs × 2 fractions
#     tensorreaper.ai/gpu-memory: 65536  # MB, shared pool

---
# Multi-Tenant Sharing Example
apiVersion: tensorreaper.ai/v1
kind: FabricGPUSharingPolicy
metadata:
  name: multi-tenant-sharing
spec:
  strategy: fractional

  fractionalGPU:
    enabled: true
    granularity: "1/4"

  qos:
    guaranteedMemory: true
    guaranteedCompute: false
    isolationLevel: full  # Full isolation between tenants

  # Per-tenant quotas
  tenantQuotas:
    - tenant: ml-research
      maxFractionalGPUs: 32
      maxMemoryGB: 256
    - tenant: dev-team
      maxFractionalGPUs: 16
      maxMemoryGB: 128

---

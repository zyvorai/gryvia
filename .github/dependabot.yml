version: 2
updates:
  - {package-ecosystem: github-actions, directory: /, schedule: {interval: weekly}}
  - {package-ecosystem: npm, directory: /web-ui, schedule: {interval: weekly}, groups: {minor-and-patch: {update-types: [minor, patch]}}}
  - {package-ecosystem: pip, directory: /services/api-gateway, schedule: {interval: weekly}}
  - {package-ecosystem: cargo, directory: /cli, schedule: {interval: weekly}}
  - {package-ecosystem: gomod, directory: /operators/gpu-operator, schedule: {interval: weekly}}
  - {package-ecosystem: gomod, directory: /operators/ai-operator, schedule: {interval: weekly}}
  - {package-ecosystem: gomod, directory: /operators/quota-operator, schedule: {interval: weekly}}
  - {package-ecosystem: gomod, directory: /operators/storage-operator, schedule: {interval: weekly}}
  - {package-ecosystem: gomod, directory: /operators/network-operator, schedule: {interval: weekly}}
  - {package-ecosystem: gomod, directory: /operators/network-intelligence, schedule: {interval: weekly}}
  - {package-ecosystem: docker, directory: /docker, schedule: {interval: weekly}}

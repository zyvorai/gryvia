# chart-testing configuration
remote: origin
target-branch: main
chart-dirs:
  - helm
# Needs the Zyntra and Netra charts from sibling checkouts; the Sovereign AI OS workflow (sovereign-aios.yml) checks
# them out and runs its render tests.
excluded-charts:
  - sovereign-aios
chart-repos:
  - bitnami=https://charts.bitnami.com/bitnami
  - prometheus-community=https://prometheus-community.github.io/helm-charts
  - nvidia=https://helm.ngc.nvidia.com/nvidia
helm-extra-args: --timeout 600s
validate-maintainers: false

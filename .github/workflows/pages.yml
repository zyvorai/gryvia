# Requires GitHub Pages with Source = "GitHub Actions" (repo Settings > Pages),
# enabled once via: gh api repos/zyvorai/gryvia/pages -X POST -f build_type=workflow
# Publishes the docs site at / and the Helm chart repo at /charts.
name: Deploy Docs Site
on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/ux/**', 'helm/**', '.github/workflows/pages.yml']
  workflow_dispatch: {}
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: {node-version: '22', cache: npm, cache-dependency-path: website/package-lock.json}
    - run: npm --prefix website ci
    - run: npm --prefix website run build
    - uses: azure/setup-helm@v5
    - name: Package Helm charts into the site
      run: |
        mkdir -p website/build/charts
        for chart in helm/*/; do helm package "$chart" -d website/build/charts; done
        helm repo index website/build/charts --url https://zyvorai.github.io/gryvia/charts
    - uses: actions/upload-pages-artifact@v3
      with: {path: website/build}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    permissions: {pages: write, id-token: write}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4

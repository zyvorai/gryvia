name: eBPF programs

# Builds every program in ebpf/ (x86_64 and an arm64 cross-compile) and loads each object through the kernel
# verifier of the runner. Loading only; nothing is attached to a hook.
on:
  pull_request:
    paths:
      - 'ebpf/**'
      - 'collector/**'
      - '.github/workflows/ebpf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ebpf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build and verifier-load
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: collector/go.mod
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev linux-libc-dev make
      - name: Build (x86_64)
        run: make -C ebpf
      - name: Load every object through the verifier
        # collector/cmd/verifyobj uses the same cilium/ebpf loader as the collector; no bpftool needed.
        run: |
          uname -r
          test -e /sys/kernel/btf/vmlinux
          go build -o "$RUNNER_TEMP/verifyobj" ./cmd/verifyobj
          sudo "$RUNNER_TEMP/verifyobj" ../ebpf
        working-directory: collector
      - name: Run the XDP chain (BPF_PROG_TEST_RUN)
        # xdp_mux plus the five XDP features, loaded as one chain and run in the kernel on a crafted RoCEv2 frame.
        run: |
          go test -c -tags bpfroot -o "$RUNNER_TEMP/loader.test" ./pkg/loader
          sudo env GRYVIA_EBPF_DIR="$PWD/../ebpf" "$RUNNER_TEMP/loader.test" -test.run 'TestXDP' -test.v
        working-directory: collector
      - name: Cross-compile (arm64)
        run: |
          make -C ebpf clean
          make -C ebpf ARCH=arm64
          test "$(ls ebpf/*.o | wc -l)" = "$(ls ebpf/*.c | wc -l)"
  collector:
    name: Collector tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: collector/go.mod
      - run: go vet ./... && go test ./...
        working-directory: collector

name: ML controllers end-to-end

# Runs the ML controllers (GryviaWorkspace, GryviaInferenceService, GryviaModelRegistry, GryviaWorkflow,
# GryviaAutoTuner, GryviaModelWatch) against a real API server on kind, with tiny CPU images (nginx-unprivileged,
# busybox, python) in place of Jupyter/vLLM/Triton, and checks the objects, the status the controllers write and what
# the API gateway shows.
#
# NOT proven here (no GPU, no real model server, no metrics-server on kind): the real Jupyter, code-server, vLLM,
# Triton, TensorRT-LLM and TorchServe images, GPU scheduling, and an HPA scaling on real metrics. The model factory
# runs against a stand-in hub (a 20-line Python server, not huggingface.co) and its download/fine-tune/quantize/evaluate
# steps are busybox stand-ins that only emit outputs; the real scripts in examples/model-factory are unit-tested
# separately.
# The GryviaDataset controller (storage-operator) downloads from a stand-in HTTP file server; its s3 and nfs sources
# are covered by unit tests only.
#
# The workflow-with-jobs and auto-tuner steps run GryviaAIJob children, which the AIJob controller runs to completion
# (indexed batch/v1 Job workload, docs/aijob-lifecycle.md), so a failure of those steps fails the run.
# This file was written without being able to run it (no docker/kind on the authoring machine): the first CI run is
# its first execution.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'operators/ai-operator/**'
      - 'operators/storage-operator/**'
      - 'helm/**'
      - 'crds/**'
      - 'services/api-gateway/**'
      - 'scripts/e2e-ml-lib.sh'
      - 'scripts/kind-demo.sh'
      - '.github/workflows/e2e-ml.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TINY_HTTP_IMAGE: nginxinc/nginx-unprivileged:1.27-alpine
  TINY_JOB_IMAGE: busybox:1.36
  TINY_PY_IMAGE: python:3.12-alpine
  KIND_CLUSTER: gryvia-demo

jobs:
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Install Gryvia on kind (local images)
        run: GRYVIA_LOCAL_IMAGES=1 ./scripts/kind-demo.sh

      - name: Load the tiny images into kind
        run: |
          for img in "$TINY_HTTP_IMAGE" "$TINY_JOB_IMAGE" "$TINY_PY_IMAGE"; do
            docker pull "$img"
            kind load docker-image --name "$KIND_CLUSTER" "$img"
          done

      - name: Point the ai-operator at the tiny images
        run: |
          # nginx-unprivileged listens on 8080 and answers / with 200. torchserve's default port is 8080, so every
          # inference service below uses the torchserve backend; --inference-health-path=/ replaces its /ping probe.
          # The model watch polls the stand-in hub deployed further down (e2e-fake-hf), at most every 10s.
          helm upgrade gryvia ./helm/gryvia --namespace gryvia-system --reuse-values --wait --timeout 300s \
            --set aiOperator.modelWatch.enabled=true \
            --set aiOperator.modelWatch.hubURL=http://e2e-fake-hf.gryvia-system.svc:8080 \
            --set aiOperator.modelWatch.minPollInterval=10s \
            --set-json "aiOperator.extraArgs=[\"--workspace-code-image=${TINY_HTTP_IMAGE}\",\"--workspace-jupyter-image=${TINY_HTTP_IMAGE}\",\"--inference-image-torchserve=${TINY_HTTP_IMAGE}\",\"--inference-health-path=/\",\"--autoserve-default-gpu-count=0\",\"--inference-canary-startup-grace=30s\"]"
          kubectl -n gryvia-system rollout status deploy -l app.kubernetes.io/component=ai-operator --timeout=180s

      - name: The ai-operator started the six ML controllers
        run: |
          source scripts/e2e-ml-lib.sh
          check() { kubectl -n "$NS" logs -l app.kubernetes.io/component=ai-operator --tail=-1 | grep -q "\"controllerKind\":\"$1\""; }
          for kind in GryviaWorkspace GryviaInferenceService GryviaModelRegistry GryviaWorkflow GryviaAutoTuner GryviaModelWatch; do
            wait_for "controller $kind started" 90 check "$kind"
          done

      - name: Open the API
        run: |
          kubectl -n gryvia-system port-forward svc/gryvia-ui 8443:443 &
          sleep 5
          source scripts/e2e-ml-lib.sh
          api /api/auth/me >/dev/null

      # ------------------------------------------------------------------ Workspace
      - name: Workspace - Pod, Service and PVC, phase Running, pause, resume
        run: |
          source scripts/e2e-ml-lib.sh
          cat <<EOF | kubectl apply -f -
          apiVersion: gryvia.io/v1alpha1
          kind: GryviaWorkspace
          metadata: {name: e2e-ws, namespace: gryvia-system}
          spec: {type: vscode, storage: 1Gi, idleTimeoutMinutes: 30}
          EOF
          wait_for "workspace Running" 240 field_is gryviaworkspace/e2e-ws '{.status.phase}' Running
          kubectl -n "$NS" get pod/e2e-ws-workspace svc/e2e-ws-workspace pvc/e2e-ws-workspace
          assert_eq "no GPU requested" "$(jp pod/e2e-ws-workspace '{.spec.containers[0].resources.limits}')" ""
          assert_eq "pod image" "$(jp pod/e2e-ws-workspace '{.spec.containers[0].image}')" "$TINY_HTTP_IMAGE"
          assert_eq "pod owner" "$(jp pod/e2e-ws-workspace '{.metadata.ownerReferences[0].kind}')" GryviaWorkspace
          assert_nonempty "status.url" "$(jp gryviaworkspace/e2e-ws '{.status.url}')"
          assert_nonempty "status.startTime" "$(jp gryviaworkspace/e2e-ws '{.status.startTime}')"
          assert_nonempty "status.lastActivity" "$(jp gryviaworkspace/e2e-ws '{.status.lastActivity}')"

          # The gateway shows the same.
          assert_eq "gateway phase" "$(gw /api/workspaces/e2e-ws .status.phase)" Running
          assert_nonempty "gateway url" "$(gw /api/workspaces/e2e-ws .status.url)"
          assert_nonempty "gateway uptime" "$(gw /api/workspaces/e2e-ws .status.uptime)"

          # Pause through the gateway: the pod goes, the PVC stays.
          pvc_uid="$(jp pvc/e2e-ws-workspace '{.metadata.uid}')"
          api /api/workspaces/e2e-ws/pause -X POST >/dev/null
          wait_for "pod deleted" 120 gone pod/e2e-ws-workspace
          wait_for "workspace Paused" 60 field_is gryviaworkspace/e2e-ws '{.status.phase}' Paused
          assert_eq "PVC kept while paused" "$(jp pvc/e2e-ws-workspace '{.metadata.uid}')" "$pvc_uid"
          assert_eq "gateway phase when paused" "$(gw /api/workspaces/e2e-ws .status.phase)" Paused

          # Resume: a new pod mounts the same PVC.
          api /api/workspaces/e2e-ws/resume -X POST >/dev/null
          wait_for "workspace Running again" 240 field_is gryviaworkspace/e2e-ws '{.status.phase}' Running
          assert_eq "same PVC after resume" "$(jp pvc/e2e-ws-workspace '{.metadata.uid}')" "$pvc_uid"
          assert_eq "resumed pod mounts the PVC" "$(jp pod/e2e-ws-workspace '{.spec.volumes[?(@.name=="workspace-data")].persistentVolumeClaim.claimName}')" e2e-ws-workspace

      - name: Workspace - create and delete through the gateway
        run: |
          source scripts/e2e-ml-lib.sh
          api /api/workspaces -X POST -d '{"name":"e2e-ws-api","type":"vscode","idleTimeout":"30m"}' | jq -e '.metadata.name == "e2e-ws-api"'
          wait_for "gateway-created workspace Running" 240 field_is gryviaworkspace/e2e-ws-api '{.status.phase}' Running
          gone pvc/e2e-ws-api-workspace
          echo "ok: no PVC without spec.storage"
          api /api/workspaces/e2e-ws-api -X DELETE >/dev/null
          wait_for "owned pod garbage-collected" 120 gone pod/e2e-ws-api-workspace
          wait_for "owned service garbage-collected" 60 gone svc/e2e-ws-api-workspace

      # ------------------------------------------------------------------ Model registry (needed by inference)
      - name: ModelRegistry - create through the gateway, promote, autoServe creates a service
        run: |
          source scripts/e2e-ml-lib.sh
          # POST /api/models (added with the ML controllers)
          api /api/models -X POST -d '{"name":"e2e-model","version":"v1","artifacts":{"s3Path":"s3://bucket/e2e/v1"}}' \
            | jq -e '.spec.stage == "dev"'
          api /api/models/e2e-model/promote -X POST -d '{"targetStage":"staging"}' | jq -e '.spec.stage == "staging"'
          assert_eq "duplicate create is a conflict" "$(api_status /api/models -X POST -d '{"name":"e2e-model","version":"v1","artifacts":{"s3Path":"s3://b/x"}}')" 409

          # autoServe on a production entry: the controller creates <name>-serving and mirrors its endpoint.
          api /api/models -X POST -d '{"name":"e2e-auto","version":"v1","stage":"production","autoServe":true,"artifacts":{"s3Path":"s3://bucket/e2e/auto"},"servingConfig":{"backend":"torchserve","replicas":1}}' >/dev/null
          wait_for "serving GryviaInferenceService created" 60 kubectl -n "$NS" get gryviainferenceservice/e2e-auto-serving
          assert_eq "serving service owner" "$(jp gryviainferenceservice/e2e-auto-serving '{.metadata.ownerReferences[0].kind}')" GryviaModelRegistry
          assert_eq "serving modelRef" "$(jp gryviainferenceservice/e2e-auto-serving '{.spec.modelRef}')" e2e-auto
          wait_for "model servingEndpoint set" 240 field_set gryviamodelregistry/e2e-auto '{.status.servingEndpoint}'
          assert_eq "model phase" "$(jp gryviamodelregistry/e2e-auto '{.status.phase}')" Serving
          assert_eq "gateway servingEndpoint" "$(gw /api/models/e2e-auto .status.servingEndpoint)" "$(jp gryviamodelregistry/e2e-auto '{.status.servingEndpoint}')"
          # The endpoint really answers from inside the cluster.
          kubectl -n "$NS" run e2e-probe-model --image="$TINY_JOB_IMAGE" --restart=Never --rm -i --image-pull-policy=IfNotPresent -- \
            wget -q -O- -T 10 "$(jp gryviamodelregistry/e2e-auto '{.status.servingEndpoint}')" | grep -qi nginx
          # Archiving stops serving.
          api /api/models/e2e-auto/promote -X POST -d '{"targetStage":"archived"}' | jq -e '.spec.stage == "archived"'
          wait_for "serving service removed" 90 gone gryviainferenceservice/e2e-auto-serving
          wait_for "servingEndpoint cleared" 60 field_empty gryviamodelregistry/e2e-auto '{.status.servingEndpoint}'

      # ------------------------------------------------------------------ InferenceService
      - name: InferenceService - Deployment, Service, HPA, readyReplicas, canary promotion
        run: |
          source scripts/e2e-ml-lib.sh
          cat <<EOF | kubectl apply -f -
          apiVersion: gryvia.io/v1alpha1
          kind: GryviaInferenceService
          metadata: {name: e2e-infer, namespace: gryvia-system}
          spec:
            modelRef: e2e-model
            backend: torchserve
            replicas: 1
            autoscaling: {enabled: true, minReplicas: 1, maxReplicas: 2, targetGPUUtilization: 70}
            canary: {enabled: true, weight: 50, modelVersion: v2}
          EOF
          wait_for "primary Deployment available" 240 kubectl -n "$NS" wait --for=condition=Available deploy/e2e-infer-inference --timeout=5s
          wait_for "inference Ready" 120 field_is gryviainferenceservice/e2e-infer '{.status.phase}' Ready
          assert_eq "readyReplicas" "$(jp gryviainferenceservice/e2e-infer '{.status.readyReplicas}')" 1
          assert_eq "no GPU limit for gpuCount 0" "$(jp deploy/e2e-infer-inference '{.spec.template.spec.containers[0].resources.limits}')" ""
          kubectl -n "$NS" get svc/e2e-infer-inference
          assert_eq "endpoint" "$(jp gryviainferenceservice/e2e-infer '{.status.endpoint}')" "http://e2e-infer-inference.gryvia-system.svc.cluster.local:8080"
          kubectl -n "$NS" run e2e-probe-infer --image="$TINY_JOB_IMAGE" --restart=Never --rm -i --image-pull-policy=IfNotPresent -- \
            wget -q -O- -T 10 "$(jp gryviainferenceservice/e2e-infer '{.status.endpoint}')" | grep -qi nginx

          # HPA exists with the requested range.
          assert_eq "HPA min" "$(jp hpa/e2e-infer-inference-hpa '{.spec.minReplicas}')" 1
          assert_eq "HPA max" "$(jp hpa/e2e-infer-inference-hpa '{.spec.maxReplicas}')" 2
          assert_eq "HPA target" "$(jp hpa/e2e-infer-inference-hpa '{.spec.scaleTargetRef.name}')" e2e-infer-inference

          # Canary: its own Deployment, status.canaryStatus active.
          wait_for "canary Deployment available" 240 kubectl -n "$NS" wait --for=condition=Available deploy/e2e-infer-canary --timeout=5s
          assert_eq "canaryStatus.active" "$(jp gryviainferenceservice/e2e-infer '{.status.canaryStatus.active}')" true
          assert_eq "canary weight" "$(jp gryviainferenceservice/e2e-infer '{.status.canaryStatus.weight}')" 50
          wait_for "canary healthy" 120 field_is gryviainferenceservice/e2e-infer '{.status.canaryStatus.health}' Healthy

          # Gateway view.
          assert_eq "gateway phase" "$(gw /api/inference/e2e-infer .status.phase)" Ready
          assert_eq "gateway readyReplicas" "$(gw /api/inference/e2e-infer .status.readyReplicas)" 1
          assert_nonempty "gateway endpoint" "$(gw /api/inference/e2e-infer .status.endpoint)"
          assert_eq "gateway canary" "$(gw /api/inference/e2e-infer .spec.canary.trafficPercent)" 50
          assert_eq "gateway hpa max" "$(gw /api/inference/e2e-infer .spec.autoscaling.maxReplicas)" 2

          # Auto-promote: the canary version is rolled out to the stable pods and the canary Deployment goes.
          kubectl -n "$NS" patch gryviainferenceservice/e2e-infer --type merge -p '{"spec":{"canary":{"autoPromote":true,"promoteAfterSeconds":1}}}'
          wait_for "canary promoted" 120 field_is gryviainferenceservice/e2e-infer '{.status.canaryStatus.health}' Promoted
          wait_for "canary Deployment removed" 60 gone deploy/e2e-infer-canary
          assert_eq "promotion recorded" "$(jp deploy/e2e-infer-inference '{.metadata.annotations.gryvia\.io/promoted-version}')" v2
          wait_for "stable pods serve v2" 120 field_is deploy/e2e-infer-inference '{.spec.template.spec.containers[0].env[?(@.name=="MODEL_VERSION")].value}' v2
          wait_for "still Ready after the rollout" 240 field_is gryviainferenceservice/e2e-infer '{.status.phase}' Ready
          sleep 10
          gone deploy/e2e-infer-canary
          echo "ok: the promoted canary is not recreated"

      - name: InferenceService - create and delete through the gateway
        run: |
          source scripts/e2e-ml-lib.sh
          api /api/inference -X POST -d '{"name":"e2e-infer-api","modelRef":"e2e-model","backend":"torchserve","replicas":1,"minReplicas":1,"maxReplicas":2,"targetUtilization":70}' \
            | jq -e '.metadata.name == "e2e-infer-api"'
          wait_for "gateway-created service Ready" 240 field_is gryviainferenceservice/e2e-infer-api '{.status.phase}' Ready
          assert_eq "gateway phase" "$(gw /api/inference/e2e-infer-api .status.phase)" Ready
          kubectl -n "$NS" get hpa/e2e-infer-api-inference-hpa
          api /api/inference/e2e-infer-api -X DELETE >/dev/null
          wait_for "Deployment garbage-collected" 120 gone deploy/e2e-infer-api-inference
          wait_for "HPA garbage-collected" 60 gone hpa/e2e-infer-api-inference-hpa

      # ------------------------------------------------------------------ Workflow
      - name: Workflow - script steps run in order, failure skips dependents
        run: |
          source scripts/e2e-ml-lib.sh
          # Script steps run as hardened Pods owned by the controller: no AIJob controller needed.
          cat <<EOF | kubectl apply -f -
          apiVersion: gryvia.io/v1alpha1
          kind: GryviaWorkflow
          metadata: {name: e2e-wf-script, namespace: gryvia-system}
          spec:
            parameters: {GREETING: hello}
            steps:
              - name: first
                type: script
                script: {image: busybox:1.36, command: [sh, -c], args: ["echo \$GREETING; sleep 3"]}
              - name: second
                type: script
                dependsOn: [first]
                script: {image: busybox:1.36, command: [sh, -c], args: ["echo done"]}
          ---
          apiVersion: gryvia.io/v1alpha1
          kind: GryviaWorkflow
          metadata: {name: e2e-wf-fail, namespace: gryvia-system}
          spec:
            steps:
              - name: broken
                type: script
                script: {image: busybox:1.36, command: [sh, -c], args: ["exit 3"]}
              - name: after
                type: script
                dependsOn: [broken]
                script: {image: busybox:1.36, command: [sh, -c], args: ["echo never"]}
          EOF
          wait_for "workflow Succeeded" 240 field_is gryviaworkflow/e2e-wf-script '{.status.phase}' Succeeded
          first_done="$(jp gryviaworkflow/e2e-wf-script '{.status.stepStatuses[?(@.name=="first")].completionTime}')"
          second_start="$(jp gryviaworkflow/e2e-wf-script '{.status.stepStatuses[?(@.name=="second")].startTime}')"
          assert_nonempty "first.completionTime" "$first_done"
          assert_nonempty "second.startTime" "$second_start"
          # RFC3339 timestamps in UTC sort lexicographically: the second step starts after the first finished.
          if [[ "$second_start" < "$first_done" ]]; then echo "second started ($second_start) before first finished ($first_done)" >&2; exit 1; fi
          assert_nonempty "workflow startTime" "$(jp gryviaworkflow/e2e-wf-script '{.status.startTime}')"
          assert_nonempty "workflow completionTime" "$(jp gryviaworkflow/e2e-wf-script '{.status.completionTime}')"
          assert_eq "script pod is non-root" "$(jp pod/e2e-wf-script-first '{.spec.securityContext.runAsNonRoot}')" true
          assert_eq "script pod drops capabilities" "$(jp pod/e2e-wf-script-first '{.spec.containers[0].securityContext.capabilities.drop[0]}')" ALL
          kubectl -n "$NS" logs pod/e2e-wf-script-first | grep -q hello

          wait_for "failing workflow Failed" 180 field_is gryviaworkflow/e2e-wf-fail '{.status.phase}' Failed
          assert_eq "failed step" "$(jp gryviaworkflow/e2e-wf-fail '{.status.stepStatuses[?(@.name=="broken")].phase}')" Failed
          assert_eq "dependent step skipped" "$(jp gryviaworkflow/e2e-wf-fail '{.status.stepStatuses[?(@.name=="after")].phase}')" Skipped

          # Gateway view of the finished workflow.
          assert_eq "gateway phase" "$(gw /api/workflows/e2e-wf-script .status.phase)" Succeeded
          assert_eq "gateway steps" "$(gw /api/workflows/e2e-wf-script '[.status.steps[].status] | join(",")')" "Succeeded,Succeeded"
          assert_eq "gateway step order" "$(gw /api/workflows/e2e-wf-script '[.status.steps[].name] | join(",")')" "first,second"
          assert_nonempty "gateway startedAt" "$(gw /api/workflows/e2e-wf-script .status.startedAt)"
          assert_eq "gateway failed phase" "$(gw /api/workflows/e2e-wf-fail .status.phase)" Failed

      # Job steps create GryviaAIJobs that the AIJob controller runs to completion (batch/v1 Job workload).
      - name: Workflow - two-step DAG of CPU jobs
        run: |
          source scripts/e2e-ml-lib.sh
          cat <<EOF | kubectl apply -f -
          apiVersion: gryvia.io/v1alpha1
          kind: GryviaWorkflow
          metadata: {name: e2e-wf-jobs, namespace: gryvia-system}
          spec:
            steps:
              - name: prep
                type: job
                jobTemplate: {type: training, image: busybox:1.36, gpus: 0, command: [sh, -c], args: ["sleep 5"]}
              - name: train
                type: job
                dependsOn: [prep]
                jobTemplate: {type: training, image: busybox:1.36, gpus: 0, command: [sh, -c], args: ["sleep 5"]}
          EOF
          wait_for "first job step created" 60 kubectl -n "$NS" get gryviaaijob/e2e-wf-jobs-prep
          # Order: the second job does not exist until the first has succeeded.
          if kubectl -n "$NS" get gryviaaijob/e2e-wf-jobs-train >/dev/null 2>&1 && ! field_is gryviaaijob/e2e-wf-jobs-prep '{.status.phase}' Succeeded; then
            echo "train job exists before prep succeeded" >&2; exit 1
          fi
          wait_for "workflow Succeeded" 300 field_is gryviaworkflow/e2e-wf-jobs '{.status.phase}' Succeeded
          assert_eq "prep jobName" "$(jp gryviaworkflow/e2e-wf-jobs '{.status.stepStatuses[?(@.name=="prep")].jobName}')" e2e-wf-jobs-prep
          prep_done="$(jp gryviaworkflow/e2e-wf-jobs '{.status.stepStatuses[?(@.name=="prep")].completionTime}')"
          train_start="$(jp gryviaworkflow/e2e-wf-jobs '{.status.stepStatuses[?(@.name=="train")].startTime}')"
          if [[ "$train_start" < "$prep_done" ]]; then echo "train started before prep finished" >&2; exit 1; fi
          assert_eq "gateway phase" "$(gw /api/workflows/e2e-wf-jobs .status.phase)" Succeeded
          assert_eq "gateway jobRef" "$(gw /api/workflows/e2e-wf-jobs '.status.steps[0].jobRef')" e2e-wf-jobs-prep

      # ------------------------------------------------------------------ AutoTuner
      # Trials are GryviaAIJobs (batch/v1 Job workload). The trial "training" only sleeps; the metric a real trial
      # would report is set here on each trial job with the annotation the tuner reads (gryvia.io/metric-<name>).
      - name: AutoTuner - 3 trials, best trial selected
        run: |
          source scripts/e2e-ml-lib.sh
          cat <<EOF | kubectl apply -f -
          apiVersion: gryvia.io/v1alpha1
          kind: GryviaAutoTuner
          metadata: {name: e2e-tuner, namespace: gryvia-system}
          spec:
            searchAlgorithm: random
            maxTrials: 3
            parallelism: 2
            objective: {metricName: accuracy, direction: maximize}
            parameterSpace:
              - {name: lr, type: float, min: 0.001, max: 0.1}
              - {name: opt, type: categorical, values: [adam, sgd]}
            jobTemplate: {type: training, image: busybox:1.36, gpus: 0, command: [sh, -c], args: ["sleep 20"]}
          EOF
          # Report a metric on each trial job while it runs: trial N gets 0.5 + N/10, so trial 2 is the best.
          (
            end=$((SECONDS + 240))
            while [ $SECONDS -lt $end ]; do
              for i in 0 1 2; do
                kubectl -n gryvia-system annotate "gryviaaijob/e2e-tuner-trial-$i" "gryvia.io/metric-accuracy=0.$((5 + i))" --overwrite >/dev/null 2>&1 || true
              done
              sleep 2
            done
          ) &
          wait_for "first trials created" 90 kubectl -n "$NS" get gryviaaijob/e2e-tuner-trial-1
          # parallelism is 2: the third trial waits until one of the first two has finished (they sleep 20s).
          assert_eq "trials running at first" "$(kubectl -n "$NS" get gryviaaijob -l gryvia.io/tuner=e2e-tuner --no-headers | wc -l | tr -d ' ')" 2
          wait_for "tuner Succeeded" 360 field_is gryviaautotuner/e2e-tuner '{.status.phase}' Succeeded
          assert_eq "trialsCompleted" "$(jp gryviaautotuner/e2e-tuner '{.status.trialsCompleted}')" 3
          assert_eq "trials total" "$(jp gryviaautotuner/e2e-tuner '{.status.trials[*].name}' | wc -w | tr -d ' ')" 3
          assert_eq "bestTrial" "$(jp gryviaautotuner/e2e-tuner '{.status.bestTrial.name}')" e2e-tuner-trial-2
          assert_eq "bestTrial metric" "$(jp gryviaautotuner/e2e-tuner '{.status.bestTrial.metricValue}')" 0.7
          assert_eq "gateway phase" "$(gw /api/tuners/e2e-tuner .status.phase)" Succeeded
          assert_eq "gateway trialsCompleted" "$(gw /api/tuners/e2e-tuner .status.trialsCompleted)" 3
          assert_eq "gateway bestTrialId" "$(gw /api/tuners/e2e-tuner .status.bestTrialId)" e2e-tuner-trial-2
          assert_eq "gateway trials" "$(gw /api/tuners/e2e-tuner/trials '.items | length')" 3

      # ------------------------------------------------------------------ Model factory (GryviaModelWatch)
      # A stand-in hub lists e2e-org/tiny-* models; each new one gets a workflow of busybox steps that only emit the
      # outputs the real scripts would (path, train_loss, score), then a register step. tiny-2 scores best and must be
      # canaried onto the shared service and promoted; tiny-3 scores worse and must be rejected.
      - name: Model factory - stand-in model hub
        run: |
          source scripts/e2e-ml-lib.sh
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata: {name: e2e-fake-hf, namespace: gryvia-system}
          data:
            hub.py: |
              import http.server
              class Hub(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      if not self.path.startswith("/api/models"):
                          self.send_error(404)
                          return
                      try:
                          body = open("/tmp/models.json", "rb").read()
                      except FileNotFoundError:
                          body = b"[]"
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
              http.server.HTTPServer(("", 8080), Hub).serve_forever()
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata: {name: e2e-fake-hf, namespace: gryvia-system}
          spec:
            selector: {matchLabels: {app: e2e-fake-hf}}
            template:
              metadata: {labels: {app: e2e-fake-hf}}
              spec:
                securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
                containers:
                  - name: hub
                    image: ${TINY_PY_IMAGE}
                    imagePullPolicy: IfNotPresent
                    command: [python3, -u, /app/hub.py]
                    ports: [{containerPort: 8080}]
                    readinessProbe: {httpGet: {path: /api/models, port: 8080}, periodSeconds: 2}
                    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
                    volumeMounts: [{name: app, mountPath: /app}]
                volumes: [{name: app, configMap: {name: e2e-fake-hf}}]
          ---
          apiVersion: v1
          kind: Service
          metadata: {name: e2e-fake-hf, namespace: gryvia-system}
          spec: {selector: {app: e2e-fake-hf}, ports: [{port: 8080, targetPort: 8080}]}
          EOF
          kubectl -n "$NS" rollout status deploy/e2e-fake-hf --timeout=120s
          hub_models "$(hf_model tiny-0 1)"

      - name: Model factory - baseline, filters, first model fine-tuned, auto-promoted and served
        run: |
          source scripts/e2e-ml-lib.sh
          # Quoted heredoc: the {{...}} placeholders and $s are for the operator and the step shells, not this one.
          cat <<'EOF' | kubectl apply -f -
          apiVersion: gryvia.io/v1alpha1
          kind: GryviaModelWatch
          metadata: {name: e2e-watch, namespace: gryvia-system}
          spec:
            sources:
              - {provider: huggingface, author: e2e-org, nameRegex: '^tiny-'}
            licenseAllowlist: [apache-2.0]
            maxParamsB: 1
            pollInterval: 10s
            workflowTemplate:
              steps:
                - name: download
                  type: script
                  script:
                    image: busybox:1.36
                    command: [sh, -c]
                    args: ['printf "{\"path\":\"/models/base/{{model.slug}}\",\"revision\":\"{{model.revision}}\"}" > /dev/termination-log']
                - name: finetune
                  type: job
                  dependsOn: [download]
                  jobTemplate:
                    type: training
                    image: busybox:1.36
                    gpus: 0
                    command: [sh, -c]
                    args: ['test "{{steps.download.outputs.revision}}" = "{{model.revision}}" && printf "{\"subPath\":\"{{model.slug}}\",\"train_loss\":0.42}" > /dev/termination-log']
                - name: quantize
                  type: script
                  dependsOn: [finetune]
                  script:
                    image: busybox:1.36
                    command: [sh, -c]
                    args: ['printf "{\"subPath\":\"{{steps.finetune.outputs.subPath}}-awq\",\"format\":\"compressed-tensors\",\"method\":\"awq\",\"scheme\":\"W4A16_ASYM\"}" > /dev/termination-log']
                - name: evaluate
                  type: script
                  dependsOn: [quantize]
                  script:
                    image: busybox:1.36
                    command: [sh, -c]
                    args: ['case "{{model.id}}" in *tiny-2) s=0.8;; *tiny-3) s=0.5;; *) s=0.6;; esac; printf "{\"score\":\"%s\"}" "$s" > /dev/termination-log']
                - name: register
                  type: register
                  dependsOn: [evaluate]
                  register:
                    modelName: e2e-chat
                    version: "{{model.slug}}"
                    artifacts: {s3Path: "s3://bucket/{{steps.quantize.outputs.subPath}}", format: "{{steps.quantize.outputs.format}}"}
                    metadata:
                      eval_score: "{{steps.evaluate.outputs.score}}"
                      train_loss: "{{steps.finetune.outputs.train_loss}}"
                      quantization: "{{steps.quantize.outputs.method}}-{{steps.quantize.outputs.scheme}}"
                    autoServe: true
                    servingConfig: {backend: torchserve, replicas: 1, serviceName: e2e-chat, canaryWeight: 50, promoteAfterSeconds: 30}
                    promotionPolicy: {metric: eval_score, direction: maximize, minDelta: "0.01"}
          EOF
          wait_for "watch Watching" 60 field_is gryviamodelwatch/e2e-watch '{.status.phase}' Watching
          wait_for "tiny-0 recorded as baseline" 60 run_is e2e-watch e2e-org/tiny-0 phase Baseline

          # A new release, one with a license outside the allowlist and one too large (70B > maxParamsB 1).
          hub_models "$(hf_model tiny-0 1)" "$(hf_model tiny-1 2)" "$(hf_model tiny-gpl 3 gpl-3.0)" "$(hf_model tiny-big 4 apache-2.0 70000000000)"
          wait_for "tiny-gpl rejected" 60 run_is e2e-watch e2e-org/tiny-gpl phase Rejected
          wait_for "tiny-big rejected" 30 run_is e2e-watch e2e-org/tiny-big phase Rejected
          wait_for "tiny-1 run Succeeded" 420 run_is e2e-watch e2e-org/tiny-1 phase Succeeded
          assert_eq "baseline never ran" "$(run_field e2e-watch e2e-org/tiny-0 workflow)" ""

          wf1="$(run_field e2e-watch e2e-org/tiny-1 workflow)"
          assert_nonempty "tiny-1 workflow" "$wf1"
          assert_eq "workflow owner" "$(jp "gryviaworkflow/$wf1" '{.metadata.ownerReferences[0].kind}')" GryviaModelWatch
          assert_eq "MODEL_ID parameter" "$(jp "gryviaworkflow/$wf1" '{.spec.parameters.MODEL_ID}')" e2e-org/tiny-1
          assert_eq "job step output (AIJob termination message)" "$(jp "gryviaworkflow/$wf1" '{.status.stepStatuses[?(@.name=="finetune")].outputs.train_loss}')" 0.42
          assert_eq "script step output" "$(jp "gryviaworkflow/$wf1" '{.status.stepStatuses[?(@.name=="evaluate")].outputs.score}')" 0.6

          e1="$(entry_of "$wf1")"
          assert_nonempty "registered entry" "$e1"
          assert_eq "entry metadata from outputs" "$(jp "gryviamodelregistry/$e1" '{.spec.metadata.eval_score}')" 0.6
          assert_eq "entry base_model" "$(jp "gryviamodelregistry/$e1" '{.spec.metadata.base_model}')" e2e-org/tiny-1
          assert_eq "quantized artifacts" "$(jp "gryviamodelregistry/$e1" '{.spec.artifacts.s3Path}')" s3://bucket/tiny-1-awq
          assert_eq "artifact format" "$(jp "gryviamodelregistry/$e1" '{.spec.artifacts.format}')" compressed-tensors
          assert_eq "quantization metadata" "$(jp "gryviamodelregistry/$e1" '{.spec.metadata.quantization}')" awq-W4A16_ASYM
          wait_for "first version promoted to production" 60 field_is "gryviamodelregistry/$e1" '{.spec.stage}' production
          assert_eq "promotion decision" "$(jp "gryviamodelregistry/$e1" '{.status.promotionDecision}')" Promoted
          wait_for "shared service created" 60 kubectl -n "$NS" get gryviainferenceservice/e2e-chat
          assert_eq "shared service is not owned by a version" "$(jp gryviainferenceservice/e2e-chat '{.metadata.ownerReferences}')" ""
          assert_eq "shared service serves the first version" "$(jp gryviainferenceservice/e2e-chat '{.spec.modelRef}')" "$e1"
          wait_for "first version Serving" 240 field_is "gryviamodelregistry/$e1" '{.status.phase}' Serving

          # Gateway view.
          assert_eq "gateway watch phase" "$(gw /api/model-watches/e2e-watch .status.phase)" Watching
          assert_eq "gateway runs" "$(gw /api/model-watches/e2e-watch/runs '.items | length')" 4
          assert_eq "gateway tiny-1 run" "$(gw /api/model-watches/e2e-watch/runs '.items[] | select(.model=="e2e-org/tiny-1") | .phase')" Succeeded

      - name: Model factory - a better model is canaried and promoted, a worse one is rejected
        run: |
          source scripts/e2e-ml-lib.sh
          e1="$(entry_of "$(run_field e2e-watch e2e-org/tiny-1 workflow)")"
          hub_models "$(hf_model tiny-0 1)" "$(hf_model tiny-1 2)" "$(hf_model tiny-gpl 3 gpl-3.0)" "$(hf_model tiny-big 4 apache-2.0 70000000000)" \
            "$(hf_model tiny-2 5)"
          wait_for "tiny-2 run Succeeded" 420 run_is e2e-watch e2e-org/tiny-2 phase Succeeded
          e2="$(entry_of "$(run_field e2e-watch e2e-org/tiny-2 workflow)")"
          assert_nonempty "second entry" "$e2"
          wait_for "better version promoted to production" 60 field_is "gryviamodelregistry/$e2" '{.spec.stage}' production
          wait_for "better version is the canary" 60 field_is gryviainferenceservice/e2e-chat '{.spec.canary.modelVersion}' "$e2"
          assert_eq "canary weight" "$(jp gryviainferenceservice/e2e-chat '{.spec.canary.weight}')" 50
          assert_eq "stable still the first version" "$(jp gryviainferenceservice/e2e-chat '{.spec.modelRef}')" "$e1"
          wait_for "canary promoted: service serves the better version" 360 field_is gryviainferenceservice/e2e-chat '{.spec.modelRef}' "$e2"
          wait_for "replaced version archived" 120 field_is "gryviamodelregistry/$e1" '{.spec.stage}' archived
          wait_for "better version Serving" 120 field_is "gryviamodelregistry/$e2" '{.status.phase}' Serving
          assert_eq "previousVersion" "$(jp "gryviamodelregistry/$e2" '{.status.previousVersion}')" "$e1"

          hub_models "$(hf_model tiny-0 1)" "$(hf_model tiny-1 2)" "$(hf_model tiny-gpl 3 gpl-3.0)" "$(hf_model tiny-big 4 apache-2.0 70000000000)" \
            "$(hf_model tiny-2 5)" "$(hf_model tiny-3 6)"
          wait_for "tiny-3 run Succeeded" 420 run_is e2e-watch e2e-org/tiny-3 phase Succeeded
          e3="$(entry_of "$(run_field e2e-watch e2e-org/tiny-3 workflow)")"
          wait_for "worse version rejected" 60 field_is "gryviamodelregistry/$e3" '{.status.promotionDecision}' Rejected
          assert_eq "worse version stays in staging" "$(jp "gryviamodelregistry/$e3" '{.spec.stage}')" staging
          assert_eq "service still serves the better version" "$(jp gryviainferenceservice/e2e-chat '{.spec.modelRef}')" "$e2"
          assert_eq "no canary for the worse version" "$(jp gryviainferenceservice/e2e-chat '{.spec.canary.modelVersion}')" ""

          # Suspend through the gateway stops polling: a new release is not picked up.
          api /api/model-watches/e2e-watch/suspend -X POST >/dev/null
          wait_for "watch Suspended" 60 field_is gryviamodelwatch/e2e-watch '{.status.phase}' Suspended
          hub_models "$(hf_model tiny-0 1)" "$(hf_model tiny-4 7)"
          sleep 25
          assert_eq "no run while suspended" "$(run_field e2e-watch e2e-org/tiny-4 phase)" ""

      - name: Model factory - a scheduled evaluation drops the score and the previous version comes back
        run: |
          source scripts/e2e-ml-lib.sh
          e1="$(entry_of "$(run_field e2e-watch e2e-org/tiny-1 workflow)")"
          e2="$(entry_of "$(run_field e2e-watch e2e-org/tiny-2 workflow)")"
          assert_eq "e2 serves before" "$(jp gryviainferenceservice/e2e-chat '{.spec.modelRef}')" "$e2"
          kubectl -n "$NS" patch "gryviamodelregistry/$e2" --type=merge -p '{"spec":{"rollbackPolicy":{"metric":"live_score","threshold":"0.5"}}}'
          # The evaluation stand-in reports 0.3; the registry step writes it onto whatever the service serves.
          cat <<'EOF' | kubectl apply -f -
          apiVersion: gryvia.io/v1alpha1
          kind: GryviaWorkflow
          metadata: {name: e2e-live-eval, namespace: gryvia-system}
          spec:
            steps:
              - name: evaluate
                type: script
                script:
                  image: busybox:1.36
                  command: [sh, -c]
                  args: ['printf "{\"score\":\"0.3\"}" > /dev/termination-log']
              - name: record
                type: registry
                dependsOn: [evaluate]
                registry:
                  serviceName: e2e-chat
                  action: updateMetadata
                  metadata: {live_score: "{{steps.evaluate.outputs.score}}"}
          EOF
          wait_for "evaluation workflow Succeeded" 180 field_is gryviaworkflow/e2e-live-eval '{.status.phase}' Succeeded
          assert_eq "registry step picked the serving entry" "$(jp gryviaworkflow/e2e-live-eval '{.status.stepStatuses[?(@.name=="record")].outputs.name}')" "$e2"
          assert_eq "live_score written" "$(jp "gryviamodelregistry/$e2" '{.spec.metadata.live_score}')" 0.3
          wait_for "service back on the previous version" 120 field_is gryviainferenceservice/e2e-chat '{.spec.modelRef}' "$e1"
          wait_for "rolled-back version archived" 60 field_is "gryviamodelregistry/$e2" '{.spec.stage}' archived
          assert_eq "RolledBack condition" "$(jp "gryviamodelregistry/$e2" '{.status.conditions[?(@.type=="RolledBack")].reason}')" PolicyBreached
          assert_eq "rolled-back phase" "$(jp "gryviamodelregistry/$e2" '{.status.phase}')" RolledBack
          assert_eq "previous version back in production" "$(jp "gryviamodelregistry/$e1" '{.spec.stage}')" production
          kubectl -n "$NS" get events --field-selector "involvedObject.name=$e2,reason=RolledBack" -o name | grep -q .
          echo "ok: RolledBack event"
          wait_for "previous version Serving again" 240 field_is "gryviamodelregistry/$e1" '{.status.phase}' Serving
          # The worse staging version is still not promoted against the restored one.
          e3="$(entry_of "$(run_field e2e-watch e2e-org/tiny-3 workflow)")"
          assert_eq "worse version still in staging" "$(jp "gryviamodelregistry/$e3" '{.spec.stage}')" staging
          # The gateway refuses a rollback of the archived entry.
          assert_eq "gateway rollback of an archived entry" "$(api_status "/api/models/$e2/rollback" -X POST)" 409

      # ------------------------------------------------------------------ Datasets (storage-operator)
      # A stand-in file server holds data.csv and its sha256; the dataset controller downloads it into a PVC, one
      # directory per version, and keeps the last two versions.
      - name: Datasets - enable the storage-operator's dataset controller
        run: |
          docker build -f operators/storage-operator/Dockerfile -t ghcr.io/zyvorai/gryvia-storage-operator:dev operators/storage-operator
          kind load docker-image --name "$KIND_CLUSTER" ghcr.io/zyvorai/gryvia-storage-operator:dev
          helm upgrade gryvia ./helm/gryvia --namespace gryvia-system --reuse-values --wait --timeout 300s \
            --set storageOperator.enabled=true --set storageOperator.datasets.enabled=true \
            --set storageOperator.datasets.image="$TINY_JOB_IMAGE" --set storageOperator.datasets.defaultSize=64Mi
          kubectl -n gryvia-system rollout status deploy -l app.kubernetes.io/component=storage-operator --timeout=180s
          source scripts/e2e-ml-lib.sh
          check() { kubectl -n "$NS" logs -l app.kubernetes.io/component=storage-operator --tail=-1 | grep -q '"controllerKind":"GryviaDataset"'; }
          wait_for "controller GryviaDataset started" 90 check

      - name: Datasets - stand-in file server
        run: |
          source scripts/e2e-ml-lib.sh
          mkdir -p /tmp/e2e-files
          printf 'id,label\n1,cat\n2,dog\n' > /tmp/e2e-files/data.csv
          (cd /tmp/e2e-files && sha256sum data.csv > data.csv.sha256)
          printf 'not the data\n' > /tmp/e2e-files/bad.sha256
          kubectl -n "$NS" create configmap e2e-files --from-file=/tmp/e2e-files --dry-run=client -o yaml | kubectl apply -f -
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata: {name: e2e-files, namespace: gryvia-system}
          spec:
            selector: {matchLabels: {app: e2e-files}}
            template:
              metadata: {labels: {app: e2e-files}}
              spec:
                securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
                containers:
                  - name: files
                    image: ${TINY_PY_IMAGE}
                    imagePullPolicy: IfNotPresent
                    command: [python3, -u, -m, http.server, "8080", --directory, /files]
                    ports: [{containerPort: 8080}]
                    readinessProbe: {httpGet: {path: /data.csv, port: 8080}, periodSeconds: 2}
                    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
                    volumeMounts: [{name: files, mountPath: /files}]
                volumes: [{name: files, configMap: {name: e2e-files}}]
          ---
          apiVersion: v1
          kind: Service
          metadata: {name: e2e-files, namespace: gryvia-system}
          spec: {selector: {app: e2e-files}, ports: [{port: 8080, targetPort: 8080}]}
          EOF
          kubectl -n "$NS" rollout status deploy/e2e-files --timeout=120s

      - name: Datasets - download, checksum, versions, retention, gateway
        run: |
          source scripts/e2e-ml-lib.sh
          files=http://e2e-files.gryvia-system.svc:8080
          want_sum="$(cut -d' ' -f1 /tmp/e2e-files/data.csv.sha256)"
          create() {
            api /api/datasets -X POST -d "{\"name\":\"e2e-data\",\"type\":\"tabular\",\"version\":\"$1\",\"retention\":{\"keepLast\":2},
              \"source\":{\"type\":\"http\",\"http\":{\"url\":\"$files/data.csv\",\"checksumURL\":\"$files/data.csv.sha256\"}}}"
          }
          create v1 | jq -e '.metadata.name == "e2e-data"'
          wait_for "dataset ready" 240 field_is gryviadataset/e2e-data '{.status.state}' ready
          assert_eq "PVC" "$(jp gryviadataset/e2e-data '{.status.pvcName}')" dataset-e2e-data
          assert_eq "PVC owner" "$(jp pvc/dataset-e2e-data '{.metadata.ownerReferences[0].kind}')" GryviaDataset
          assert_eq "subPath" "$(jp gryviadataset/e2e-data '{.status.subPath}')" v1
          assert_eq "files" "$(jp gryviadataset/e2e-data '{.status.fileCount}')" 1
          assert_eq "bytes" "$(jp gryviadataset/e2e-data '{.status.totalSizeBytes}')" "$(stat -c %s /tmp/e2e-files/data.csv)"
          assert_eq "Ready condition" "$(jp gryviadataset/e2e-data '{.status.conditions[?(@.type=="Ready")].status}')" True

          # A pod mounting the PVC sees the file, byte for byte.
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata: {name: e2e-data-reader, namespace: gryvia-system}
          spec:
            restartPolicy: Never
            securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
            containers:
              - name: read
                image: ${TINY_JOB_IMAGE}
                imagePullPolicy: IfNotPresent
                command: [sha256sum, /data/v1/data.csv]
                securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
                volumeMounts: [{name: data, mountPath: /data, readOnly: true}]
            volumes: [{name: data, persistentVolumeClaim: {claimName: dataset-e2e-data, readOnly: true}}]
          EOF
          wait_for "reader done" 120 field_is pod/e2e-data-reader '{.status.phase}' Succeeded
          assert_eq "file content" "$(kubectl -n "$NS" logs pod/e2e-data-reader | cut -d' ' -f1)" "$want_sum"
          kubectl -n "$NS" delete pod/e2e-data-reader --wait=true

          # New versions: v2 and v3 are downloaded; keepLast 2 drops v1.
          for v in v2 v3; do
            kubectl -n "$NS" patch gryviadataset/e2e-data --type=merge -p "{\"spec\":{\"version\":\"$v\"}}"
            wait_for "dataset $v ready" 240 field_is gryviadataset/e2e-data '{.status.currentVersion}' "$v"
            wait_for "dataset ready at $v" 60 field_is gryviadataset/e2e-data '{.status.state}' ready
          done
          assert_eq "kept versions" "$(jp gryviadataset/e2e-data '{.status.versions[*].version}')" "v2 v3"

          # Gateway view.
          assert_eq "gateway state" "$(gw /api/datasets/e2e-data .status.state)" ready
          assert_eq "gateway version" "$(gw /api/datasets/e2e-data .status.currentVersion)" v3
          assert_eq "gateway list" "$(gw /api/datasets '[.items[] | select(.metadata.name=="e2e-data")] | length')" 1
          assert_eq "invalid source is a 422" "$(api_status /api/datasets -X POST -d '{"name":"e2e-bad","source":{"type":"s3"}}')" 422

          # A checksum mismatch fails the download and says so.
          api /api/datasets -X POST -d "{\"name\":\"e2e-data-bad\",\"source\":{\"type\":\"http\",\"http\":{\"url\":\"$files/data.csv\",\"checksumURL\":\"$files/bad.sha256\"}}}" >/dev/null
          wait_for "checksum mismatch is an error" 300 field_is gryviadataset/e2e-data-bad '{.status.state}' error
          jp gryviadataset/e2e-data-bad '{.status.message}' | grep -q "sha256 mismatch"
          echo "ok: checksum mismatch reported"

          # Delete through the gateway: the PVC goes with it.
          api /api/datasets/e2e-data -X DELETE >/dev/null
          wait_for "PVC garbage-collected" 120 gone pvc/dataset-e2e-data

      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n gryvia-system get gryviaworkspaces,gryviainferenceservices,gryviamodelregistries,gryviaworkflows,gryviaautotuners,gryviamodelwatches,gryviaaijobs -o wide || true
          kubectl -n gryvia-system get gryviaworkspaces,gryviainferenceservices,gryviamodelregistries,gryviaworkflows,gryviaautotuners,gryviamodelwatches -o yaml | tail -300 || true
          kubectl -n gryvia-system logs -l app.kubernetes.io/component=ai-operator --tail=200 || true
          kubectl -n gryvia-system logs -l app=gryvia-api-gateway --tail=50 || true
          kubectl -n gryvia-system logs deploy/e2e-fake-hf --tail=50 || true
          kubectl get gryviadatasets -o yaml || true
          kubectl -n gryvia-system get jobs,pvc -l gryvia.io/dataset || true
          kubectl -n gryvia-system logs -l app.kubernetes.io/component=storage-operator --tail=100 || true

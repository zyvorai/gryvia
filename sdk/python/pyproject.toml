[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tensorreaper"
version = "0.1.0"
description = "Python SDK for TensorReaper - Kubernetes-native GPU compute platform for AI/ML"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "TensorReaper Authors" },
]
keywords = ["kubernetes", "gpu", "ai", "ml", "tensorreaper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
]

[project.urls]
Homepage = "https://github.com/tensorreaper/kube-fabric"
Documentation = "https://github.com/tensorreaper/kube-fabric/tree/main/sdk/python"
Repository = "https://github.com/tensorreaper/kube-fabric"

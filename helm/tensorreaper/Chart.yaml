apiVersion: v2
name: tensorreaper
description: Enterprise GPU Compute Platform for AI Infrastructure
type: application
version: 1.0.0
appVersion: "1.0.0"
kubeVersion: ">=1.30.0"

keywords:
  - gpu
  - ai
  - ml
  - nvidia
  - kubernetes
  - distributed-training
  - bare-metal

home: https://github.com/ssahani/tensor-reaper
sources:
  - https://github.com/ssahani/tensor-reaper

maintainers:
  - name: TensorReaper Team
    email: team@tensorreaper.ai
    url: https://github.com/ssahani/tensor-reaper

icon: https://raw.githubusercontent.com/ssahani/tensor-reaper/main/docs/assets/logo.png

dependencies:
  - name: prometheus
    version: "27.3.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
    tags:
      - monitoring

  - name: grafana
    version: "8.8.4"
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
    tags:
      - monitoring

annotations:
  category: Infrastructure
  licenses: Apache-2.0

{{- if .Values.aiOperator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubefabric.fullname" . }}-ai-operator
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "kubefabric.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-operator
spec:
  replicas: {{ .Values.aiOperator.replicas }}
  selector:
    matchLabels:
      {{- include "kubefabric.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ai-operator
  template:
    metadata:
      labels:
        {{- include "kubefabric.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ai-operator
    spec:
      serviceAccountName: {{ include "kubefabric.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.aiOperator.image.repository }}:{{ .Values.aiOperator.image.tag }}"
          imagePullPolicy: {{ .Values.aiOperator.image.pullPolicy }}
          command:
            - /manager
          args:
            - --leader-elect={{ .Values.ha.leaderElection }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.aiOperator.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.aiOperator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.aiOperator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

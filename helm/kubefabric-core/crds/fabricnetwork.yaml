apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricnetworks.kubefabric.ai
spec:
  group: kubefabric.ai
  names:
    kind: FabricNetwork
    listKind: FabricNetworkList
    plural: fabricnetworks
    singular: fabricnetwork
    shortNames:
      - fnet
      - network
    categories:
      - kubefabric
      - all
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: FabricNetwork is the Schema for the fabricnetworks API
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - mode
              properties:
                mode:
                  type: string
                  description: "Network mode"
                  enum:
                    - standard
                    - sriov
                    - rdma
                    - ovn
                rdma:
                  type: boolean
                  description: "Enable RDMA"
                  default: false
                bandwidth:
                  type: string
                  description: "Network bandwidth (e.g., 100Gbps, 200Gbps, 400Gbps)"
                fabric:
                  type: string
                  description: "Network fabric type"
                  enum:
                    - InfiniBand
                    - RoCE
                    - TCP
                  default: TCP
                topology:
                  type: string
                  description: "Network topology"
                  enum:
                    - leaf-spine
                    - fat-tree
                    - dragonfly
                mtu:
                  type: integer
                  description: "Maximum Transmission Unit"
                  default: 1500
                  minimum: 1500
                  maximum: 9000
                vlan:
                  type: object
                  description: "VLAN configuration"
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    id:
                      type: integer
                      minimum: 1
                      maximum: 4094
                sriov:
                  type: object
                  description: "SR-IOV configuration"
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    deviceType:
                      type: string
                      description: "Network device type"
                    numVFs:
                      type: integer
                      description: "Number of Virtual Functions"
                      minimum: 1
                      maximum: 128
                    resourceName:
                      type: string
                      description: "Resource name for SR-IOV VF"
                rdmaConfig:
                  type: object
                  description: "RDMA configuration"
                  properties:
                    protocol:
                      type: string
                      enum:
                        - RoCEv2
                        - InfiniBand
                      default: RoCEv2
                    queuePairs:
                      type: integer
                      minimum: 1
                      default: 8
                    priority:
                      type: integer
                      minimum: 0
                      maximum: 7
                      default: 0
                cni:
                  type: string
                  description: "CNI plugin"
                  enum:
                    - cilium
                    - calico
                    - flannel
                    - multus
                  default: cilium
                policies:
                  type: array
                  description: "Network policies"
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Configuring
                    - Ready
                    - Degraded
                    - Failed
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                nodesConfigured:
                  type: integer
                totalNodes:
                  type: integer
                availableVFs:
                  type: integer
                metrics:
                  type: object
                  properties:
                    bandwidth:
                      type: string
                    latency:
                      type: string
                    packetLoss:
                      type: number
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: RDMA
          type: boolean
          jsonPath: .spec.rdma
        - name: Bandwidth
          type: string
          jsonPath: .spec.bandwidth
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

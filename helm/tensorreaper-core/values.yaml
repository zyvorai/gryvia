# Default values for tensorreaper-core

# GPU Operator configuration
gpuOperator:
  enabled: true
  image:
    repository: tensorreaper/gpu-operator
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  healthCheck:
    enabled: true
    intervalSeconds: 60
  nodeSelector: {}
  tolerations: []

# AI Workload Operator configuration
aiOperator:
  enabled: true
  image:
    repository: tensorreaper/ai-operator
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []

# Storage Operator configuration
storageOperator:
  enabled: false
  image:
    repository: tensorreaper/storage-operator
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Network Operator configuration
networkOperator:
  enabled: false
  image:
    repository: tensorreaper/network-operator
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Quota Operator configuration
quotaOperator:
  enabled: true
  image:
    repository: tensorreaper/quota-operator
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Default GPU pricing (USD per hour)
  pricing:
    H100: 8.00
    A100-80G: 4.00
    A100-40G: 3.00
    L40: 2.50
    A10: 1.50
    V100: 2.00
    T4: 0.75

# NVIDIA GPU device plugin
nvidiaDevicePlugin:
  enabled: true
  image:
    repository: nvcr.io/nvidia/k8s-device-plugin
    tag: v0.17.0
    pullPolicy: IfNotPresent

# NVIDIA DCGM Exporter for metrics
dcgmExporter:
  enabled: true
  image:
    repository: nvcr.io/nvidia/k8s/dcgm-exporter
    tag: 3.3.9-3.6.1-ubuntu22.04
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9400

# RBAC configuration
rbac:
  create: true

# Service Account configuration
serviceAccount:
  create: true
  name: tensorreaper-operator
  annotations: {}

# Namespace configuration
namespace:
  create: true
  name: tensorreaper-system

# CRD installation
crds:
  install: true
  keep: true

# Monitoring configuration
monitoring:
  enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
  grafana:
    enabled: true
    dashboards:
      enabled: true

# High availability
ha:
  enabled: false
  leaderElection: true

# Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

# Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Name overrides
nameOverride: ""
fullnameOverride: ""

# Image pull secrets
imagePullSecrets: []

# Global labels
labels: {}

# Global annotations
annotations: {}

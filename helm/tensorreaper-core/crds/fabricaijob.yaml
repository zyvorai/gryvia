apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricaijobs.tensorreaper.ai
spec:
  group: tensorreaper.ai
  names:
    kind: FabricAIJob
    listKind: FabricAIJobList
    plural: fabricaijobs
    singular: fabricaijob
    shortNames:
      - faij
      - aijob
    categories:
      - tensorreaper
      - all
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: FabricAIJob is the Schema for the fabricaijobs API
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - type
                - gpus
                - image
              properties:
                type:
                  type: string
                  description: "Workload type"
                  enum:
                    - training
                    - inference
                    - fine-tuning
                    - evaluation
                model:
                  type: string
                  description: "Model name (llama-70b, gpt-4, stable-diffusion, etc.)"
                gpus:
                  type: integer
                  description: "Number of GPUs required"
                  minimum: 1
                  maximum: 512
                gpuType:
                  type: string
                  description: "Preferred GPU type"
                  enum:
                    - H100
                    - H200
                    - A100
                    - A100-80GB
                    - L40
                    - L40S
                    - V100
                    - T4
                    - any
                  default: any
                storage:
                  type: string
                  description: "Storage backend name"
                network:
                  type: string
                  description: "Network type"
                  enum:
                    - rdma
                    - sriov
                    - standard
                  default: standard
                image:
                  type: string
                  description: "Container image"
                imagePullPolicy:
                  type: string
                  enum:
                    - Always
                    - IfNotPresent
                    - Never
                  default: IfNotPresent
                command:
                  type: array
                  items:
                    type: string
                  description: "Container command"
                args:
                  type: array
                  items:
                    type: string
                  description: "Container arguments"
                env:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                      valueFrom:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                workingDir:
                  type: string
                  description: "Working directory"
                distributed:
                  type: object
                  description: "Distributed training configuration"
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    framework:
                      type: string
                      enum:
                        - pytorch
                        - tensorflow
                        - horovod
                        - deepspeed
                        - megatron
                    nodes:
                      type: integer
                      minimum: 1
                      default: 1
                    gpusPerNode:
                      type: integer
                      minimum: 1
                      default: 8
                    backend:
                      type: string
                      enum:
                        - nccl
                        - gloo
                        - mpi
                      default: nccl
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      properties:
                        memory:
                          type: string
                        cpu:
                          type: string
                        ephemeral-storage:
                          type: string
                    limits:
                      type: object
                      properties:
                        memory:
                          type: string
                        cpu:
                          type: string
                        ephemeral-storage:
                          type: string
                volumes:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                volumeMounts:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - mountPath
                    properties:
                      name:
                        type: string
                      mountPath:
                        type: string
                      subPath:
                        type: string
                      readOnly:
                        type: boolean
                priority:
                  type: integer
                  description: "Job priority (0-100, higher = more important)"
                  minimum: 0
                  maximum: 100
                  default: 50
                retryLimit:
                  type: integer
                  description: "Number of retries on failure"
                  minimum: 0
                  maximum: 10
                  default: 3
                timeout:
                  type: string
                  description: "Job timeout (e.g., 24h, 7d)"
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                tolerations:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                affinity:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Current phase"
                  enum:
                    - Pending
                    - Scheduling
                    - Running
                    - Succeeded
                    - Failed
                    - Unknown
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
                nodesAllocated:
                  type: array
                  items:
                    type: string
                gpusAllocated:
                  type: integer
                retries:
                  type: integer
                metrics:
                  type: object
                  properties:
                    gpuUtilization:
                      type: number
                      description: "Average GPU utilization %"
                    throughput:
                      type: string
                      description: "Training throughput"
                    loss:
                      type: number
                      description: "Current loss value"
                    epoch:
                      type: integer
                      description: "Current epoch"
                    step:
                      type: integer
                      description: "Current step"
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: GPUs
          type: integer
          jsonPath: .spec.gpus
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

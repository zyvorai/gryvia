{{- if .Values.gpuOperator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tensorreaper.fullname" . }}-gpu-operator
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "tensorreaper.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpu-operator
spec:
  replicas: {{ .Values.gpuOperator.replicas }}
  selector:
    matchLabels:
      {{- include "tensorreaper.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gpu-operator
  template:
    metadata:
      labels:
        {{- include "tensorreaper.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gpu-operator
    spec:
      serviceAccountName: {{ include "tensorreaper.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.gpuOperator.image.repository }}:{{ .Values.gpuOperator.image.tag }}"
          imagePullPolicy: {{ .Values.gpuOperator.image.pullPolicy }}
          command:
            - /manager
          args:
            - --leader-elect={{ .Values.ha.leaderElection }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gpuOperator.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.gpuOperator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gpuOperator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

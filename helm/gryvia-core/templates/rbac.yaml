{{- if .Values.rbac.create -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gryvia.fullname" . }}-manager-role
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
rules:
  # Manage FabricGpuNode resources
  - apiGroups:
      - gryvia.io
    resources:
      - fabricgpunodes
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - gryvia.io
    resources:
      - fabricgpunodes/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - gryvia.io
    resources:
      - fabricgpunodes/finalizers
    verbs:
      - update

  # Manage FabricAIJob resources
  - apiGroups:
      - gryvia.io
    resources:
      - fabricaijobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - gryvia.io
    resources:
      - fabricaijobs/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - gryvia.io
    resources:
      - fabricaijobs/finalizers
    verbs:
      - update

  # Manage Kubernetes nodes
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
      - update
      - patch

  # Manage FabricQuota resources
  - apiGroups:
      - gryvia.io
    resources:
      - fabricquotas
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - gryvia.io
    resources:
      - fabricquotas/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - gryvia.io
    resources:
      - fabricquotas/finalizers
    verbs:
      - update

  # Manage FabricNetwork resources
  - apiGroups:
      - gryvia.io
    resources:
      - fabricnetworks
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - gryvia.io
    resources:
      - fabricnetworks/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - gryvia.io
    resources:
      - fabricnetworks/finalizers
    verbs:
      - update

  # Manage FabricStorage resources
  - apiGroups:
      - gryvia.io
    resources:
      - fabricstorages
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - gryvia.io
    resources:
      - fabricstorages/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - gryvia.io
    resources:
      - fabricstorages/finalizers
    verbs:
      - update

  # Manage pods (scoped to gryvia-managed pods)
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - delete

  # Manage StatefulSets
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete

  # Manage Services
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete

  # Manage PVCs
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete

  # Manage FabricCheckpointGuard resources
  - apiGroups:
      - gryvia.io
    resources:
      - fabriccheckpointguards
      - fabriccheckpointguards/status
      - fabriccheckpointguards/finalizers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # Manage FabricCostPredictor resources
  - apiGroups:
      - gryvia.io
    resources:
      - fabriccostpredictors
      - fabriccostpredictors/status
      - fabriccostpredictors/finalizers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # Manage FabricLiveExperiment resources
  - apiGroups:
      - gryvia.io
    resources:
      - fabricliveexperiments
      - fabricliveexperiments/status
      - fabricliveexperiments/finalizers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # Manage FabricModelLineage resources
  - apiGroups:
      - gryvia.io
    resources:
      - fabricmodellineages
      - fabricmodellineages/status
      - fabricmodellineages/finalizers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # Manage FabricTrainingProfiler resources
  - apiGroups:
      - gryvia.io
    resources:
      - fabrictrainingprofilers
      - fabrictrainingprofilers/status
      - fabrictrainingprofilers/finalizers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # Manage FabricTrainingTimeMachine resources
  - apiGroups:
      - gryvia.io
    resources:
      - fabrictrainingtimemachines
      - fabrictrainingtimemachines/status
      - fabrictrainingtimemachines/finalizers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # Manage FabricGpuMemoryOptimizer resources
  - apiGroups:
      - gryvia.io
    resources:
      - fabricgpumemoryoptimizers
      - fabricgpumemoryoptimizers/status
      - fabricgpumemoryoptimizers/finalizers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # Manage additional CRD resources
  - apiGroups:
      - gryvia.io
    resources:
      - fabricbudgets
      - fabricbudgets/status
      - fabricbudgets/finalizers
      - fabricchargebacks
      - fabricchargebacks/status
      - fabricchargebacks/finalizers
      - fabricquotapolicies
      - fabricquotapolicies/status
      - fabricquotapolicies/finalizers
      - fabricaudits
      - fabricaudits/status
      - fabricautoscalers
      - fabricautoscalers/status
      - fabricbenchmarks
      - fabricbenchmarks/status
      - fabricgpusharingpolicies
      - fabricgpusharingpolicies/status
      - fabricjobhooks
      - fabricjobhooks/status
      - fabricpriorities
      - fabricpriorities/status
      - fabricslas
      - fabricslas/status
      - fabrictemplates
      - fabrictemplates/status
      - fabricdatasets
      - fabricdatasets/status
      - fabricfederations
      - fabricfederations/status
      - fabricmetrics
      - fabricmetrics/status
      - fabricretrypolicies
      - fabricretrypolicies/status
      - fabricdrtests
      - fabricdrtests/status
      - fabricreservations
      - fabricreservations/status
      - fabrichealthchecks
      - fabrichealthchecks/status
      - fabrictenants
      - fabrictenants/status
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # Manage Namespaces and ResourceQuotas
  - apiGroups:
      - ""
    resources:
      - namespaces
      - resourcequotas
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Manage DaemonSets and ConfigMaps
  - apiGroups:
      - apps
    resources:
      - daemonsets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete

  # Manage StorageClasses
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete

  # Manage NetworkAttachmentDefinitions (Multus)
  - apiGroups:
      - k8s.cni.cncf.io
    resources:
      - network-attachment-definitions
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete

  # Read pod logs for experiment scraping
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get

  # Manage ServiceAccounts and RBAC for CSI drivers
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - clusterrolebindings
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete

  # Leader election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # Events
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gryvia.fullname" . }}-manager-rolebinding
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gryvia.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "gryvia.serviceAccountName" . }}
    namespace: {{ .Values.namespace.name }}
{{- end }}

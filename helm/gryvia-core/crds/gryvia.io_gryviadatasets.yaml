  name: fabricdatasets.gryvia.io
spec:
  group: gryvia.io
  names:
    kind: FabricDataset
    listKind: FabricDatasetList
    plural: fabricdatasets
    singular: fabricdataset
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.currentVersion
      name: Version
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.usage.jobsUsing

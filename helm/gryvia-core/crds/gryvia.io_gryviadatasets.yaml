      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: FabricDataset is the Schema for the fabricdatasets API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FabricDatasetSpec defines the desired state of FabricDataset
            properties:
              access:
                description: Access defines access control
                properties:
                  allowedTeams:
                    description: AllowedTeams lists teams that can access the dataset
                    items:
                      type: string
                    type: array
                  allowedUsers:
                    description: AllowedUsers lists users that can access the dataset
                    items:
                      type: string
                    type: array
                  public:
                    description: Public indicates whether the dataset is publicly
                      accessible
                    type: boolean
                type: object
              cache:
                description: Cache defines caching configuration
                properties:
                  enabled:
                    description: Enabled enables caching
                    type: boolean
                  size:
                    description: Size is the cache size
                    type: string
                  storageClass:
                    description: StorageClass is the storage class for cache PVCs
                    type: string
                  warmup:
                    description: Warmup enables pre-loading cache on first access
                    type: boolean
                type: object
              description:
                description: Description is a human-readable description
                type: string

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fabricgpunodes.gryvia.io
spec:
  group: gryvia.io
  names:
    kind: FabricGpuNode
    listKind: FabricGpuNodeList
    plural: fabricgpunodes
    singular: fabricgpunode
    shortNames:
      - fgn
      - gpunode
    categories:
      - gryvia
      - all
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: FabricGpuNode is the Schema for the fabricgpunodes API
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - nodeName
                - gpuType
                - gpuCount
              properties:
                nodeName:
                  type: string
                  description: "Kubernetes node name"
                gpuType:
                  type: string
                  description: "GPU model (H100, A100, L40, V100, etc.)"
                  enum:
                    - H100
                    - H200
                    - A100
                    - A100-80GB
                    - L40
                    - L40S
                    - V100
                    - T4
                gpuCount:
                  type: integer
                  description: "Number of GPUs on this node"
                  minimum: 1
                  maximum: 72
                rdma:
                  type: boolean
                  description: "RDMA support enabled"
                  default: false
                sriov:
                  type: boolean
                  description: "SR-IOV support enabled"
                  default: false
                interconnect:
                  type: string
                  description: "GPU interconnect type"
                  enum:
                    - NVLink
                    - NVSwitch
                    - PCIe
                    - InfiniBand
                    - RoCE
                  default: PCIe
                bandwidth:
                  type: string
                  description: "Network bandwidth (e.g., 200Gbps, 400Gbps)"
                memoryGB:
                  type: integer
                  description: "GPU memory per GPU in GB"
                computeCapability:
                  type: string
                  description: "CUDA compute capability"
                drivers:
                  type: object
                  properties:
                    nvidia:
                      type: string
                      description: "NVIDIA driver version"
                    cuda:
                      type: string
                      description: "CUDA version"
                healthCheck:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    intervalSeconds:
                      type: integer
                      default: 60
                      minimum: 30
                      maximum: 300
                labels:
                  type: object
                  additionalProperties:
                    type: string
                  description: "Custom labels to apply to the node"
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Current phase (Initializing, Ready, Degraded, Failed)"
                  enum:
                    - Initializing
                    - Ready
                    - Degraded
                    - Failed
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                gpuStatus:
                  type: array
                  items:
                    type: object
                    properties:
                      index:
                        type: integer
                      uuid:
                        type: string
                      health:
                        type: string
                        enum:
                          - Healthy
                          - Degraded
                          - Failed
                      temperature:
                        type: integer
                      powerUsage:
                        type: integer
                      memoryUsed:
                        type: integer
                      memoryTotal:
                        type: integer
                      utilization:
                        type: integer
                        minimum: 0
                        maximum: 100
                driverVersion:
                  type: string
                cudaVersion:
                  type: string
                lastHealthCheck:
                  type: string
                  format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Node
          type: string
          jsonPath: .spec.nodeName
        - name: GPU-Type
          type: string
          jsonPath: .spec.gpuType
        - name: GPU-Count
          type: integer
          jsonPath: .spec.gpuCount
        - name: RDMA
          type: boolean
          jsonPath: .spec.rdma
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: gryviaslas.gryvia.io
spec:
  group: gryvia.io
  names:
    kind: GryviaSLA
    listKind: GryviaSLAList
    plural: gryviaslas
    singular: gryviasla
  scope: Cluster
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: GryviaSLA is the Schema for the gryviaslas API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GryviaSLASpec defines the desired state of GryviaSLA
            properties:
              availability:
                description: Availability defines availability guarantees
                properties:
                  maintenanceWindows:
                    description: MaintenanceWindows defines scheduled maintenance
                    items:
                      description: SLAMaintenanceWindow defines a maintenance window
                      properties:
                        dayOfWeek:
                          description: DayOfWeek for the window
                          type: string
                        duration:
                          description: Duration of the window
                          type: string
                        startTime:
                          description: StartTime in HH:MM format
                          type: string
                      type: object
                    type: array
                  maxDowntimeMinutes:
                    description: MaxDowntimeMinutes is max allowed downtime per month
                    type: number
                  uptime:
                    description: Uptime is the uptime percentage target (e.g., 99.9)
                    type: number
                type: object
              failureHandling:
                description: FailureHandling defines failure handling policy
                properties:
                  autoRetry:
                    description: AutoRetry enables auto-retry on failure
                    type: boolean
                  compensation:
                    description: Compensation defines SLA breach compensation
                    properties:
                      enabled:
                        description: Enabled enables compensation
                        type: boolean
                      percentage:
                        description: Percentage of compensation
                        type: number
                      type:
                        description: Type of compensation (credit, refund, priority-boost)
                        type: string
                    type: object
                  maxRetries:
                    description: MaxRetries is the max number of retries
                    type: integer
                type: object
              monitoring:
                description: Monitoring defines monitoring and reporting
                properties:
                  metricsRetention:
                    description: MetricsRetention defines how long to keep metrics
                    type: string
                  reports:
                    description: Reports defines report generation
                    properties:
                      frequency:
                        description: Frequency of reports (daily, weekly, monthly,
                          quarterly)
                        type: string
                      recipients:
                        description: Recipients for reports
                        items:
                          type: string
                        type: array
                    type: object
                type: object
              performance:
                description: Performance defines performance guarantees
                properties:
                  guaranteedStart:
                    description: GuaranteedStart guarantees the job starts within
                      MaxQueueTime
                    type: boolean
                  maxQueueTime:
                    description: MaxQueueTime is the max time a job can wait in queue
                    type: string
                  minThroughput:
                    description: MinThroughput defines minimum throughput requirements
                    properties:
                      unit:
                        description: Unit is the throughput unit (samples/sec, tokens/sec,
                          etc.)
                        type: string
                      value:
                        description: Value is the throughput value
                        type: number
                    type: object
                  targetCompletionTime:
                    description: TargetCompletionTime is the target completion time
                    type: string
                type: object
              resources:
                description: Resources defines resource guarantees
                properties:
                  fallbackAllowed:
                    description: FallbackAllowed allows fallback to different GPU
                      type
                    type: boolean
                  guaranteedGPUTypes:
                    description: GuaranteedGPUTypes lists GPU types guaranteed available
                    items:
                      type: string
                    type: array
                  reservedCapacity:
                    description: ReservedCapacity defines reserved GPU capacity
                    properties:
                      always:
                        description: Always reserves capacity at all times
                        type: boolean
                      gpuCount:
                        description: GPUCount is the number of reserved GPUs
                        type: integer
                    type: object
                type: object
              scope:
                description: Scope defines who this SLA applies to
                properties:
                  name:
                    description: Name of the scoped entity
                    type: string
                  type:
                    description: Type is the scope type (team, user, job-type, namespace)
                    type: string
                type: object
              support:
                description: Support defines support level
                properties:
                  businessHours:
                    description: BusinessHours indicates business hours only support
                    type: boolean
                  channels:
                    description: Channels available (email, slack, phone, pagerduty)
                    items:
                      type: string
                    type: array
                  responseTime:
                    description: ResponseTime is the max response time
                    type: string
                type: object
              tier:
                description: Tier is the SLA tier (platinum, gold, silver, bronze,
                  best-effort)
                type: string
            required:
            - scope
            - tier
            type: object
          status:
            description: GryviaSLAStatus defines the observed state of GryviaSLA
            properties:
              breaches:
                description: Breaches is the list of SLA breaches
                items:
                  description: SLABreach records an SLA breach
                  properties:
                    compensated:
                      description: Compensated indicates if compensation was applied
                      type: boolean
                    duration:
                      description: Duration of the breach
                      type: string
                    severity:
                      description: Severity of the breach
                      type: string
                    timestamp:
                      description: Timestamp of the breach
                      format: date-time
                      type: string
                    type:
                      description: Type of breach (queue-time-exceeded, downtime-exceeded,
                        etc.)
                      type: string
                  type: object
                type: array
              compliance:
                description: Compliance tracks SLA compliance
                properties:
                  current:
                    description: Current compliance percentage
                    type: number
                  lastMonth:
                    description: LastMonth compliance
                    type: number
                  trend:
                    description: Trend (improving, stable, degrading)
                    type: string
                type: object
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              metrics:
                description: Metrics tracks SLA performance metrics
                properties:
                  avgQueueTime:
                    description: AvgQueueTime is the average queue time
                    type: string
                  breaches:
                    description: Breaches is the total number of breaches
                    type: integer
                  p95QueueTime:
                    description: P95QueueTime is the 95th percentile queue time
                    type: string
                  p99QueueTime:
                    description: P99QueueTime is the 99th percentile queue time
                    type: string
                  uptime:
                    description: Uptime is the current uptime percentage
                    type: number
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: fabriccostpredictors.gryvia.io
spec:
  group: gryvia.io
  names:
    kind: FabricCostPredictor
    listKind: FabricCostPredictorList
    plural: fabriccostpredictors
    singular: fabriccostpredictor
  scope: Cluster
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: FabricCostPredictor is the Schema for the fabriccostpredictors
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FabricCostPredictorSpec defines the desired state of FabricCostPredictor
            properties:
              alternatives:
                description: Alternatives configures alternative configuration recommendations
                properties:
                  enabled:
                    description: Enabled enables alternative configuration suggestions
                    type: boolean
                  gpuTypesToConsider:
                    description: GPUTypesToConsider lists GPU types to evaluate in
                      alternatives
                    items:
                      type: string
                    type: array
                  includeSpotEstimates:
                    description: IncludeSpotEstimates includes spot/preemptible instance
                      estimates
                    type: boolean
                  strategies:
                    description: Strategies defines the optimization strategies to
                      evaluate
                    items:
                      description: AlternativeStrategy defines an optimization strategy
                      properties:
                        constraint:
                          description: Constraint is the optimization constraint (minimize-cost,
                            minimize-time, minimize-queue, balance)
                          type: string
                        name:
                          description: Name is the strategy name
                          type: string
                      required:
                      - constraint
                      - name
                      type: object
                    type: array
                type: object
              historicalData:
                description: HistoricalData configures how historical job data is
                  collected and used
                properties:
                  lookbackDays:
                    description: LookbackDays is the number of days of historical
                      data to analyze
                    type: integer
                  minimumSamples:
                    description: MinimumSamples is the minimum number of similar jobs
                      needed for a prediction
                    type: integer
                  similarityFactors:
                    description: SimilarityFactors are the factors used to find similar
                      historical jobs
                    items:
                      type: string
                    type: array
                type: object
              integration:
                description: Integration configures how the predictor integrates with
                  the cluster
                properties:
                  dryRunMode:
                    description: DryRunMode only estimates without acting on predictions
                    type: boolean
                  injectEstimateAnnotation:
                    description: InjectEstimateAnnotation injects cost/time estimates
                      as annotations
                    type: boolean
                  webhookAdmission:
                    description: WebhookAdmission enables validating webhook to annotate
                      jobs
                    type: boolean
                type: object
              models:
                description: Models configures the prediction models
                properties:
                  costEstimation:
                    description: CostEstimation configures cost estimation
                    properties:
                      currency:
                        description: 'Currency for cost estimates (default: USD)'
                        type: string
                      includeNetworkCost:
                        description: IncludeNetworkCost includes network egress costs
                          in estimate
                        type: boolean
                      includeStorageCost:
                        description: IncludeStorageCost includes storage costs in
                          estimate
                        type: boolean
                    type: object
                  queueTime:
                    description: QueueTime configures queue wait time estimation
                    properties:
                      includePreemptionRisk:
                        description: IncludePreemptionRisk factors in preemption risk
                          when estimating queue time
                        type: boolean
                      method:
                        description: Method is the estimation method (exponential-smoothing,
                          moving-average, percentile)
                        type: string
                    type: object
                  trainingTime:
                    description: TrainingTime configures training time estimation
                    properties:
                      features:
                        description: Features used for training time estimation
                        items:
                          type: string
                        type: array
                      method:
                        description: Method is the estimation method (linear-regression,
                          weighted-average, percentile)
                        type: string
                    type: object
                type: object
              pricing:
                description: Pricing configures GPU pricing data
                properties:
                  chargebackRef:
                    description: ChargebackRef references a FabricChargeback CR for
                      pricing data
                    type: string
                  perGpuHour:
                    additionalProperties:
                      type: number
                    description: PerGpuHour is an inline per-GPU-hour pricing map
                    type: object
                type: object
            type: object
          status:
            description: FabricCostPredictorStatus defines the observed state of FabricCostPredictor
            properties:
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              jobsEstimated:
                description: JobsEstimated is the total number of jobs estimated
                type: integer
              lastUpdated:
                description: LastUpdated is the timestamp of last status update
                format: date-time
                type: string
              predictionAccuracy:
                description: PredictionAccuracy tracks the accuracy of predictions
                properties:
                  costEstimate:
                    description: CostEstimate accuracy metrics
                    properties:
                      mae:
                        description: MAE is the mean absolute error
                        type: number
                      within25Percent:
                        description: Within25Percent is the percentage of estimates
                          within 25% of actual
                        type: number
                    type: object
                  timeEstimate:
                    description: TimeEstimate accuracy metrics
                    properties:
                      mae:
                        description: MAE is the mean absolute error
                        type: number
                      within25Percent:
                        description: Within25Percent is the percentage of estimates
                          within 25% of actual
                        type: number
                    type: object
                type: object
              totalSavingsFromRecommendations:
                description: TotalSavingsFromRecommendations is the total savings
                  from alternative recommendations (USD)
                type: number
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

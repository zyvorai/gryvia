# Observability stack configuration

prometheus:
  enabled: true

grafana:
  enabled: true
  # adminPassword must be set explicitly via --set or an existing secret
  # adminPassword: ""
  # existingSecret: my-grafana-secret
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'tensorreaper'
          orgId: 1
          folder: 'TensorReaper'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/tensorreaper

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 30d
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 100Gi
      additionalScrapeConfigs:
        # DCGM Exporter scraping
        - job_name: 'dcgm-exporter'
          kubernetes_sd_configs:
            - role: endpoints
              namespaces:
                names:
                  - tensorreaper-system
          relabel_configs:
            - source_labels: [__meta_kubernetes_service_name]
              action: keep
              regex: dcgm-exporter

  grafana:
    enabled: true
    # adminPassword must be set via --set grafana.adminPassword=<value>
    # existingSecret: my-grafana-secret
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: 'tensorreaper'
            orgId: 1
            folder: 'TensorReaper'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/tensorreaper
    dashboards:
      tensorreaper:
        gpu-overview:
          gnetId: 12239
          revision: 1
          datasource: Prometheus

  alertmanager:
    enabled: true
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ['alertname', 'cluster']
        group_wait: 10s
        group_interval: 10s
        repeat_interval: 12h
        receiver: 'default'
      receivers:
        - name: 'default'
          # Configure at least one receiver (email, Slack, PagerDuty, etc.)
          # Example:
          # slack_configs:
          #   - api_url: '<webhook-url>'
          #     channel: '#tensorreaper-alerts'
          webhook_configs:
            - url: 'http://alertmanager-webhook.tensorreaper-system.svc:9093/api/v1/alerts'
              send_resolved: true

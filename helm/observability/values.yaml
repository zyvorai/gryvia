# Observability stack configuration

prometheus:
  enabled: true

grafana:
  enabled: true
  adminPassword: "kubefabric-admin"
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'kubefabric'
          orgId: 1
          folder: 'KubeFabric'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/kubefabric

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 30d
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 100Gi
      additionalScrapeConfigs:
        # DCGM Exporter scraping
        - job_name: 'dcgm-exporter'
          kubernetes_sd_configs:
            - role: endpoints
              namespaces:
                names:
                  - kubefabric-system
          relabel_configs:
            - source_labels: [__meta_kubernetes_service_name]
              action: keep
              regex: dcgm-exporter

  grafana:
    enabled: true
    adminPassword: kubefabric-admin
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: 'kubefabric'
            orgId: 1
            folder: 'KubeFabric'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/kubefabric
    dashboards:
      kubefabric:
        gpu-overview:
          gnetId: 12239
          revision: 1
          datasource: Prometheus

  alertmanager:
    enabled: true
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ['alertname', 'cluster']
        group_wait: 10s
        group_interval: 10s
        repeat_interval: 12h
        receiver: 'default'
      receivers:
        - name: 'default'

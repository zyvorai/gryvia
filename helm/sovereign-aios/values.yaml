# Sovereign AI OS: Gryvia, Zyntra and Netra in one release, wired to each other.
#
# Install into Gryvia's namespace (gryvia.namespace.name, gryvia-system by default): Zyntra and Netra mount Gryvia's
# certificate and the shared credentials Secret, and Secrets cannot be mounted across namespaces.
#
#   make sovereign-aios-deps
#   helm install sovereign-aios helm/sovereign-aios -n gryvia-system --create-namespace

# One Secret holds the Gryvia API key (GRYVIA_API_KEY, also given to Zyntra as ZYNTRA_GRAVIA_TOKEN), the platform's
# LLM gateway key (ZYNTRA_AI_API_KEY) and Netra's API and agent keys. All are generated once and kept across
# upgrades. Its name must match gryvia.auth.existingSecret below.
credentials:
  secretName: sovereign-aios-credentials
  # Leave empty to generate. The Gryvia and Netra keys open the admin APIs; the LLM key is metered like any tenant key.
  gryviaApiKey: ""
  llmKey: ""
  netraApiKey: ""
  netraAgentKey: ""

# A Zyntra service token for the zyntra tools of GryviaAgents (docs/agents.md). Zyntra gives service tokens the viewer
# and proposer roles only, so agents can draft proposals but people approve them. The token is generated once and
# kept in the credentials Secret (AGENT_ZYNTRA_TOKEN); its SHA-256 goes into Zyntra's policy, which this chart renders
# into the Secret zyntra.policyExistingSecret, merged with zyntra.policy. Each namespace listed gets a copy of the
# token in Secret secretName (key token) for its agents' tokenSecretRef.
agentToken:
  enabled: true
  name: gryvia-agents             # shown in Zyntra's audit as service:<name>
  roles: [viewer, proposer]       # viewer alone for read-only agents
  tenant: ""                      # bind to one Zyntra tenant; empty sees every object
  token: ""                       # leave empty to generate (zst_ and 64 hex digits)
  secretName: zyntra-agent-token
  namespaces: []                  # e.g. [tenant-alpha]

gryvia:
  # Fixed service names (gryvia-llm-gateway) so the URLs below do not depend on the release name.
  fullnameOverride: gryvia
  auth:
    apiKey: ""
    existingSecret: sovereign-aios-credentials
  # Netra serves Gryvia's certificate too, so Zyntra trusts both through one root. Change the namespace here if
  # Gryvia's is not gryvia-system.
  tls:
    extraSANs: [netra, netra.gryvia-system.svc]
  llmGateway:
    enabled: true
  aiOperator:
    agents:
      enabled: true

zyntra:
  enabled: true
  # The pack in files/zyntra-pack, mounted from a ConfigMap.
  modelPath: /etc/zyntra-pack
  # Approved changes are Gryvia custom resources run through kubectl, which the Zyntra image does not carry.
  execute: dry-run
  # Approval policy (quorum, users, ...) as inline YAML. This chart merges it with the agents' service token and
  # writes the result to policyExistingSecret, which Zyntra reads instead. Zyntra does not restart when only the
  # token's roles or tenant change: kubectl rollout restart deployment/<release>-zyntra.
  policy: ""
  policyExistingSecret: sovereign-aios-zyntra-policy
  ai:
    # Gryvia's LLM gateway: OpenAI-compatible, metered, local models only.
    baseURL: http://gryvia-llm-gateway:8080/v1
    # A model published on the gateway (gryvia.io/llm-model on a GryviaInferenceService).
    model: ""
    apiKeySecret: sovereign-aios-credentials
    apiKeySecretKey: ZYNTRA_AI_API_KEY
  env:
    ZYNTRA_GRAVIA_URL: https://gryvia-api-gateway:8080
    ZYNTRA_NETRA_URL: https://netra:30870
    # Gryvia's gateway certificate is the only trusted root: Zyntra reaches nothing else over TLS. Replace with a
    # bundle that also holds your CAs if packs read other HTTPS sources.
    SSL_CERT_FILE: /etc/gryvia-tls/tls.crt
  envFrom:
    - secretRef:
        name: sovereign-aios-credentials
  extraVolumes:
    - name: pack
      configMap:
        name: sovereign-aios-zyntra-pack
    - name: gryvia-tls
      secret:
        secretName: gryvia-tls
        items:
          - {key: tls.crt, path: tls.crt}
  extraVolumeMounts:
    - {name: pack, mountPath: /etc/zyntra-pack, readOnly: true}
    - {name: gryvia-tls, mountPath: /etc/gryvia-tls, readOnly: true}

netra:
  enabled: true
  auth:
    existingSecret: sovereign-aios-netra-auth
  tls:
    existingSecret: gryvia-tls
  ai:
    enabled: true
    baseURL: http://gryvia-llm-gateway:8080/v1
    model: ""
    existingSecret: sovereign-aios-netra-ai

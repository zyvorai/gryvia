{{- $ns := include "sovereign-aios.namespace" . }}
{{- if ne .Release.Namespace $ns }}
{{- fail (printf "install sovereign-aios into Gryvia's namespace %q (helm install -n %s), not %q" $ns $ns .Release.Namespace) }}
{{- end }}
{{- if ne .Values.credentials.secretName (dig "auth" "existingSecret" "" .Values.gryvia) }}
{{- fail "gryvia.auth.existingSecret must equal credentials.secretName" }}
{{- end }}
{{- /* Rendered once here so every Secret below gets the same generated keys. */ -}}
{{- $creds := include "sovereign-aios.credentials" . | fromJson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentials.secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "sovereign-aios.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  GRYVIA_API_KEY: {{ $creds.gryviaApiKey | quote }}
  ZYNTRA_GRAVIA_TOKEN: {{ $creds.gryviaApiKey | quote }}
  ZYNTRA_AI_API_KEY: {{ $creds.llmKey | quote }}
  ZYNTRA_NETRA_TOKEN: {{ $creds.netraApiKey | quote }}
  NETRA_AGENT_KEY: {{ $creds.netraAgentKey | quote }}
  AGENT_ZYNTRA_TOKEN: {{ $creds.agentToken | quote }}
{{- $tok := .Values.agentToken }}
{{- if .Values.zyntra.enabled }}
{{- if not .Values.zyntra.policyExistingSecret }}
{{- fail "zyntra.policyExistingSecret must name the Secret this chart writes Zyntra's policy to" }}
{{- end }}
{{- $pol := dict }}
{{- with .Values.zyntra.policy }}{{ $pol = fromYaml . }}{{ end }}
{{- if hasKey $pol "Error" }}{{ fail (printf "zyntra.policy is not valid YAML: %s" $pol.Error) }}{{ end }}
{{- if $tok.enabled }}
{{- if not (hasPrefix "zst_" $creds.agentToken) }}{{ fail "agentToken.token must start with zst_" }}{{ end }}
{{- $entry := dict "name" $tok.name "token_sha256" ($creds.agentToken | sha256sum) "roles" $tok.roles }}
{{- if $tok.tenant }}{{ $_ := set $entry "tenant" $tok.tenant }}{{ end }}
{{- $_ := set $pol "service_tokens" (concat (get $pol "service_tokens" | default list) (list $entry)) }}
{{- end }}
---
# Zyntra's policy: zyntra.policy plus the agents' service token (only its hash).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.zyntra.policyExistingSecret }}
  namespace: {{ $ns }}
  labels:
    {{- include "sovereign-aios.labels" . | nindent 4 }}
type: Opaque
stringData:
  policy.yaml: |
    {{- if $pol }}
    {{- toYaml $pol | nindent 4 }}
    {{- else }}
    {}
    {{- end }}
{{- if $tok.enabled }}
{{- range $tok.namespaces }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tok.secretName }}
  namespace: {{ . }}
  labels:
    {{- include "sovereign-aios.labels" $ | nindent 4 }}
type: Opaque
stringData:
  token: {{ $creds.agentToken | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.netra.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.netra.auth.existingSecret }}
  namespace: {{ $ns }}
  labels:
    {{- include "sovereign-aios.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ $creds.netraApiKey | quote }}
  agent-key: {{ $creds.netraAgentKey | quote }}
{{- if and .Values.netra.ai.enabled .Values.netra.ai.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.netra.ai.existingSecret }}
  namespace: {{ $ns }}
  labels:
    {{- include "sovereign-aios.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ $creds.llmKey | quote }}
{{- end }}
{{- end }}
{{- if .Values.gryvia.llmGateway.enabled }}
{{- $keyNs := dig "llmGateway" "keyNamespace" "gryvia-llm-keys" .Values.gryvia }}
---
# The LLM gateway accepts a key when a Secret in its key namespace holds the key's SHA-256 (same format as the keys
# the ai-operator mints for agents and vector indexes). Tokens are metered under this namespace.
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s.platform-sovereign-aios" $ns }}
  namespace: {{ $keyNs }}
  labels:
    {{- include "sovereign-aios.labels" . | nindent 4 }}
    gryvia.io/llm-key: "true"
    gryvia.io/tenant: {{ trimPrefix "tenant-" $ns | trunc 63 | quote }}
    gryvia.io/llm-key-name: platform-sovereign-aios
    gryvia.io/llm-key-namespace: {{ $ns }}
    gryvia.io/llm-key-owner: platform
type: Opaque
stringData:
  hash: {{ $creds.llmKey | sha256sum | quote }}
  namespace: {{ $ns | quote }}
{{- end }}

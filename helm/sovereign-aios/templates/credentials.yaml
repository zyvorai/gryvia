{{- $ns := include "sovereign-aios.namespace" . }}
{{- if ne .Release.Namespace $ns }}
{{- fail (printf "install sovereign-aios into Gryvia's namespace %q (helm install -n %s), not %q" $ns $ns .Release.Namespace) }}
{{- end }}
{{- if ne .Values.credentials.secretName (dig "auth" "existingSecret" "" .Values.gryvia) }}
{{- fail "gryvia.auth.existingSecret must equal credentials.secretName" }}
{{- end }}
{{- $bao := .Values.hardening.openbao.enabled }}
{{- /* Rendered once here so every Secret below gets the same generated keys. With OpenBao they are External Secrets
templates over the KV entry's fields, and the hashes are computed by External Secrets. */ -}}
{{- $creds := dict }}
{{- $hash := dict }}
{{- if $bao }}
{{- range $k, $f := dict "gryviaApiKey" "gryviaApiKey" "llmKey" "llmKey" "netraApiKey" "netraApiKey" "netraAgentKey" "netraAgentKey" "agentToken" "agentZyntraToken" }}
{{- $_ := set $creds $k (include "sovereign-aios.eso" (dict "field" $f)) }}
{{- $_ := set $hash $k (include "sovereign-aios.eso" (dict "field" $f "hash" true)) }}
{{- end }}
{{- else }}
{{- $creds = include "sovereign-aios.credentials" . | fromJson }}
{{- range $k, $v := $creds }}{{ $_ := set $hash $k ($v | sha256sum) }}{{ end }}
{{- if and .Values.agentToken.enabled (not (hasPrefix "zst_" $creds.agentToken)) }}{{ fail "agentToken.token must start with zst_" }}{{ end }}
{{- end }}
{{- include "sovereign-aios.secret" (dict "root" . "name" .Values.credentials.secretName "namespace" $ns
      "annotations" (dict "helm.sh/resource-policy" "keep")
      "data" (dict "GRYVIA_API_KEY" $creds.gryviaApiKey "ZYNTRA_GRAVIA_TOKEN" $creds.gryviaApiKey
                   "ZYNTRA_AI_API_KEY" $creds.llmKey "ZYNTRA_NETRA_TOKEN" $creds.netraApiKey
                   "NETRA_AGENT_KEY" $creds.netraAgentKey "AGENT_ZYNTRA_TOKEN" $creds.agentToken)) }}
{{- $tok := .Values.agentToken }}
{{- if .Values.zyntra.enabled }}
{{- if not .Values.zyntra.policyExistingSecret }}
{{- fail "zyntra.policyExistingSecret must name the Secret this chart writes Zyntra's policy to" }}
{{- end }}
{{- $pol := dict }}
{{- with .Values.zyntra.policy }}{{ $pol = fromYaml . }}{{ end }}
{{- if hasKey $pol "Error" }}{{ fail (printf "zyntra.policy is not valid YAML: %s" $pol.Error) }}{{ end }}
{{- if $tok.enabled }}
{{- $entry := dict "name" $tok.name "token_sha256" $hash.agentToken "roles" $tok.roles }}
{{- if $tok.tenant }}{{ $_ := set $entry "tenant" $tok.tenant }}{{ end }}
{{- $_ := set $pol "service_tokens" (concat (get $pol "service_tokens" | default list) (list $entry)) }}
{{- end }}
---
# Zyntra's policy: zyntra.policy plus the agents' service token (only its hash).
{{ include "sovereign-aios.secret" (dict "root" . "name" .Values.zyntra.policyExistingSecret "namespace" $ns
      "data" (dict "policy.yaml" (ternary (toYaml $pol) "{}" (gt (len $pol) 0)))) }}
{{- if $tok.enabled }}
{{- range $tok.namespaces }}
---
{{ include "sovereign-aios.secret" (dict "root" $ "name" $tok.secretName "namespace" . "data" (dict "token" $creds.agentToken)) }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.netra.enabled }}
---
{{ include "sovereign-aios.secret" (dict "root" . "name" .Values.netra.auth.existingSecret "namespace" $ns
      "data" (dict "api-key" $creds.netraApiKey "agent-key" $creds.netraAgentKey)) }}
{{- if and .Values.netra.ai.enabled .Values.netra.ai.existingSecret }}
---
{{ include "sovereign-aios.secret" (dict "root" . "name" .Values.netra.ai.existingSecret "namespace" $ns "data" (dict "api-key" $creds.llmKey)) }}
{{- end }}
{{- end }}
{{- if .Values.gryvia.llmGateway.enabled }}
{{- $keyNs := dig "llmGateway" "keyNamespace" "gryvia-llm-keys" .Values.gryvia }}
---
# The LLM gateway accepts a key when a Secret in its key namespace holds the key's SHA-256 (same format as the keys
# the ai-operator mints for agents and vector indexes). Tokens are metered under this namespace.
{{ include "sovereign-aios.secret" (dict "root" . "name" (printf "%s.platform-sovereign-aios" $ns) "namespace" $keyNs
      "labels" (dict "gryvia.io/llm-key" "true" "gryvia.io/tenant" (trimPrefix "tenant-" $ns | trunc 63)
                     "gryvia.io/llm-key-name" "platform-sovereign-aios" "gryvia.io/llm-key-namespace" $ns
                     "gryvia.io/llm-key-owner" "platform")
      "data" (dict "hash" $hash.llmKey "namespace" $ns)) }}
{{- end }}

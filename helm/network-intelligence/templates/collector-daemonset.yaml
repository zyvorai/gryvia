{{- if .Values.ebpf.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "network-intelligence.fullname" . }}-collector
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "network-intelligence.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  selector:
    matchLabels:
      {{- include "network-intelligence.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        {{- include "network-intelligence.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: collector
    spec:
      serviceAccountName: {{ include "network-intelligence.collectorServiceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: {{ .Values.collector.hostNetwork }}
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: collector
          image: "{{ .Values.collector.image.repository }}:{{ .Values.collector.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          # The image entrypoint is /usr/local/bin/gryvia-collector; the programs live in /opt/gryvia/ebpf.
          args:
            - -metrics-addr=:9090
            - -ebpf-dir=/opt/gryvia/ebpf
            {{- if .Values.ebpf.flightTokenSecret }}
            - -flight-token-file=/var/run/gryvia-flight/token
            {{- end }}
            {{- with .Values.ebpf.interface }}
            - -iface={{ . }}
            {{- end }}
            {{- with .Values.ebpf.cgroupPath }}
            - -cgroup-path={{ . }}
            {{- end }}
            {{- if .Values.ebpf.quotaPace.enabled }}
            {{- if not .Values.ebpf.cgroupPath }}
            {{- fail "ebpf.quotaPace.enabled needs ebpf.cgroupPath (for example /host/sys/fs/cgroup)" }}
            {{- end }}
            - -quota-pace
            {{- end }}
            {{- if .Values.ebpf.quotaPace.sync }}
            {{- if not .Values.ebpf.quotaPace.enabled }}
            {{- fail "ebpf.quotaPace.sync needs ebpf.quotaPace.enabled" }}
            {{- end }}
            - -quota-pace-sync
            {{- end }}
            {{- if .Values.ebpf.quotaPace.dryRun }}
            {{- if not .Values.ebpf.quotaPace.sync }}
            {{- fail "ebpf.quotaPace.dryRun needs ebpf.quotaPace.sync" }}
            {{- end }}
            - -quota-pace-dry-run
            {{- end }}
            {{- if .Values.ebpf.publishFabricStatus }}
            - -publish-fabric-status
            {{- end }}
            {{- if .Values.ebpf.traceCorrelation }}
            {{- if not (and .Values.ebpf.interface .Values.ebpf.flightTokenSecret) }}
            {{- fail "ebpf.traceCorrelation needs ebpf.interface and ebpf.flightTokenSecret" }}
            {{- end }}
            - -trace-correlate
            {{- end }}
            {{- range .Values.ebpf.inferMetrics.targets }}
            - {{ printf "-infer-metrics=%s" . | quote }}
            {{- end }}
            {{- if .Values.ebpf.inferMetrics.discover }}
            - -infer-metrics-discover
            - -infer-metrics-ports={{ .Values.ebpf.inferMetrics.ports }}
            {{- end }}
            {{- if or .Values.ebpf.inferMetrics.targets .Values.ebpf.inferMetrics.discover }}
            - -infer-metrics-interval={{ .Values.ebpf.inferMetrics.interval }}
            {{- end }}
            {{- with .Values.ebpf.ncclLib }}
            - -nccl-lib={{ . }}
            {{- end }}
            {{- with .Values.ebpf.cudaLib }}
            - -cuda-lib={{ . }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: sys-fs-bpf
              mountPath: /sys/fs/bpf
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: run
              mountPath: /run
            - name: cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            {{- if .Values.ebpf.flightTokenSecret }}
            - name: flight-token
              mountPath: /var/run/gryvia-flight
              readOnly: true
            {{- end }}
      volumes:
        - name: sys-fs-bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: run
          hostPath:
            path: /run
            type: Directory
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        {{- if .Values.ebpf.flightTokenSecret }}
        - name: flight-token
          secret:
            secretName: {{ .Values.ebpf.flightTokenSecret | quote }}
            items:
              - key: {{ .Values.ebpf.flightTokenKey | quote }}
                path: token
        {{- end }}
      {{- with .Values.collector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

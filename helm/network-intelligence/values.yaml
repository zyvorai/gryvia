# Default values for gryvia-network-intelligence

# Operator configuration
operator:
  image:
    repository: ghcr.io/zyvorai/gryvia-network-intelligence-operator
    # Defaults to the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []

# eBPF Collector configuration
collector:
  image:
    repository: ghcr.io/zyvorai/gryvia-ebpf-collector
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  hostNetwork: true
  nodeSelector: {}
  tolerations:
    - operator: Exists

# eBPF collector (per-node DaemonSet, image gryvia-ebpf-collector). Off by default. The programs are CO-RE and
# need a node kernel with BTF (/sys/kernel/btf/vmlinux); tcx programs need Linux 6.6+. Verified on Linux 7.0 x86_64
# only (arm64 compiles but is unloaded); NCCL/CUDA/RDMA programs have not run on GPU or RDMA hardware.
# Alternatively read flows from Netra (see apiGateway.netra in the gryvia chart).
ebpf:
  enabled: false
  # A Secret in the network-intelligence namespace containing a random >=32 character token.
  # Leave empty to disable the diagnostic HTTP endpoint.
  flightTokenSecret: ""
  flightTokenKey: token
  # Attach the XDP/TCX programs (packet filter, DNS tracker, cost tracker, trace correlator) to this interface.
  # Empty leaves them unattached.
  interface: ""
  # cgroup v2 path for the sockops/sk_msg programs (for example /host/sys/fs/cgroup). Empty leaves them unattached.
  cgroupPath: ""
  # Publish the folded fabric signals of attributed jobs into the status of an EXISTING GryviaFabricSignal
  # (spec.jobRef = job name) every 30 s (flag -publish-fabric-status). Off by default. When on, the collector
  # ClusterRole additionally gets list on gryviafabricsignals and patch on gryviafabricsignals/status; it creates
  # nothing. Jobs are attributed through the Flight Recorder's pod resolver (needs NODE_NAME, set by this chart).
  publishFabricStatus: false
  # Serving-engine latency (time to first token, inter-token latency, engine queue time). Kernel probes cannot see
  # tokens, so the collector reads the engines' OWN Prometheus endpoints (vLLM, NVIDIA Triton, HuggingFace TGI) with
  # read-only HTTP GETs. Off by default: with no targets and discover=false nothing is scraped and no flag is passed.
  # Figures appear on the collector's /metrics (gryvia_inference_*) and, with publishFabricStatus, in the status of
  # the job's GryviaFabricSignal. See docs/inference-latency.md.
  inferMetrics:
    # Static targets, one string each: "name=vllm,url=http://10.0.0.5:8000/metrics" with optional
    # ",engine=vllm|triton|tgi" (default: detected) and ",namespace=NS,job=JOB" (attributes the figures to a job).
    # The collector has hostNetwork by default, so 127.0.0.1 is the node; use pod IPs or Service DNS names.
    targets: []
    # Also scrape http://<podIP>:<port>/metrics of pods ON THIS NODE that carry a gryvia.io/job label and declare one of
    # `ports` as a containerPort. Uses the pod-list permission the collector already has; needs NODE_NAME (set here).
    discover: false
    ports: "8000,8002,8080"
    interval: 15s
  # Correlate W3C traceparent headers (plaintext HTTP/1.x, IPv4, requests to gryvia.io/job pods) with the Flight
  # Recorder timeline and serve GET /api/v1/flight/trace (HMAC-protected). Needs ebpf.interface and
  # ebpf.flightTokenSecret. TLS-terminated traffic is invisible to it. Off by default.
  traceCorrelation: false
  # quota_pace is the only eBPF program that changes anything: it lowers SO_MAX_PACING_RATE of new outbound TCP
  # connections of cgroups that hold a lease. Everything here is off by default and needs cgroupPath.
  quotaPace:
    # Attach quota_pace (-quota-pace). Alone it paces nothing: the pace map stays empty.
    enabled: false
    # MUTATING. Also run the GryviaQuota reconcile (-quota-pace-sync): every 30 s, pods on the node in the
    # namespaces of a GryviaQuota with spec.network.maxEgressMbps get a 2-minute pace lease (renewed while the
    # quota holds; API errors change nothing and leases expire = fail open). Never touches kube-system,
    # gryvia-system, kube-public, kube-node-lease or this release's namespace. Adds list on gryviaquotas to
    # the collector ClusterRole.
    sync: false
    # Log what sync would grant or revoke and write nothing (-quota-pace-dry-run). Try this first.
    dryRun: false
  # Paths of libnccl.so / libcudart.so for the GPU uprobes. Empty tries to discover them from running processes.
  ncclLib: ""
  cudaLib: ""

# Prometheus monitoring
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
    namespace: ""
    additionalLabels: {}

# Reserved and currently NOT read by any template or by the operator (no auto-blocking exists). The operator
# binary has no --security-* flags; passing them made it exit at start-up, so the chart no longer passes them.
security:
  enabled: true
  autoBlock: false

# Namespace configuration
namespace:
  create: true
  name: gryvia-network

# RBAC configuration
rbac:
  create: true

# Service Account configuration
serviceAccount:
  create: true
  operator:
    name: network-intelligence-operator
    annotations: {}
  collector:
    name: ebpf-collector
    annotations: {}

# High availability
ha:
  enabled: false
  leaderElection: true

# Container-level security context for the operator
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

# Pod-level security context for the operator
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Name overrides
nameOverride: ""
fullnameOverride: ""

# Image pull secrets
imagePullSecrets: []

# Global labels
labels: {}

# Global annotations
annotations: {}

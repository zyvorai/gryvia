{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gryvia-ui
  namespace: {{ include "gryvia.namespace" . }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
    app: gryvia-ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app: gryvia-ui
  template:
    metadata:
      labels:
        app: gryvia-ui
    spec:
      serviceAccountName: gryvia-ui
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      - name: gen-cert
        image: alpine/openssl:3.3.2
        command: ["/bin/sh", "-c"]
        args:
        - |
          # Copy the shared certificate from the {{ .Values.tls.secretName }} Secret and hand it to the
          # nginx user; mint a throwaway one if the Secret is empty.
          if [ -s /tls-src/tls.crt ] && [ -s /tls-src/tls.key ]; then
            cp /tls-src/tls.crt /tls-src/tls.key /tls/
          else
            openssl req -x509 -nodes -days 3650 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -keyout /tls/tls.key -out /tls/tls.crt -subj "/CN=gryvia-ui/O=Gryvia" -addext "subjectAltName=DNS:gryvia-ui,DNS:localhost,IP:127.0.0.1"
          fi
          chown 101:101 /tls/tls.key /tls/tls.crt
          chmod 600 /tls/tls.key
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
        volumeMounts:
        - name: tls
          mountPath: /tls
        - name: tls-src
          mountPath: /tls-src
          readOnly: true
      containers:
      - name: ui
        image: {{ include "gryvia.image" (dict "root" . "image" .Values.ui.image) | quote }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 8443
          name: https
        resources:
          {{- toYaml .Values.ui.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: https
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: https
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: nginx-tmp
          mountPath: /tmp
        - name: tls
          mountPath: /tls
          readOnly: true
      volumes:
      - name: tls
        emptyDir: {}
      - name: tls-src
        secret:
          secretName: {{ .Values.tls.secretName }}
          optional: true
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: nginx-tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gryvia-ui
  namespace: {{ include "gryvia.namespace" . }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
    app: gryvia-ui
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    app: gryvia-ui
  ports:
  - port: 443
    targetPort: https
    protocol: TCP
    name: https
    {{- if and (eq .Values.ui.service.type "NodePort") .Values.ui.service.nodePort }}
    nodePort: {{ .Values.ui.service.nodePort }}
    {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gryvia-ui
  namespace: {{ include "gryvia.namespace" . }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
{{- if .Values.ui.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gryvia-ui
  namespace: {{ include "gryvia.namespace" . }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
  {{- with .Values.ui.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ui.ingress.className }}
  ingressClassName: {{ .Values.ui.ingress.className }}
  {{- end }}
  {{- if .Values.ui.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.ui.ingress.host | quote }}]
      secretName: {{ .Values.ui.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ui.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gryvia-ui
                port:
                  name: https
{{- end }}
{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.ui.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gryvia-ui
  namespace: {{ include "gryvia.namespace" . }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: gryvia-ui
{{- end }}
{{- end }}

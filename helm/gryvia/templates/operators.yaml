{{- /* One Deployment per enabled operator; they differ only in name, image and resources. */ -}}
{{- $ops := dict "gpu-operator" .Values.gpuOperator "ai-operator" .Values.aiOperator "quota-operator" .Values.quotaOperator "storage-operator" .Values.storageOperator "network-operator" .Values.networkOperator -}}
{{- range $name, $op := $ops }}
{{- if $op.enabled }}
{{- /* Only the ai-operator serves the GryviaAIJob admission webhook. */ -}}
{{- $webhook := and (eq $name "ai-operator") $.Values.webhook.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gryvia.fullname" $ }}-{{ $name }}
  namespace: {{ include "gryvia.namespace" $ }}
  labels:
    {{- include "gryvia.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $op.replicas }}
  selector:
    matchLabels:
      {{- include "gryvia.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "gryvia.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      serviceAccountName: {{ include "gryvia.serviceAccountName" $ }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: {{ include "gryvia.image" (dict "root" $ "image" $op.image) | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          command:
            - /manager
          args:
            - --leader-elect={{ $.Values.ha.leaderElection }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            {{- if $webhook }}
            - --enable-webhooks=true
            - --webhook-cert-dir=/tmp/k8s-webhook-server/serving-certs
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            {{- if $webhook }}
            - name: webhook
              containerPort: 9443
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $op.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          {{- if $webhook }}
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          {{- end }}
      {{- if $webhook }}
      volumes:
        - name: webhook-certs
          secret:
            secretName: {{ include "gryvia.webhookSecretName" $ }}
            defaultMode: 0440
      {{- end }}
      {{- with $op.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $op.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if and $.Values.podDisruptionBudget.enabled (gt (int $op.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gryvia.fullname" $ }}-{{ $name }}
  namespace: {{ include "gryvia.namespace" $ }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "gryvia.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.apiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gryvia-api-gateway
  namespace: {{ include "gryvia.namespace" . }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
    app: gryvia-api-gateway
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      app: gryvia-api-gateway
  template:
    metadata:
      labels:
        app: gryvia-api-gateway
      annotations:
        checksum/api-key: {{ printf "%s%s" .Values.auth.apiKey .Values.auth.existingSecret | sha256sum }}
    spec:
      serviceAccountName: gryvia-api-gateway
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api-gateway
        image: {{ include "gryvia.image" (dict "root" . "image" .Values.apiGateway.image) | quote }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 8080
          name: https
        env:
        - name: GRYVIA_FLIGHT_COLLECTOR_NAMESPACE
          value: {{ .Values.apiGateway.flightCollectorNamespace | quote }}
        {{- if .Values.apiGateway.flightTokenSecret }}
        - name: GRYVIA_FLIGHT_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.apiGateway.flightTokenSecret | quote }}
              key: {{ .Values.apiGateway.flightTokenKey | quote }}
        {{- end }}
        {{- if (dig "apiGateway" "metrics" "enabled" nil .Values.AsMap) }}
        {{- if not (dig "apiGateway" "metrics" "tokenSecret" nil .Values.AsMap) }}
        {{- fail "apiGateway.metrics.enabled requires apiGateway.metrics.tokenSecret (an existing Secret with a token of at least 32 characters): /metrics is never served unauthenticated" }}
        {{- end }}
        - name: GRYVIA_METRICS_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ (dig "apiGateway" "metrics" "tokenSecret" nil .Values.AsMap) | quote }}
              key: {{ (dig "apiGateway" "metrics" "tokenKey" nil .Values.AsMap) | quote }}
        {{- end }}
        {{- with .Values.apiGateway.collector }}
        {{- if .tlsSecret }}
        - name: GRYVIA_COLLECTOR_CA_FILE
          value: /collector-tls/ca.crt
        {{- if .clientCert }}
        - name: GRYVIA_COLLECTOR_CERT_FILE
          value: /collector-tls/tls.crt
        - name: GRYVIA_COLLECTOR_KEY_FILE
          value: /collector-tls/tls.key
        {{- end }}
        - name: GRYVIA_COLLECTOR_SERVER_NAME
          value: {{ .serverName | quote }}
        {{- end }}
        {{- if .tokenSecret }}
        - name: GRYVIA_COLLECTOR_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .tokenSecret | quote }}
              key: {{ .tokenKey | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.apiGateway.prometheusUrl }}
        - name: PROMETHEUS_URL
          value: {{ .Values.apiGateway.prometheusUrl | quote }}
        {{- end }}
        {{- if (dig "apiGateway" "netra" "url" nil .Values.AsMap) }}
        - name: GRYVIA_NETRA_URL
          value: {{ (dig "apiGateway" "netra" "url" nil .Values.AsMap) | quote }}
        {{- if (dig "apiGateway" "netra" "tokenSecret" nil .Values.AsMap) }}
        - name: GRYVIA_NETRA_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ (dig "apiGateway" "netra" "tokenSecret" nil .Values.AsMap) | quote }}
              key: {{ (dig "apiGateway" "netra" "tokenKey" nil .Values.AsMap) | quote }}
        {{- end }}
        {{- if (dig "apiGateway" "netra" "insecureTLS" nil .Values.AsMap) }}
        - name: GRYVIA_NETRA_INSECURE
          value: "1"
        {{- end }}
        {{- end }}
        {{- if (dig "llmGateway" "enabled" nil .Values.AsMap) }}
        - name: GRYVIA_LLM_KEY_NAMESPACE
          value: {{ (dig "llmGateway" "keyNamespace" "gryvia-llm-keys" .Values.AsMap) | quote }}
        - name: GRYVIA_LLM_GATEWAY_URL
          value: {{ printf "http://%s-llm-gateway.%s.svc.cluster.local:%v" (include "gryvia.fullname" .) (include "gryvia.namespace" .) (dig "llmGateway" "service" "port" 8080 .Values.AsMap) | quote }}
        {{- end }}
        {{- if (dig "apiGateway" "oidc" "adminGroups" nil .Values.AsMap) }}
        - name: GRYVIA_OIDC_ADMIN_GROUPS
          value: {{ (dig "apiGateway" "oidc" "adminGroups" nil .Values.AsMap) | quote }}
        {{- end }}
        {{- if (dig "apiGateway" "oidc" "legacyNamespaces" nil .Values.AsMap) }}
        - name: GRYVIA_OIDC_LEGACY_NAMESPACES
          value: "1"
        {{- end }}
        - name: GRYVIA_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "gryvia.apiKeySecret" . }}
              key: GRYVIA_API_KEY
        - name: GRYVIA_JOB_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: LOG_LEVEL
          value: "INFO"
        - name: GRYVIA_TLS_CERT
          value: /tls/tls.crt
        - name: GRYVIA_TLS_KEY
          value: /tls/tls.key
        resources:
          {{- toYaml .Values.apiGateway.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: https
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: https
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: tls
          mountPath: /tls
          readOnly: true
        {{- if (dig "apiGateway" "collector" "tlsSecret" nil .Values.AsMap) }}
        - name: collector-tls
          mountPath: /collector-tls
          readOnly: true
        {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
      - name: tls
        secret:
          secretName: {{ .Values.tls.secretName }}
          defaultMode: 0440
      {{- if (dig "apiGateway" "collector" "tlsSecret" nil .Values.AsMap) }}
      - name: collector-tls
        secret:
          secretName: {{ (dig "apiGateway" "collector" "tlsSecret" nil .Values.AsMap) | quote }}
          defaultMode: 0440
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: gryvia-api-gateway
  namespace: {{ include "gryvia.namespace" . }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
    app: gryvia-api-gateway
spec:
  type: ClusterIP
  selector:
    app: gryvia-api-gateway
  ports:
  - port: 8080
    targetPort: https
    protocol: TCP
    name: https
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gryvia-api-gateway
  namespace: {{ include "gryvia.namespace" . }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gryvia.fullname" . }}-api-gateway
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
rules:
# Read every kind the gateway serves.
- apiGroups: ["gryvia.io"]
  resources:
  - gryviaaijobs
  - gryviaquotas
  - gryviagpunodes
  - gryviastorages
  - gryvianetworks
  - gryviaworkspaces
  - gryviamodelregistries
  - gryviainferenceservices
  - gryviaworkflows
  - gryviaautotuners
  - gryviamodelwatches
  - gryviavectorindexes
  - gryviaagents
  - gryviajobhooks
  - gryviadatasets
  - gryviaflowpolicies
  - gryviatrafficinsights
  - gryviaservicegraphs
  - gryvianetworkanomalies
  - gryvianetworkcosts
  - gryviatracesessions
  - gryviasecuritypolicies
  - gryviatraininginsights
  - gryviagpumemoryoptimizers
  - gryviagpuskus
  - gryviatenants
  - gryviausagerecords
  - gryviafabricsignals
  verbs: ["get", "list", "watch"]
{{- if (dig "apiGateway" "networkCost" "enabled" nil .Values.AsMap) }}
# apiGateway.networkCost.enabled: read the measured network usage and its price list.
- apiGroups: ["gryvia.io"]
  resources:
  - gryvianetworkusagerecords
  - gryvianetworkrates
  verbs: ["get", "list", "watch"]
{{- end }}
# Write only the kinds the API creates, deletes or updates.
- apiGroups: ["gryvia.io"]
  resources:
  - gryviaaijobs
  - gryviaworkspaces
  - gryviainferenceservices
  - gryviaworkflows
  - gryviaautotuners
  - gryviamodelwatches
  - gryviavectorindexes
  - gryviaagents
  - gryviajobhooks
  - gryviadatasets
  - gryviaflowpolicies
  - gryviatracesessions
  - gryviasecuritypolicies
  - gryviamodelregistries
  - gryviagpuskus
  - gryviatenants
  verbs: ["create", "delete", "patch", "update"]
- apiGroups: [""]
  resources: ["nodes", "pods", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list"]
# Job runtime details (pod logs and events) for the dashboard.
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gryvia.fullname" . }}-api-gateway
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gryvia.fullname" . }}-api-gateway
subjects:
- kind: ServiceAccount
  name: gryvia-api-gateway
  namespace: {{ include "gryvia.namespace" . }}
{{- end }}
{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.apiGateway.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gryvia-api-gateway
  namespace: {{ include "gryvia.namespace" . }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: gryvia-api-gateway
{{- end }}
{{- end }}

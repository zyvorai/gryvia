{{- if and .Values.apiGateway.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: gryvia-api-key
  namespace: {{ include "gryvia.namespace" . }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
type: Opaque
stringData:
  GRYVIA_API_KEY: {{ required "auth.apiKey must not be empty" .Values.auth.apiKey | quote }}
{{- end }}

{{- if and .Values.apiGateway.enabled (not .Values.auth.existingSecret) }}
{{- /* auth.apiKey empty => generate a random key once and keep it across upgrades. */ -}}
{{- $key := .Values.auth.apiKey }}
{{- if not $key }}
{{- $existing := lookup "v1" "Secret" (include "gryvia.namespace" .) "gryvia-api-key" }}
{{- if and $existing $existing.data (index $existing.data "GRYVIA_API_KEY") }}
{{- $key = index $existing.data "GRYVIA_API_KEY" | b64dec }}
{{- else }}
{{- $key = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: gryvia-api-key
  namespace: {{ include "gryvia.namespace" . }}
  labels:
    {{- include "gryvia.labels" . | nindent 4 }}
type: Opaque
stringData:
  GRYVIA_API_KEY: {{ $key | quote }}
{{- end }}

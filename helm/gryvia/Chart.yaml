apiVersion: v2
name: gryvia
description: Enterprise GPU Compute Platform for AI Infrastructure
type: application
version: 1.0.0
appVersion: "1.0.0"
kubeVersion: ">=1.30.0"

keywords:
  - gpu
  - ai
  - ml
  - nvidia
  - kubernetes
  - distributed-training
  - bare-metal

home: https://github.com/zyvorai/gryvia
sources:
  - https://github.com/zyvorai/gryvia

maintainers:
  - name: Gryvia Team
    email: team@gryvia.io
    url: https://github.com/zyvorai/gryvia

icon: https://raw.githubusercontent.com/zyvorai/gryvia/main/docs/assets/logo.png

dependencies:
  - name: prometheus
    version: "27.3.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
    tags:
      - monitoring

  - name: grafana
    version: "8.8.4"
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
    tags:
      - monitoring

annotations:
  category: Infrastructure
  licenses: Apache-2.0

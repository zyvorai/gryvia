---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: gryviajobhooks.gryvia.io
spec:
  group: gryvia.io
  names:
    kind: GryviaJobHook
    listKind: GryviaJobHookList
    plural: gryviajobhooks
    shortNames:
    - gjh
    singular: gryviajobhook
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.events
      name: Events
      type: string
    - jsonPath: .status.deliveries
      name: Deliveries
      type: integer
    - jsonPath: .status.failures
      name: Failures
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GryviaJobHook delivers a webhook when a GryviaAIJob or GryviaWorkflow
          in its namespace reaches one of its events.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GryviaJobHookSpec selects job phase transitions in the hook's
              namespace and the webhook they are delivered to.
            properties:
              events:
                description: Events are the phases that trigger a delivery when a
                  job reaches them.
                items:
                  description: JobHookEvent is a job phase.
                  enum:
                  - Running
                  - Succeeded
                  - Failed
                  - Cancelled
                  - Preempted
                  - Rejected
                  type: string
                maxItems: 8
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              kinds:
                description: Kinds restricts the watched kinds; empty means both.
                items:
                  description: JobHookKind is a watched job kind.
                  enum:
                  - GryviaAIJob
                  - GryviaWorkflow
                  type: string
                maxItems: 2
                type: array
                x-kubernetes-list-type: set
              retry:
                description: Retry bounds redelivery of a failed POST.
                properties:
                  attempts:
                    default: 3
                    description: Attempts is the total number of POSTs for one transition,
                      including the first.
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                  backoffSeconds:
                    default: 10
                    description: BackoffSeconds is the wait before the second attempt;
                      it doubles for each later one.
                    format: int32
                    maximum: 3600
                    minimum: 1
                    type: integer
                type: object
              selector:
                description: Selector restricts the jobs by label; empty matches every
                  job in the namespace.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              suspend:
                description: Suspend stops new deliveries; transitions that happen
                  while suspended are not delivered later.
                type: boolean
              webhook:
                description: Webhook is where deliveries are POSTed.
                properties:
                  format:
                    default: gryvia
                    description: 'Format of the body: gryvia (the delivery JSON) or
                      slack (a {"text": ...} message for an incoming webhook).'
                    enum:
                    - gryvia
                    - slack
                    type: string
                  headers:
                    additionalProperties:
                      type: string
                    description: Headers are extra, non-secret request headers.
                    maxProperties: 16
                    type: object
                  secretRef:
                    description: |-
                      SecretRef names a Secret in the hook's namespace whose "secret" key signs each body
                      (X-Gryvia-Signature: sha256=HMAC(secret, "<X-Gryvia-Timestamp>.<body>")).
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  timeoutSeconds:
                    default: 10
                    description: TimeoutSeconds bounds one POST.
                    format: int32
                    maximum: 30
                    minimum: 1
                    type: integer
                  url:
                    description: |-
                      URL is an absolute http(s) URL without credentials. Plain http is only accepted for addresses the operator
                      allows (--job-hook-allowed-cidrs), typically in-cluster receivers.
                    maxLength: 2048
                    pattern: ^https?://
                    type: string
                required:
                - url
                type: object
            required:
            - events
            - webhook
            type: object
          status:
            description: GryviaJobHookStatus defines the observed state of GryviaJobHook
            properties:
              conditions:
                description: 'Conditions: Ready (the spec is valid and the signing
                  Secret, if any, exists).'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              deliveries:
                description: Deliveries counts successful deliveries.
                format: int64
                type: integer
              failures:
                description: Failures counts transitions given up on after the last
                  attempt.
                format: int64
                type: integer
              lastDelivery:
                description: LastDelivery is the most recent attempt.
                properties:
                  attempt:
                    format: int32
                    type: integer
                  error:
                    type: string
                  event:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                  succeeded:
                    type: boolean
                  time:
                    format: date-time
                    type: string
                required:
                - attempt
                - event
                - kind
                - name
                - succeeded
                - time
                type: object
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

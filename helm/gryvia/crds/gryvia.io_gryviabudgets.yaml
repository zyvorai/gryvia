                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentPeriod:
                description: CurrentPeriod tracks the current budget period
                properties:
                  daysRemaining:
                    description: DaysRemaining in the current period
                    type: integer
                  endDate:
                    description: EndDate of the current period
                    format: date-time
                    type: string
                  startDate:
                    description: StartDate of the current period
                    format: date-time
                    type: string
                type: object
              forecast:
                description: Forecast projects end-of-period usage
                properties:
                  budgetSufficient:
                    description: BudgetSufficient indicates if budget will last the
                      period
                    type: boolean
                  estimatedExhaustionDate:
                    description: EstimatedExhaustionDate is when budget will run out
                    format: date-time
                    type: string
                  projectedCostUSD:
                    description: ProjectedCostUSD is the projected total cost
                    type: number
                  projectedGPUHours:
                    description: ProjectedGPUHours is the projected total GPU hours
                    type: number
                type: object
              state:
                description: State is the budget state (active, warning, exceeded,
                  blocked)
                type: string
              usage:
                description: Usage tracks current resource consumption
                properties:
                  costUSD:
                    description: CostUSD is the cost consumed
                    type: number
                  currentConcurrentGPUs:
                    description: CurrentConcurrentGPUs is currently allocated GPUs
                    type: integer
                  currentConcurrentJobs:
                    description: CurrentConcurrentJobs is currently running jobs
                    type: integer
                  gpuHours:
                    description: GPUHours is the GPU hours consumed
                    type: number
                  gpuTypeHours:
                    additionalProperties:
                      type: number
                    description: GPUTypeHours is per-GPU-type hours consumed
                    type: object
                  jobCount:
                    description: JobCount is total jobs run this period
                    type: integer
                type: object
              utilization:
                description: Utilization tracks utilization percentages
                properties:
                  costPercent:
                    description: CostPercent is cost utilization percentage
                    type: number
                  gpuHoursPercent:
                    description: GPUHoursPercent is GPU hours utilization percentage
                    type: number
                  jobsPercent:
                    description: JobsPercent is jobs utilization percentage
                    type: number
                type: object
            type: object

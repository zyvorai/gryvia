    listKind: GryviaBudgetList
    plural: gryviabudgets
    singular: gryviabudget
  scope: Cluster
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: GryviaBudget is the Schema for the gryviabudgets API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GryviaBudgetSpec defines the desired state of GryviaBudget
            properties:
              alerts:
                description: Alerts defines alert thresholds
                items:
                  description: BudgetAlert defines an alert threshold
                  properties:
                    actions:
                      description: Actions to take when threshold is reached
                      items:
                        type: string
                      type: array
                    recipients:
                      description: Recipients for notifications
                      items:
                        type: string
                      type: array
                    threshold:
                      description: Threshold is the percentage of budget consumed
                        (0-100)
                      type: number
                  required:
                  - actions
                  - threshold
                  type: object
                type: array
              enforcement:
                description: Enforcement defines how the budget is enforced
                properties:
                  action:
                    description: Action is the enforcement action (warn, block, throttle)
                    type: string
                  enabled:
                    description: Enabled enables enforcement
                    type: boolean
                  gracePeriod:
                    description: GracePeriod before enforcement
                    type: string
                type: object
              limits:
                description: Limits defines the budget limits
                properties:
                  costUSD:
                    description: CostUSD is the cost limit in USD
                    type: number
                  gpuHours:
                    description: GPUHours is the GPU hours limit
                    type: number
                  gpuTypeHours:
                    additionalProperties:
                      type: number
                    description: GPUTypeHours is per-GPU-type hour limits
                    type: object
                  maxConcurrentGPUs:
                    description: MaxConcurrentGPUs limits concurrent GPU usage
                    type: integer
                  maxConcurrentJobs:
                    description: MaxConcurrentJobs limits concurrent jobs
                    type: integer
                type: object
              period:
                description: Period defines the budget period
                properties:
                  endDate:
                    description: EndDate is the end of a custom period
                    type: string
                  startDate:
                    description: StartDate is the start of a custom period
                    type: string
                  type:
                    description: Type is the period type (daily, weekly, monthly,
                      quarterly, annual, custom)
                    type: string
                required:
                - type
                type: object
              priority:
                description: Priority defines priority override settings
                properties:
                  allowOverride:
                    description: AllowOverride allows high-priority jobs to exceed
                      budget
                    type: boolean
                  overrideLimitPercent:
                    description: OverrideLimitPercent is the percentage over budget
                      allowed
                    type: integer
                type: object
              rollover:
                description: Rollover defines rollover policy
                properties:
                  enabled:
                    description: Enabled enables rollover
                    type: boolean
                  maxRolloverPercent:
                    description: MaxRolloverPercent is the max percentage that can
                      roll over
                    type: integer
                type: object
              scope:
                description: Scope defines who this budget applies to
                properties:
                  name:
                    description: Name is the name of the scoped entity
                    type: string
                  type:
                    description: Type is the scope type (team, namespace, user, project)
                    type: string
                required:
                - name
                - type
                type: object

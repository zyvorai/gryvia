                  NCCL collectives
                type: number
              overlapIdleRatio:
                description: OverlapIdleRatio is the fraction of the window the job
                  spent in cudaDeviceSynchronize inside an in-flight allreduce
                type: number
              phase:
                description: Phase is the current analysis phase
                type: string
              rankStats:
                description: RankStats contains per-rank communication statistics
                items:
                  description: RankStat contains per-rank communication statistics
                  properties:
                    avgLatencyNs:

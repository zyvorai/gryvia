                        in nanoseconds
                      format: int64
                      type: integer
                    isStraggler:
                      description: IsStraggler indicates whether this rank is identified
                        as a straggler
                      type: boolean
                    rank:
                      description: Rank is the distributed training rank
                      type: integer
                    totalBytes:
                      description: TotalBytes is the total bytes communicated by this
                        rank
                      format: int64
                      type: integer
                  type: object
                type: array
              rdmaRetryRate:
                description: RDMARetryRate is the ratio of RDMA retry/RNR error completions
                  to posted sends
                type: number
              scoreDelta:
                description: ScoreDelta is the fabric penalty in [0,1] published by
                  the collector (0 = healthy fabric)
                type: number
              signalRef:
                description: SignalRef is the GryviaFabricSignal the figures below
                  were read from
                type: string
              stragglers:
                description: Stragglers lists detected straggler ranks

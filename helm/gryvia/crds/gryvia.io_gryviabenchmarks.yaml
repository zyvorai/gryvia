---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: gryviabenchmarks.gryvia.io
spec:
  group: gryvia.io
  names:
    kind: GryviaBenchmark
    listKind: GryviaBenchmarkList
    plural: gryviabenchmarks
    singular: gryviabenchmark
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .spec.target.gpuCount
      name: GPUs
      type: integer
    - jsonPath: .status.duration
      name: Duration
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: GryviaBenchmark is the Schema for the gryviabenchmarks API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GryviaBenchmarkSpec defines the desired state of GryviaBenchmark
            properties:
              baseline:
                description: Baseline defines comparison baseline configuration
                properties:
                  benchmarkRef:
                    description: BenchmarkRef references a previous benchmark
                    type: string
                  enabled:
                    description: Enabled enables baseline comparison
                    type: boolean
                  regressionThreshold:
                    description: RegressionThreshold is the percentage drop that triggers
                      regression
                    type: number
                  values:
                    additionalProperties:
                      type: number
                    description: Values are explicit baseline values
                    type: object
                type: object
              custom:
                description: Custom defines custom benchmark configuration
                properties:
                  args:
                    description: Args are command arguments
                    items:
                      type: string
                    type: array
                  command:
                    description: Command to execute
                    items:
                      type: string
                    type: array
                  image:
                    description: Image is the container image
                    type: string
                  metrics:
                    description: Metrics are expected output metrics
                    items:
                      description: CustomMetricDef defines a custom metric definition
                      properties:
                        higherIsBetter:
                          description: HigherIsBetter indicates if higher values are
                            better
                          type: boolean
                        name:
                          description: Name of the metric
                          type: string
                        unit:
                          description: Unit of measurement
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                required:
                - image
                type: object
              gpuMemory:
                description: GPUMemory defines GPU memory benchmark configuration
                properties:
                  directions:
                    description: Directions are the transfer directions (h2d, d2h,
                      d2d)
                    items:
                      type: string
                    type: array
                  sizes:
                    description: Sizes are the transfer sizes
                    items:
                      type: string
                    type: array
                  testType:
                    description: TestType is the test type (bandwidth, latency, both)
                    type: string
                type: object
              ioThroughput:
                description: IOThroughput defines I/O benchmark configuration
                properties:
                  blockSize:
                    description: BlockSize is the I/O block size
                    type: string
                  fileSize:
                    description: FileSize is the test file size
                    type: string
                  operations:
                    description: Operations are the I/O operations to test
                    items:
                      type: string
                    type: array
                  storageClass:
                    description: StorageClass is the storage backend
                    type: string
                  threads:
                    description: Threads is the number of I/O threads
                    format: int32
                    type: integer
                type: object
              mlperf:
                description: MLPerf defines MLPerf benchmark configuration
                properties:
                  batchSize:
                    description: BatchSize is the batch size
                    format: int32
                    type: integer
                  precision:
                    description: Precision is the numeric precision
                    type: string
                  targetMetric:
                    description: TargetMetric is the metric to optimize for
                    type: string
                  workload:
                    description: Workload is the MLPerf workload
                    type: string
                type: object
              nccl:
                description: NCCL defines NCCL benchmark configuration
                properties:
                  iterations:
                    description: Iterations is the number of iterations
                    format: int32
                    type: integer
                  messageSizes:
                    description: MessageSizes are the message sizes in MB
                    items:
                      format: int32
                      type: integer
                    type: array
                  operations:
                    description: Operations are the NCCL operations to test
                    items:
                      type: string
                    type: array
                  warmupIters:
                    description: WarmupIters is the number of warmup iterations
                    format: int32
                    type: integer
                type: object
              schedule:
                description: Schedule defines benchmark scheduling
                properties:
                  cron:
                    description: Cron is the schedule expression for recurring benchmarks
                    type: string
                  suspend:
                    description: Suspend pauses scheduling
                    type: boolean
                  type:
                    description: Type is once or recurring
                    type: string
                type: object
              target:
                description: Target defines the resources to benchmark
                properties:
                  gpuCount:
                    description: GpuCount is the number of GPUs to use
                    format: int32
                    type: integer
                  gpuType:
                    description: GpuType is the GPU model to benchmark
                    type: string
                  networkType:
                    description: NetworkType is the network type (infiniband, roce,
                      ethernet)
                    type: string
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: NodeSelector selects specific nodes
                    type: object
                type: object
              type:
                description: Type is the benchmark type (mlperf, nccl, gpu-memory,
                  io-throughput, custom)
                type: string
            required:
            - target
            - type
            type: object
          status:
            description: GryviaBenchmarkStatus defines the observed state of GryviaBenchmark
            properties:
              comparison:
                description: Comparison holds comparison with baseline
                properties:
                  improved:
                    description: Improved is the number of improved metrics
                    format: int32
                    type: integer
                  regressed:
                    description: Regressed is the number of regressed metrics
                    format: int32
                    type: integer
                  stable:
                    description: Stable is the number of stable metrics
                    format: int32
                    type: integer
                type: object
              completionTime:
                description: CompletionTime is when the benchmark completed
                format: date-time
                type: string
              duration:
                description: Duration is the human-readable duration
                type: string
              hardware:
                description: Hardware holds hardware information
                properties:
                  cudaVersion:
                    description: CudaVersion is the CUDA version
                    type: string
                  driverVersion:
                    description: DriverVersion is the NVIDIA driver version
                    type: string
                  gpuCount:
                    description: GpuCount is the number of GPUs used
                    format: int32
                    type: integer
                  gpuModel:
                    description: GpuModel is the GPU model name
                    type: string
                type: object
              results:
                additionalProperties:
                  description: BenchmarkResultValue holds a single result metric
                  properties:
                    percentile95:
                      description: Percentile95 is the 95th percentile
                      type: number
                    percentile99:
                      description: Percentile99 is the 99th percentile
                      type: number
                    unit:
                      description: Unit is the measurement unit
                      type: string
                    value:
                      description: Value is the metric value
                      type: number
                  required:
                  - value
                  type: object
                description: Results holds benchmark result metrics
                type: object
              startTime:
                description: StartTime is when the benchmark started
                format: date-time
                type: string
              state:
                description: State is the current state (pending, running, completed,
                  failed, regressed)
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

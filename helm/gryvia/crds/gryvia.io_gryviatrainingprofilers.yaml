  names:
    kind: GryviaTrainingProfiler
    listKind: GryviaTrainingProfilerList
    plural: gryviatrainingprofilers
    singular: gryviatrainingprofiler
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.jobsProfiled
      name: JobsProfiled
      type: integer
    - jsonPath: .status.avgMFU
      name: AvgMFU
      type: number
    - jsonPath: .status.clusterEfficiencyScore
      name: EfficiencyScore
      type: number
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GryviaTrainingProfiler is the Schema for the gryviatrainingprofilers
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GryviaTrainingProfilerSpec defines the desired state of GryviaTrainingProfiler
            properties:
              analysis:
                description: Analysis configuration
                properties:
                  baselineSource:
                    description: BaselineSource defines the source of baseline data
                      (builtin or custom)
                    type: string
                  compareBaseline:
                    description: CompareBaseline enables comparison against known
                      baselines for the GPU type
                    type: boolean
                  recommendations:
                    description: Recommendations defines which recommendation categories
                      to enable
                    properties:
                      batchSize:
                        description: BatchSize enables batch size adjustment recommendations
                        type: boolean
                      compilationOptimization:
                        description: CompilationOptimization enables torch.compile
                          or XLA optimization recommendations
                        type: boolean
                      dataLoading:
                        description: DataLoading enables data loading optimization
                          recommendations
                        type: boolean
                      distributedStrategy:
                        description: DistributedStrategy enables distributed training
                          strategy recommendations
                        type: boolean
                      gpuTypeRecommendation:
                        description: GpuTypeRecommendation enables alternative GPU
                          type recommendations
                        type: boolean
                      mixedPrecision:
                        description: MixedPrecision enables mixed precision training
                          recommendations
                        type: boolean
                    type: object
                  severityThreshold:
                    description: SeverityThreshold is the minimum severity level for
                      recommendations (info, warning, critical)
                    type: string
                type: object
              metrics:
                description: Metrics to collect during profiling
                properties:
                  communication:
                    description: Communication defines distributed communication metrics
                      to collect
                    properties:
                      allReduceTime:
                        description: AllReduceTime enables allreduce operation time
                          measurement
                        type: boolean
                      computeCommOverlap:
                        description: ComputeCommOverlap enables compute-communication
                          overlap measurement
                        type: boolean
                      ncclBandwidth:
                        description: NcclBandwidth enables NCCL collective bandwidth
                          measurement
                        type: boolean
                    type: object
                  dataPipeline:
                    description: DataPipeline defines data pipeline metrics to collect
                    properties:
                      dataloaderThroughput:
                        description: DataloaderThroughput enables data loading throughput
                          measurement
                        type: boolean
                      ioWaitRatio:
                        description: IoWaitRatio enables measurement of time GPU waits
                          for data
                        type: boolean
                    type: object
                  gpuCompute:
                    description: GpuCompute defines GPU compute metrics to collect
                    properties:
                      flopsEfficiency:
                        description: FlopsEfficiency enables FLOPS efficiency calculation
                        type: boolean
                      smUtilization:
                        description: SMUtilization enables streaming multiprocessor
                          utilization collection
                        type: boolean
                      tensorCoreUtilization:
                        description: TensorCoreUtilization enables tensor core utilization
                          collection
                        type: boolean
                    type: object
                  gpuMemory:
                    description: GpuMemory defines GPU memory metrics to collect
                    properties:
                      memoryBandwidthUtilization:
                        description: MemoryBandwidthUtilization enables HBM bandwidth
                          utilization measurement
                        type: boolean
                      peakMemoryUsage:
                        description: PeakMemoryUsage enables peak GPU memory usage
                          tracking
                        type: boolean
                    type: object
                type: object
              output:
                description: Output configuration
                properties:
                  emitEvents:
                    description: EmitEvents emits Kubernetes events for recommendations
                    type: boolean
                  prometheusMetrics:
                    description: PrometheusMetrics exposes profiling data as Prometheus
                      metrics
                    type: boolean
                  storeInJobStatus:
                    description: StoreInJobStatus stores profiling results in GryviaAIJob
                      status
                    type: boolean
                type: object
              target:
                description: Target configuration for which jobs to profile
                properties:
                  autoProfile:
                    description: AutoProfile defines automatic profiling parameters
                    properties:
                      cooldownMinutes:
                        description: CooldownMinutes is the minimum minutes between
                          profiling sessions for the same job
                        format: int32
                        type: integer
                      profileSteps:
                        description: ProfileSteps is the number of steps to profile
                        format: int32
                        type: integer
                      warmupSteps:
                        description: WarmupSteps is the number of training steps to
                          skip before profiling begins
                        format: int32
                        type: integer
                    type: object
                  jobRef:
                    description: 'JobRef is the name of a specific GryviaAIJob to
                      profile (used with type: job-ref)'
                    type: string
                  jobSelector:
                    additionalProperties:
                      type: string
                    description: JobSelector is a label selector to match GryviaAIJob
                      resources
                    type: object
                  type:
                    description: 'Type of profiling: auto, on-demand, or job-ref'
                    type: string
                type: object
            required:
            - target
            type: object
          status:
            description: GryviaTrainingProfilerStatus defines the observed state of
              GryviaTrainingProfiler
            properties:
              avgMFU:
                description: AvgMFU is the average Model FLOPS Utilization across
                  profiled jobs (0-100)
                type: number
              clusterEfficiencyScore:
                description: ClusterEfficiencyScore is the overall cluster GPU efficiency
                  score (0-100)
                type: number
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              jobsProfiled:
                description: JobsProfiled is the total number of jobs profiled
                format: int32
                type: integer
              lastProfileTime:
                description: LastProfileTime is the timestamp of the last profiling
                  run
                format: date-time
                type: string
              topRecommendations:
                description: TopRecommendations is the list of most recent high-impact
                  recommendations
                items:
                  description: ProfilerRecommendation represents a single profiling
                    recommendation
                  properties:
                    category:
                      description: Category is the recommendation category (batchSize,
                        dataLoading, mixedPrecision, etc.)
                      type: string
                    description:
                      description: Description is a human-readable description of
                        the recommendation
                      type: string
                    estimatedImpact:
                      description: EstimatedImpact is the estimated performance improvement
                      type: string
                    jobName:
                      description: JobName is the name of the job this recommendation
                        applies to
                      type: string
                    severity:
                      description: Severity is the recommendation severity (info,
                        warning, critical)
                      type: string
                    timestamp:
                      description: Timestamp is when the recommendation was generated
                      format: date-time
                      type: string
                  required:
                  - category
                  - description
                  - estimatedImpact
                  - jobName
                  - severity
                  - timestamp
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: gryviavectorindexes.gryvia.io
spec:
  group: gryvia.io
  names:
    kind: GryviaVectorIndex
    listKind: GryviaVectorIndexList
    plural: gryviavectorindexes
    shortNames:
    - gvi
    singular: gryviavectorindex
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.datasetRef
      name: Dataset
      type: string
    - jsonPath: .spec.embedding.model
      name: Model
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.chunks
      name: Chunks
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GryviaVectorIndex is a retrieval index: a dataset chunked, embedded through the LLM gateway and stored in Qdrant,
          queried with the gateway's POST /v1/retrieve
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GryviaVectorIndexSpec defines the desired state of GryviaVectorIndex
            properties:
              chunking:
                description: Chunking splits each file into overlapping pieces of
                  text
                properties:
                  overlap:
                    description: 'Overlap between consecutive chunks in characters
                      (0: none; less than size)'
                    format: int32
                    minimum: 0
                    type: integer
                  size:
                    description: Size of a chunk in characters (default 1000)
                    format: int32
                    maximum: 20000
                    minimum: 50
                    type: integer
                type: object
              collection:
                description: 'Collection is the name queries use (a Qdrant alias);
                  default: the index name'
                pattern: ^([A-Za-z0-9][A-Za-z0-9_-]{0,62})?$
                type: string
              datasetRef:
                description: |-
                  DatasetRef is the GryviaDataset whose files are indexed. It must be materialized (state ready) in this
                  index's namespace; a new dataset version is ingested again
                minLength: 1
                type: string
              embedding:
                description: 'Embedding is how chunks and queries are embedded: through
                  the LLM gateway''s /v1/embeddings'
                properties:
                  batchSize:
                    description: BatchSize is how many chunks are embedded per request
                      (default 32)
                    format: int32
                    maximum: 1024
                    minimum: 1
                    type: integer
                  model:
                    description: |-
                      Model is a model name published by the LLM gateway (annotation gryvia.io/llm-model) that serves
                      /v1/embeddings and that keys of this namespace may call
                    minLength: 1
                    type: string
                required:
                - model
                type: object
              ingestImage:
                description: IngestImage overrides the operator's ingestion image
                  (--rag-ingest-image)
                type: string
              schedule:
                description: Schedule re-ingests on a cron schedule (UTC, five fields)
                  even when the dataset did not change
                type: string
              store:
                description: Store is where the vectors live
                properties:
                  external:
                    description: External is the URL of a Qdrant HTTP API (and an
                      optional API key)
                    properties:
                      apiKeySecretRef:
                        description: APIKeySecretRef is a Secret in the index's namespace
                          holding the api-key header value (key defaults to "token")
                        properties:
                          key:
                            description: Key defaults to "token"
                            type: string
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      url:
                        description: URL of the Qdrant HTTP API, for example http://qdrant.vector.svc:6333
                        pattern: ^https?://[^\s]+$
                        type: string
                    required:
                    - url
                    type: object
                  managed:
                    description: Managed sets the managed store's image and storage
                    properties:
                      image:
                        description: Image overrides the operator's Qdrant image (--rag-qdrant-image).
                          The pod runs as uid 1000, as the -unprivileged Qdrant images
                          do
                        type: string
                      storageClass:
                        description: 'StorageClass of the PVC (default: the cluster
                          default)'
                        type: string
                      storageSize:
                        description: StorageSize of the PVC (default 10Gi)
                        type: string
                    type: object
                  type:
                    description: Type is managed (a Qdrant StatefulSet, Service and
                      PVC owned by the index) or external
                    enum:
                    - managed
                    - external
                    type: string
                required:
                - type
                type: object
              suspend:
                description: Suspend stops ingestion; the store keeps serving queries
                type: boolean
            required:
            - datasetRef
            - embedding
            - store
            type: object
          status:
            description: GryviaVectorIndexStatus defines the observed state of GryviaVectorIndex
            properties:
              chunks:
                description: Chunks is the number of vectors in the last ingestion
                format: int64
                type: integer
              collection:
                description: Collection is the alias queries use
                type: string
              conditions:
                description: 'Conditions: StoreReady, Ingested'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              datasetVersion:
                description: DatasetVersion is the dataset version the served collection
                  was built from
                type: string
              dimensions:
                description: Dimensions of the embedding vectors
                format: int64
                type: integer
              documents:
                description: Documents is the number of files in the last ingestion
                format: int64
                type: integer
              ingestJob:
                description: IngestJob is the name of the current or last ingestion
                  Job
                type: string
              ingestedGeneration:
                description: IngestedGeneration is the spec generation of the last
                  successful ingestion
                format: int64
                type: integer
              keySecret:
                description: KeySecret is the Secret in this namespace holding the
                  LLM gateway key the ingestion uses
                type: string
              lastIngested:
                description: LastIngested is when the last successful ingestion finished
                format: date-time
                type: string
              message:
                description: Message explains the phase
                type: string
              nextScheduleTime:
                description: NextScheduleTime is the next scheduled re-ingestion
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation the status
                  describes
                format: int64
                type: integer
              phase:
                description: Phase is Pending, Provisioning, Ingesting, Ready or Failed
                type: string
              storeURL:
                description: StoreURL is the Qdrant HTTP API the index uses
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

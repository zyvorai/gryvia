# Default values for the Gryvia chart (operators, API gateway and dashboard).

global:
  # Registry prefix for every Gryvia image: <registry>/<image.name>:<tag>.
  # Mirrored on Docker Hub as docker.io/zyvorai.
  imageRegistry: ghcr.io/zyvorai
  # Defaults to the chart appVersion.
  imageTag: ""
  imagePullPolicy: IfNotPresent

# --- Operators ---------------------------------------------------------------
# All operators share one ServiceAccount and ClusterRole (see templates/rbac.yaml).
gpuOperator:
  enabled: true
  # Create a GryviaGpuNode for every node that carries the NVIDIA GPU feature-discovery labels
  # (nvidia.com/gpu.present=true), and remove it again when the GPU goes away. Hand-made objects are never touched.
  autoRegister: true
  image: {name: gryvia-gpu-operator, tag: ""}
  replicas: 1
  resources:
    limits: {cpu: 500m, memory: 512Mi}
    requests: {cpu: 100m, memory: 128Mi}
  healthCheck:
    enabled: true
    intervalSeconds: 60
  nodeSelector: {}
  tolerations: []

aiOperator:
  enabled: true
  image: {name: gryvia-ai-operator, tag: ""}
  replicas: 1
  resources:
    limits: {cpu: 500m, memory: 512Mi}
    requests: {cpu: 100m, memory: 128Mi}
  nodeSelector: {}
  tolerations: []

# Admission webhook served by the ai-operator: validates GryviaAIJob on CREATE/UPDATE.
# It uses its own self-signed certificate (independent of tls.mode), reused on upgrades.
webhook:
  enabled: true
  # Ignore: if the webhook is unreachable, job creation still succeeds (recommended default).
  # Fail: reject job creation while the webhook is down (hardening; requires a healthy ai-operator).
  failurePolicy: Ignore
  timeoutSeconds: 5

quotaOperator:
  enabled: true
  image: {name: gryvia-quota-operator, tag: ""}
  replicas: 1
  resources:
    limits: {cpu: 500m, memory: 512Mi}
    requests: {cpu: 100m, memory: 128Mi}
  nodeSelector: {}
  tolerations: []
  # Default GPU pricing (USD per hour)
  pricing:
    H100: 8.00
    A100-80G: 4.00
    A100-40G: 3.00
    L40: 2.50
    A10: 1.50
    V100: 2.00
    T4: 0.75

storageOperator:
  enabled: false
  image: {name: gryvia-storage-operator, tag: ""}
  replicas: 1
  resources:
    limits: {cpu: 200m, memory: 256Mi}
    requests: {cpu: 50m, memory: 64Mi}
  nodeSelector: {}
  tolerations: []

networkOperator:
  enabled: false
  image: {name: gryvia-network-operator, tag: ""}
  replicas: 1
  resources:
    limits: {cpu: 200m, memory: 256Mi}
    requests: {cpu: 50m, memory: 64Mi}
  nodeSelector: {}
  tolerations: []

# --- API gateway and dashboard -----------------------------------------------
apiGateway:
  enabled: true
  image: {name: gryvia-api-gateway, tag: ""}
  replicas: 2
  # Optional Prometheus URL for cost and metrics history.
  prometheusUrl: ""
  resources:
    limits: {cpu: 500m, memory: 512Mi}
    requests: {cpu: 200m, memory: 256Mi}

ui:
  enabled: true
  image: {name: gryvia-ui, tag: ""}
  replicas: 2
  resources:
    limits: {cpu: 200m, memory: 256Mi}
    requests: {cpu: 100m, memory: 128Mi}
  service:
    # ClusterIP, NodePort or LoadBalancer. The dashboard is HTTPS on port 443.
    type: ClusterIP
    nodePort: null
  ingress:
    enabled: false
    className: ""
    host: gryvia.example.com
    annotations: {}
    # Secret with the ingress certificate (leave empty for none).
    tlsSecretName: ""

# Sign-in. The dashboard and API use one shared bearer key (login: admin / <key>).
# LAB DEFAULT: the key below is well known (Admin@321) and the dashboard shows a warning while it is
# in use. For anything reachable from an untrusted network set your own (--set auth.apiKey=<secret>),
# use an existing Secret, or set apiKey to "" to have the chart generate a random key once
# (read it back: kubectl -n gryvia-system get secret gryvia-api-key -o jsonpath='{.data.GRYVIA_API_KEY}' | base64 -d).
auth:
  apiKey: "Admin@321"
  # Existing Secret holding the key under `GRYVIA_API_KEY`; overrides apiKey.
  existingSecret: ""

# TLS between browser -> UI and UI -> gateway.
tls:
  # selfSigned: the chart mints one certificate and reuses it on upgrades.
  # existingSecret: use the kubernetes.io/tls Secret named below.
  # certManager: request a certificate from the issuer named below.
  mode: selfSigned
  secretName: gryvia-tls
  extraSANs: []
  certManager:
    issuerName: ""
    issuerKind: ClusterIssuer

# --- Optional hardening -------------------------------------------------------
podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false

# --- GPU node add-ons ----------------------------------------------------------
# --- NVIDIA GPU Operator (drivers, container toolkit, device plugin, DCGM, GPU feature discovery) ---------
# Off by default, so kind and CPU-only clusters get nothing NVIDIA-specific. On a GPU cluster whose nodes do not
# already have the NVIDIA driver and container toolkit, turn it on: `--set nvidia.enabled=true`. It installs NVIDIA's
# own operator as a sub-chart (https://github.com/NVIDIA/gpu-operator); Gryvia then auto-registers the GPU nodes
# it prepares. While it is on, the two DaemonSets below (Gryvia's own device plugin and DCGM exporter) are not
# rendered. Every other key under `nvidia:` is passed through to the NVIDIA chart.
nvidia:
  enabled: false
  driver:
    # true: the driver runs in a container, nothing is needed on the host.
    # false: the host already has the NVIDIA driver installed.
    enabled: true
  toolkit:
    enabled: true
    # k3s runs its own containerd. `scripts/install-k3s-gpu.sh` sets these; set them yourself on k3s:
    #   - {name: CONTAINERD_CONFIG, value: /var/lib/rancher/k3s/agent/etc/containerd/config.toml.tmpl}
    #   - {name: CONTAINERD_SOCKET, value: /run/k3s/containerd/containerd.sock}
    #   - {name: CONTAINERD_RUNTIME_CLASS, value: nvidia}
    #   - {name: CONTAINERD_SET_AS_DEFAULT, value: "true"}
    env: []

# --- Gryvia's own GPU add-ons: used only when nvidia.enabled=false ---------------------------------------------
# They assume the host already has the NVIDIA driver, the container toolkit and nvidia as the default (or
# `runtimeClassName`) runtime. They run only on nodes labelled nvidia.com/gpu.present=true (set by GPU feature
# discovery, or by hand: kubectl label node <name> nvidia.com/gpu.present=true), never on CPU nodes.
nvidiaDevicePlugin:
  enabled: true
  nodeSelector:
    nvidia.com/gpu.present: "true"
  # Set to `nvidia` when the toolkit registered an nvidia RuntimeClass but did not make it the default.
  runtimeClassName: ""
  image:
    repository: nvcr.io/nvidia/k8s-device-plugin
    tag: v0.17.0
    pullPolicy: IfNotPresent

dcgmExporter:
  enabled: true
  nodeSelector:
    nvidia.com/gpu.present: "true"
  runtimeClassName: ""
  image:
    repository: nvcr.io/nvidia/k8s/dcgm-exporter
    tag: 3.3.9-3.6.1-ubuntu22.04
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9400

# --- Cluster plumbing -----------------------------------------------------------
rbac:
  create: true

serviceAccount:
  create: true
  name: gryvia-operator
  annotations: {}

namespace:
  create: true
  name: gryvia-system

crds:
  install: true
  keep: true

monitoring:
  enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
  grafana:
    enabled: true
    dashboards:
      enabled: true

ha:
  enabled: false
  leaderElection: true

# Container-level security context (operators)
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

# Pod-level security context (operators)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
labels: {}
annotations: {}

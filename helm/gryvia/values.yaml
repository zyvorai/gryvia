# Default values for the Gryvia chart (operators, API gateway and dashboard).

global:
  # Registry prefix for every Gryvia image: <registry>/<image.name>:<tag>.
  # Mirrored on Docker Hub as docker.io/zyvorai.
  imageRegistry: ghcr.io/zyvorai
  # Defaults to the chart appVersion.
  imageTag: ""
  imagePullPolicy: IfNotPresent

# --- Operators ---------------------------------------------------------------
# All operators share one ServiceAccount and ClusterRole (see templates/rbac.yaml).
gpuOperator:
  enabled: true
  image: {name: gryvia-gpu-operator, tag: ""}
  replicas: 1
  resources:
    limits: {cpu: 500m, memory: 512Mi}
    requests: {cpu: 100m, memory: 128Mi}
  healthCheck:
    enabled: true
    intervalSeconds: 60
  nodeSelector: {}
  tolerations: []

aiOperator:
  enabled: true
  image: {name: gryvia-ai-operator, tag: ""}
  replicas: 1
  resources:
    limits: {cpu: 500m, memory: 512Mi}
    requests: {cpu: 100m, memory: 128Mi}
  nodeSelector: {}
  tolerations: []

quotaOperator:
  enabled: true
  image: {name: gryvia-quota-operator, tag: ""}
  replicas: 1
  resources:
    limits: {cpu: 500m, memory: 512Mi}
    requests: {cpu: 100m, memory: 128Mi}
  nodeSelector: {}
  tolerations: []
  # Default GPU pricing (USD per hour)
  pricing:
    H100: 8.00
    A100-80G: 4.00
    A100-40G: 3.00
    L40: 2.50
    A10: 1.50
    V100: 2.00
    T4: 0.75

storageOperator:
  enabled: false
  image: {name: gryvia-storage-operator, tag: ""}
  replicas: 1
  resources:
    limits: {cpu: 200m, memory: 256Mi}
    requests: {cpu: 50m, memory: 64Mi}
  nodeSelector: {}
  tolerations: []

networkOperator:
  enabled: false
  image: {name: gryvia-network-operator, tag: ""}
  replicas: 1
  resources:
    limits: {cpu: 200m, memory: 256Mi}
    requests: {cpu: 50m, memory: 64Mi}
  nodeSelector: {}
  tolerations: []

# --- API gateway and dashboard -----------------------------------------------
apiGateway:
  enabled: true
  image: {name: gryvia-api-gateway, tag: ""}
  replicas: 2
  # Optional Prometheus URL for cost and metrics history.
  prometheusUrl: ""
  resources:
    limits: {cpu: 500m, memory: 512Mi}
    requests: {cpu: 200m, memory: 256Mi}

ui:
  enabled: true
  image: {name: gryvia-ui, tag: ""}
  replicas: 2
  resources:
    limits: {cpu: 200m, memory: 256Mi}
    requests: {cpu: 100m, memory: 128Mi}
  service:
    # ClusterIP, NodePort or LoadBalancer. The dashboard is HTTPS on port 443.
    type: ClusterIP
    nodePort: null
  ingress:
    enabled: false
    className: ""
    host: gryvia.example.com
    annotations: {}
    # Secret with the ingress certificate (leave empty for none).
    tlsSecretName: ""

# Sign-in. The dashboard and API use one shared bearer key.
# LAB DEFAULT: the key below is well known (login admin / Admin@321). Change it for anything
# reachable from an untrusted network: --set auth.apiKey=<secret> or use an existing Secret.
auth:
  apiKey: "Admin@321"
  # Existing Secret holding the key under `GRYVIA_API_KEY`; overrides apiKey.
  existingSecret: ""

# TLS between browser -> UI and UI -> gateway.
tls:
  # selfSigned: the chart mints one certificate and reuses it on upgrades.
  # existingSecret: use the kubernetes.io/tls Secret named below.
  # certManager: request a certificate from the issuer named below.
  mode: selfSigned
  secretName: gryvia-tls
  extraSANs: []
  certManager:
    issuerName: ""
    issuerKind: ClusterIssuer

# --- Optional hardening -------------------------------------------------------
podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false

# --- GPU node add-ons ----------------------------------------------------------
nvidiaDevicePlugin:
  enabled: true
  image:
    repository: nvcr.io/nvidia/k8s-device-plugin
    tag: v0.17.0
    pullPolicy: IfNotPresent

dcgmExporter:
  enabled: true
  image:
    repository: nvcr.io/nvidia/k8s/dcgm-exporter
    tag: 3.3.9-3.6.1-ubuntu22.04
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9400

# --- Cluster plumbing -----------------------------------------------------------
rbac:
  create: true

serviceAccount:
  create: true
  name: gryvia-operator
  annotations: {}

namespace:
  create: true
  name: gryvia-system

crds:
  install: true
  keep: true

monitoring:
  enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
  grafana:
    enabled: true
    dashboards:
      enabled: true

ha:
  enabled: false
  leaderElection: true

# Container-level security context (operators)
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

# Pod-level security context (operators)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
labels: {}
annotations: {}

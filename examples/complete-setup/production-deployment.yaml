# Complete TensorReaper Production Setup
# This example shows all operators working together for a full AI infrastructure

---
# 1. Storage Backend - VAST Data for training data
apiVersion: tensorreaper.ai/v1
kind: FabricStorage
metadata:
  name: vast-production
spec:
  backendType: vast
  endpoint: vast-mgmt.example.com
  capacity: 500Ti
  nodeSelector:
    tensorreaper.ai/storage: "true"
  credentials:
    secretName: vast-credentials
    secretNamespace: tensorreaper-system
  config:
    vipPool: "10.0.0.0/24"
    mountOptions: ["rw", "relatime", "vers=3"]

---
# 2. Network Configuration - RDMA InfiniBand for distributed training
apiVersion: tensorreaper.ai/v1
kind: FabricNetwork
metadata:
  name: rdma-training-network
spec:
  networkType: rdma
  mtu: 9000
  nodeSelector:
    tensorreaper.ai/rdma: "true"
  rdma:
    mode: infiniband
    devices: [mlx5_0, mlx5_1]
    subnet: 10.100.0.0/16
    gateway: 10.100.0.1

---
# 3. GPU Nodes - Register H100 cluster
apiVersion: tensorreaper.ai/v1
kind: FabricGpuNode
metadata:
  name: gpu-node-01
spec:
  nodeName: gpu-worker-01
  gpuType: H100
  gpuCount: 8
  memory: 512Gi
  rdmaEnabled: true
  nvlinkEnabled: true
  healthCheck:
    enabled: true
    interval: 60

---
# 4. Team Quotas - ML Research Team
apiVersion: tensorreaper.ai/v1
kind: FabricQuota
metadata:
  name: team-ml-research
spec:
  team: ml-research
  namespaces: [ml-training, ml-inference]
  priority: 80
  gpuQuota:
    maxGPUs: 64
    maxGPUsPerJob: 32
    maxRunningJobs: 4
    maxQueuedJobs: 8
    allowedGPUTypes: [H100, A100-80G]
  budget:
    monthlyBudget: 100000.00
    alertThreshold: 80.0
    hardLimit: true

---
# 5. Team Quotas - Computer Vision Team
apiVersion: tensorreaper.ai/v1
kind: FabricQuota
metadata:
  name: team-cv
spec:
  team: computer-vision
  namespaces: [cv-training, cv-prod]
  priority: 70
  gpuQuota:
    maxGPUs: 32
    maxGPUsPerJob: 16
    maxRunningJobs: 6
    maxQueuedJobs: 12
    allowedGPUTypes: [A100-80G, L40]
  budget:
    monthlyBudget: 50000.00
    alertThreshold: 75.0
    hardLimit: false

---
# 6. Namespaces for teams
apiVersion: v1
kind: Namespace
metadata:
  name: ml-training
  labels:
    tensorreaper.ai/team: ml-research
    tensorreaper.ai/quota: team-ml-research

---
apiVersion: v1
kind: Namespace
metadata:
  name: cv-training
  labels:
    tensorreaper.ai/team: computer-vision
    tensorreaper.ai/quota: team-cv

---
# 7. Storage Secrets
# IMPORTANT: Replace placeholder values with real credentials before applying.
# Consider using a secrets manager (e.g., Vault, Sealed Secrets) in production.
apiVersion: v1
kind: Secret
metadata:
  name: vast-credentials
  namespace: tensorreaper-system
type: Opaque
stringData:
  username: <REPLACE_WITH_USERNAME>
  password: <REPLACE_WITH_PASSWORD>

---
# 8. Distributed Training Job - LLM on 32x H100
apiVersion: tensorreaper.ai/v1
kind: FabricAIJob
metadata:
  name: llm-pretraining
  namespace: ml-training
spec:
  framework: pytorch
  distributed:
    enabled: true
    strategy: ddp
    nodes: 4         # 4 nodes
    gpusPerNode: 8   # 8 GPUs per node = 32 GPUs total

  resources:
    gpuType: H100
    gpuCount: 8  # Per node
    memory: 1Ti
    cpu: 96

  image: nvcr.io/nvidia/pytorch:24.01-py3

  command:
    - torchrun
    - --nproc_per_node=8
    - --nnodes=4
    - --node_rank=$(RANK)
    - --master_addr=$(MASTER_ADDR)
    - --master_port=29500
    - train_llm.py
    - --model=llama-70b
    - --batch-size=4
    - --gradient-checkpointing

  env:
    - name: NCCL_IB_HCA
      value: "mlx5_0,mlx5_1"
    - name: NCCL_IB_GID_INDEX
      value: "3"
    - name: NCCL_NET_GDR_LEVEL
      value: "5"
    - name: CUDA_VISIBLE_DEVICES
      value: "0,1,2,3,4,5,6,7"

  storage:
    - name: training-data
      storageClassName: vast-production
      size: 50Ti
      mountPath: /data

    - name: checkpoints
      storageClassName: vast-production
      size: 10Ti
      mountPath: /checkpoints

  network:
    rdma: rdma-training-network

  scheduling:
    priority: high
    preemptible: false

---
# 9. Inference Service - Computer Vision Model
apiVersion: tensorreaper.ai/v1
kind: FabricAIJob
metadata:
  name: cv-inference-service
  namespace: cv-prod
spec:
  framework: triton

  resources:
    gpuType: L40
    gpuCount: 2
    memory: 128Gi
    cpu: 32

  image: nvcr.io/nvidia/tritonserver:24.01-py3

  command:
    - tritonserver
    - --model-repository=/models
    - --http-port=8000
    - --grpc-port=8001
    - --metrics-port=8002

  storage:
    - name: models
      storageClassName: vast-production
      size: 1Ti
      mountPath: /models

  service:
    type: LoadBalancer
    ports:
      - name: http
        port: 8000
        targetPort: 8000
      - name: grpc
        port: 8001
        targetPort: 8001
      - name: metrics
        port: 8002
        targetPort: 8002

  scheduling:
    priority: high
    preemptible: false

---
# 10. PersistentVolumeClaim for shared dataset
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: imagenet-dataset
  namespace: cv-training
spec:
  accessModes: [ReadWriteMany]
  storageClassName: vast-production
  resources:
    requests:
      storage: 5Ti

# FabricAIJob - Elastic distributed training with dynamic scaling
# Starts with 4 nodes but can elastically scale between 2 and 8 nodes based
# on cluster availability. Annotations configure the elastic scheduler behavior.
apiVersion: gryvia.io/v1
kind: FabricAIJob
metadata:
  name: llama-elastic-training
  namespace: ml-training
  annotations:
    # Elastic scheduling annotations - the scheduler uses these to dynamically
    # resize the job between minNodes and maxNodes based on cluster capacity
    gryvia.io/elastic: "true"
    gryvia.io/min-nodes: "2"       # Minimum nodes to start/continue training
    gryvia.io/max-nodes: "8"       # Maximum nodes when capacity is available
    gryvia.io/scale-policy: "gradual"  # gradual or immediate scaling
spec:
  type: training
  model: llama-7b

  # Initial request: 4 GPUs (1 per node initially, scales with node count)
  gpus: 4
  gpuType: H100
  network: rdma                          # RDMA required for distributed training
  storage: vast-fast

  image: nvcr.io/nvidia/pytorch:24.01-py3
  imagePullPolicy: IfNotPresent

  # Distributed training with elastic configuration
  distributed:
    enabled: true
    framework: pytorch
    nodes: 4                             # Initial node count (scales between 2-8)
    gpusPerNode: 4
    backend: nccl

  command: ["torchrun"]
  args:
    - "--nproc_per_node=4"
    - "--nnodes=2:8"                     # Elastic range: min 2, max 8 nodes
    - "--rdzv_backend=c10d"
    - "--rdzv_endpoint=elastic-rdzv:29400"
    - "--max_restarts=3"                 # Allow 3 restarts for elastic rescaling
    - "train_llama.py"
    - "--model=llama-7b"
    - "--checkpoint-dir=/checkpoints"
    - "--save-interval=500"              # Checkpoint every 500 steps for elasticity

  resources:
    requests:
      memory: "64Gi"
      cpu: "16"
    limits:
      memory: "128Gi"
      cpu: "32"

  priority: 50
  retryLimit: 3
  timeout: "72h"

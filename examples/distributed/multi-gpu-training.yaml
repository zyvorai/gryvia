apiVersion: gryvia.io/v1
kind: GryviaAIJob
metadata:
  name: distributed-llama-training
  namespace: default
spec:
  type: training
  model: llama-7b
  gpus: 16  # Total GPUs across all nodes
  gpuType: H100
  network: rdma
  storage: vast-fast

  image: nvcr.io/nvidia/pytorch:23.10-py3
  imagePullPolicy: IfNotPresent

  # Distributed training configuration
  distributed:
    enabled: true
    framework: pytorch
    nodes: 2
    gpusPerNode: 8
    backend: nccl

  command:
    - torchrun
    - --nnodes=2
    - --nproc_per_node=8
    - --master_addr=$(MASTER_ADDR)
    - --master_port=$(MASTER_PORT)
    - /workspace/train_llama.py

  env:
    - name: NCCL_DEBUG
      value: "INFO"
    - name: NCCL_IB_DISABLE
      value: "0"
    - name: NCCL_NET_GDR_LEVEL
      value: "5"
    - name: NCCL_SOCKET_IFNAME
      value: "eth0"

  volumeMounts:
    - name: data
      mountPath: /data
    - name: checkpoints
      mountPath: /checkpoints

  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: training-data
    - name: checkpoints
      persistentVolumeClaim:
        claimName: model-checkpoints

  resources:
    requests:
      memory: "256Gi"
      cpu: "32"
    limits:
      memory: "512Gi"
      cpu: "64"

  priority: 90
  retryLimit: 3
  timeout: "72h"

  nodeSelector:
    gryvia.io/interconnect: "NVSwitch"

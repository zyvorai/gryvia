apiVersion: gryvia.io/v1alpha1
kind: GryviaStorage
metadata:
  name: ddn-exascaler
spec:
  backend: ddn
  endpoint: ddn-mgmt.example.com
  capacity: 1Pi
  credentials:
    secretName: ddn-credentials
    secretNamespace: gryvia-system
  mountOptions:
    - "rw"
    - "flock"
    - "localflock"
  storageClass:
    name: ddn-exascaler
    parameters:
      filesystemName: lustre-fs1
      mgsNodes: mgs1.example.com,mgs2.example.com
      csiDriverVersion: "v2.3.0"
---
apiVersion: v1
kind: Secret
metadata:
  name: ddn-credentials
  namespace: gryvia-system
type: Opaque
stringData:
  api-key: your-api-key-here

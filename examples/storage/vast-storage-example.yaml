apiVersion: kubefabric.ai/v1
kind: FabricStorage
metadata:
  name: vast-production
spec:
  backendType: vast
  endpoint: vast-mgmt.example.com
  capacity: 100Ti
  nodeSelector:
    kubefabric.ai/storage: "true"
  credentials:
    secretName: vast-credentials
    secretNamespace: kubefabric-system
  config:
    vipPool: "10.0.0.0/24"
    mountOptions:
      - "rw"
      - "relatime"
      - "vers=3"
    csiDriverVersion: "latest"
---
apiVersion: v1
kind: Secret
metadata:
  name: vast-credentials
  namespace: kubefabric-system
type: Opaque
stringData:
  username: admin
  password: changeme
---
# Example PVC using VAST storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: training-data
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: vast-production
  resources:
    requests:
      storage: 1Ti

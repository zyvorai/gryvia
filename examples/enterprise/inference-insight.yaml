# GryviaInferenceInsight - Latency breakdown analysis for inference endpoints
# Provides per-phase latency measurements (DNS, TCP, TLS, GPU queue, GPU exec,
# postprocess) to identify bottlenecks in the serving pipeline.
apiVersion: gryvia.io/v1
kind: GryviaInferenceInsight
metadata:
  name: llm-serving-latency
  namespace: ml-serving
spec:
  # Name of the GryviaInferenceService to analyze
  targetService: llama-70b-serving

  # Rolling window for latency percentile computation
  analysisWindow: "5m"

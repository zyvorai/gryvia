apiVersion: v1
kind: ConfigMap
metadata:
  name: gryvia-gpu-smoke
  namespace: gryvia-system
data:
  run.sh: |
    #!/bin/sh
    set -eu
    out=/results/gpu-validation.txt
    {
      echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      echo "node=${NODE_NAME:-unknown}"
      echo "--- nvidia-smi ---"
      nvidia-smi -L || echo "nvidia-smi failed"
      echo "--- cuda ---"
      nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader || true
    } > "$out"
    cat "$out"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gryvia-gpu-smoke
  namespace: gryvia-system
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: nvidia/cuda:12.4.1-base-ubuntu22.04
          command: ["sh", "/opt/gryvia/run.sh"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: script
              mountPath: /opt/gryvia
            - name: results
              mountPath: /results
      volumes:
        - name: script
          configMap:
            name: gryvia-gpu-smoke
            defaultMode: 0755
        - name: results
          emptyDir: {}

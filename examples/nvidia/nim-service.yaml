# Requires: helm --set nvidiaNim.enabled=true and a Secret ngc-api with NGC_API_KEY (the chart creates it from
# nvidiaNim.ngcApiKey). The image pull secret ngc-secret is NOT created by the chart:
#   kubectl -n <ns> create secret docker-registry ngc-secret --docker-server=nvcr.io \
#     --docker-username='$oauthtoken' --docker-password="$NGC_API_KEY"
# Pin gpus to a MIG slice or a full GPU. Image tag is an example; use the NIM you license.
apiVersion: apps.nvidia.com/v1alpha1
kind: NIMService
metadata:
  name: llama-8b
spec:
  image:
    repository: nvcr.io/nim/meta/llama-3.1-8b-instruct
    tag: latest
    pullPolicy: IfNotPresent
    pullSecrets:
      - ngc-secret
  authSecret: ngc-api
  storage:
    pvc:
      create: true
      size: 50Gi
  replicas: 1
  resources:
    limits:
      nvidia.com/gpu: 1
  expose:
    service:
      type: ClusterIP
      port: 8000

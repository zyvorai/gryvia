# Example: Organization-Level Quota
apiVersion: gryvia.io/v1
kind: GryviaQuotaPolicy
metadata:
  name: org-quota
spec:
  scope:
    type: organization
    name: acme-corp

  hierarchy:
    enabled: true
    allowChildren: true

  limits:
    gpu:
      hoursPerMonth: 100000
      concurrent: 512
      byType:
        H100:
          count: 128
          hoursPerMonth: 25000
        A100-80G:
          count: 256
          hoursPerMonth: 50000
        V100:
          count: 128
          hoursPerMonth: 25000

    cost:
      monthlyBudget: 500000
      quarterlyBudget: 1500000
      annualBudget: 6000000

    storage:
      totalGB: 500000

    jobs:
      concurrent: 1000
      perMonth: 10000

  allocation:
    strategy: weighted
    borrowingEnabled: true
    maxBorrowPercentage: 20

  enforcement:
    type: hard
    onExceeded: block
    allowBurst: true
    burstLimit: 10

  alerts:
    enabled: true
    thresholds: [75, 85, 95, 100]
    channels: [email, slack]
    recipients:
      - cto@company.com
      - finance@company.com
---
# Example: Division-Level Quota (Child of Organization)
apiVersion: gryvia.io/v1
kind: GryviaQuotaPolicy
metadata:
  name: ai-division-quota
spec:
  scope:
    type: division
    name: ai-division

  hierarchy:
    enabled: true
    parentRef: org-quota
    allowChildren: true

  limits:
    gpu:
      hoursPerMonth: 60000  # 60% of org quota
      concurrent: 300
      byType:
        H100:
          count: 64
        A100-80G:
          count: 160
        V100:
          count: 76

    cost:
      monthlyBudget: 300000

  allocation:
    strategy: weighted
    weights:
      ml-research: 40
      product-ml: 40
      data-science: 20

---
# Example: Team-Level Quota (Child of Division)
apiVersion: gryvia.io/v1
kind: GryviaQuotaPolicy
metadata:
  name: ml-research-quota
spec:
  scope:
    type: team
    name: ml-research

  hierarchy:
    enabled: true
    parentRef: ai-division-quota
    allowChildren: false

  limits:
    gpu:
      hoursPerMonth: 24000  # 40% of division quota
      concurrent: 120
      byType:
        H100:
          count: 32
        A100-80G:
          count: 64
        V100:
          count: 24

    cost:
      monthlyBudget: 120000
      perJobLimit: 10000

    storage:
      totalGB: 100000
      byClass:
        fast-nvme: 50000
        standard: 50000

    jobs:
      concurrent: 50
      perDay: 200
      perMonth: 4000

  enforcement:
    type: hard
    onExceeded: queue
    gracePeriod: 2h

  timeBased:
    enabled: true
    schedules:
      - name: business-hours
        window:
          daysOfWeek: [Mon, Tue, Wed, Thu, Fri]
          startTime: "09:00"
          endTime: "18:00"
        multiplier: 1.0

      - name: off-hours
        window:
          daysOfWeek: [Mon, Tue, Wed, Thu, Fri]
          startTime: "18:00"
          endTime: "09:00"
        multiplier: 1.5  # 50% more quota during off-hours

      - name: weekends
        window:
          daysOfWeek: [Sat, Sun]
          startTime: "00:00"
          endTime: "23:59"
        multiplier: 2.0  # Double quota on weekends

  alerts:
    enabled: true
    thresholds: [80, 90, 95]
    channels: [email, slack]
    recipients:
      - ml-research-lead@company.com
---
# Example: User-Level Quota
apiVersion: gryvia.io/v1
kind: GryviaQuotaPolicy
metadata:
  name: alice-quota
spec:
  scope:
    type: user
    name: alice

  hierarchy:
    enabled: true
    parentRef: ml-research-quota

  limits:
    gpu:
      hoursPerMonth: 2000
      concurrent: 16
      byType:
        A100-80G:
          count: 16

    cost:
      monthlyBudget: 10000
      perJobLimit: 2000

    storage:
      totalGB: 10000

    jobs:
      concurrent: 10
      perDay: 50

  enforcement:
    type: soft
    onExceeded: notify
    allowBurst: true
    burstLimit: 20

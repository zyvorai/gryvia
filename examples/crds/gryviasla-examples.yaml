      recipients:
        - dev-team@company.com
---
# Example: Job with SLA
apiVersion: gryvia.io/v1alpha1
kind: GryviaAIJob
metadata:
  name: production-inference
spec:
  type: inference
  # Covered by the production-platinum GryviaSLA (see above)

  gpus: 8
  gpuType: H100

  # SLA requirements enforced
  # - Max 5 minute queue time
  # - Guaranteed H100 GPUs
  # - Auto-retry on failure
  # - 24/7 support

  image: vllm/vllm:v0.6.6
  command: ["python", "-m", "vllm.entrypoints.api_server"]
---
# SLA Status Example
apiVersion: gryvia.io/v1alpha1
kind: GryviaSLA
metadata:
  name: production-platinum
status:
  compliance:
    current: 99.95
    trend: stable
    lastMonth: 99.92

  metrics:
    avgQueueTime: 2m30s
    p95QueueTime: 4m45s
    p99QueueTime: 4m58s
    uptime: 99.95
    breaches: 1

  breaches:
    - timestamp: "2024-01-15T10:30:00Z"
      type: queue-time-exceeded
      severity: medium
      duration: 2m  # Queue time was 7m instead of 5m
      compensated: true

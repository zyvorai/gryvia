# Example: Platinum SLA (Production)
apiVersion: gryvia.io/v1alpha1
kind: GryviaSLA
metadata:
  name: production-platinum
spec:
  tier: platinum

  scope:
    type: job-type
    name: production

  performance:
    maxQueueTime: 5m
    guaranteedStart: true
    minThroughput:
      value: 1000
      unit: requests/sec

  availability:
    uptime: 99.99  # Four nines
    maxDowntimeMinutes: 4.38  # Per month
    maintenanceWindows:
      - dayOfWeek: Sunday
        startTime: "02:00"
        duration: "2h"

  resources:
    guaranteedGPUTypes:
      - H100
      - A100-80G
    reservedCapacity:
      gpuCount: 64
      always: true
    fallbackAllowed: false

  failureHandling:
    autoRetry: true
    maxRetries: 5
    compensation:
      enabled: true
      type: credit
      percentage: 100  # 100% credit for SLA breach

  support:
    responseTime: 15m
    channels: [slack, pagerduty, phone]
    businessHours: false  # 24/7 support

  monitoring:
    metricsRetention: 1y
    reports:
      frequency: weekly
      recipients:
        - production-team@company.com
        - sre-team@company.com
---
# Example: Gold SLA (Research)
apiVersion: gryvia.io/v1alpha1
kind: GryviaSLA
metadata:
  name: research-gold
spec:
  tier: gold

  scope:
    type: team
    name: ml-research

  performance:
    maxQueueTime: 30m
    guaranteedStart: true

  availability:
    uptime: 99.9  # Three nines
    maxDowntimeMinutes: 43.2  # Per month

  resources:
    guaranteedGPUTypes:
      - A100-80G
      - A100-40G
    fallbackAllowed: true

  failureHandling:
    autoRetry: true
    maxRetries: 3
    compensation:
      enabled: true
      type: priority-boost
      percentage: 50

  support:
    responseTime: 4h
    channels: [email, slack]
    businessHours: true

  monitoring:
    metricsRetention: 90d
    reports:
      frequency: monthly
      recipients:
        - ml-team-lead@company.com
---
# Example: Silver SLA (Development)
apiVersion: gryvia.io/v1alpha1
kind: GryviaSLA
metadata:
  name: dev-silver
spec:
  tier: silver

  scope:
    type: team
    name: dev-team

  performance:
    maxQueueTime: 2h
    guaranteedStart: false

  availability:
    uptime: 99.0
    maxDowntimeMinutes: 432  # Per month

  resources:
    guaranteedGPUTypes:
      - T4
      - V100

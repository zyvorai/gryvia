# Example: Model Accuracy Metric
apiVersion: gryvia.io/v1alpha1
kind: GryviaMetric
metadata:
  name: model-accuracy
spec:
  name: model-accuracy
  description: "Model accuracy on validation set"
  type: gauge
  unit: "percent"

  source:
    type: job-output
    jobOutput:
      file: metrics.json
      jsonPath: $.validation.accuracy

  thresholds:
    warning:
      min: 85.0  # Warn if accuracy < 85%
    critical:
      min: 80.0  # Critical if < 80%
    actions:
      - alert
      - notify

  visualization:
    format: line

  labels:
    category: performance
    framework: pytorch
---
# Example: Throughput Metric
apiVersion: gryvia.io/v1alpha1
kind: GryviaMetric
metadata:
  name: inference-throughput
spec:
  name: inference-throughput
  description: "Inference throughput"
  type: gauge
  unit: "requests/sec"

  source:
    type: prometheus
    prometheus:
      query: rate(http_requests_total[5m])
      interval: 30s

  thresholds:
    warning:
      min: 1000  # Warn if < 1000 req/s
    critical:
      min: 500
    actions:
      - alert
      - scale-resources

  visualization:
    format: line
---
# Example: GPU Memory Usage
apiVersion: gryvia.io/v1alpha1
kind: GryviaMetric
metadata:
  name: gpu-memory-utilization
spec:
  name: gpu-memory-utilization
  description: "GPU memory usage"
  type: gauge
  unit: "percent"

  source:
    type: prometheus
    prometheus:
      query: nvidia_gpu_memory_used_bytes / nvidia_gpu_memory_total_bytes * 100
      interval: 10s

  thresholds:
    warning:
      max: 95  # Warn if > 95%
    critical:
      max: 98
    actions:
      - alert

  visualization:
    format: gauge
---
# Example: Training Loss
apiVersion: gryvia.io/v1alpha1
kind: GryviaMetric
metadata:
  name: training-loss
spec:
  name: training-loss
  description: "Training loss"
  type: gauge
  unit: "loss"

  source:
    type: job-output
    jobOutput:
      pattern: "Loss: (\\d+\\.\\d+)"  # Regex to extract from logs

  thresholds:
    warning:
      max: 1.0  # Warn if loss > 1.0 (not converging)

  visualization:
    format: line

  retention: "90d"  # Keep for 90 days
---
# Example: Custom Script Metric
apiVersion: gryvia.io/v1alpha1
kind: GryviaMetric
metadata:
  name: data-freshness
spec:
  name: data-freshness
  description: "Age of training data"
  type: gauge
  unit: "hours"

  source:
    type: script
    script:
      command:
        - bash
        - -c
        - |
          # Calculate hours since data was updated
          stat -c %Y /data/latest | xargs -I {} echo $(( ($(date +%s) - {}) / 3600 ))
      interval: 1h

  thresholds:
    warning:
      max: 24  # Warn if data > 24 hours old
    critical:
      max: 48
    actions:
      - alert
      - notify
---
# Example: Using Metrics in Job
apiVersion: gryvia.io/v1alpha1
kind: GryviaAIJob
metadata:
  name: training-with-metrics
spec:
  type: training

  # Metrics (model-accuracy, training-loss, ...) and their thresholds are declared
  # as GryviaMetric objects above; the job itself only describes the workload.

  gpus: 8
  gpuType: A100-80G

  image: nvcr.io/nvidia/pytorch:24.01-py3
  command: ["python", "train.py"]

# Demo data for evaluating Gryvia without GPUs. Every object below is fictional.
apiVersion: gryvia.io/v1
kind: GryviaGpuNode
metadata:
  name: demo-h100-1
spec:
  nodeName: demo-h100-1
  gpuType: H100
  gpuCount: 8
  memoryGB: 80
  interconnect: nvlink
  rdma: true
---
apiVersion: gryvia.io/v1
kind: GryviaGpuNode
metadata:
  name: demo-a100-1
spec:
  nodeName: demo-a100-1
  gpuType: A100-80G
  gpuCount: 4
  memoryGB: 80
  interconnect: nvlink
  rdma: false
---
apiVersion: gryvia.io/v1
kind: GryviaQuota
metadata:
  name: demo-team
spec:
  team: demo-team
  namespaces: [gryvia-system]
  priority: 50
  gpuQuota:
    maxGPUs: 8
    maxGPUsPerJob: 4
    maxRunningJobs: 4
    allowedGPUTypes: [H100, A100-80G]
  budget:
    monthlyBudget: 5000
    alertThreshold: 80
---
apiVersion: gryvia.io/v1
kind: GryviaAIJob
metadata:
  name: demo-train
  namespace: gryvia-system
  labels:
    gryvia.io/framework: pytorch
spec:
  type: training
  image: busybox:1.36
  command: ["sleep", "3600"]
  gpus: 2
  gpuType: H100
  resources:
    requests: {cpu: "1", memory: 1Gi}

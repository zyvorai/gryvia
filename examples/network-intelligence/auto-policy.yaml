# GryviaAutoPolicy - Self-learning firewall that observes traffic and suggests policies
# Starts in learn mode for 10 minutes, observes traffic patterns in the target
# namespaces, then generates suggested network policies for review.
apiVersion: gryvia.io/v1
kind: GryviaAutoPolicy
metadata:
  name: production-auto-firewall
  namespace: gryvia-system
spec:
  # Operational mode: learn -> suggest -> enforce
  # "learn" passively observes traffic without blocking anything
  # "suggest" generates policy recommendations after learning
  # "enforce" applies learned policies (use with caution)
  mode: learn

  # Duration to observe traffic patterns before generating suggestions
  learningWindow: "10m"

  # Namespaces to monitor for traffic pattern discovery
  targetNamespaces:
    - production
    - staging

  # Services excluded from policy generation (e.g., monitoring agents)
  excludeServices:
    - kube-dns
    - metrics-server
    - node-exporter

  # Require human approval before moving from suggest to enforce
  approvalRequired: true

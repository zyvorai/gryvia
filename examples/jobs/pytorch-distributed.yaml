apiVersion: kubefabric.io/v1
kind: FabricAIJob
metadata:
  name: pytorch-distributed-training
  namespace: default
  labels:
    team: ml-research
    project: llama-training
    environment: production
spec:
  framework: pytorch

  # Distributed training configuration
  distributed:
    enabled: true
    strategy: ddp  # Distributed Data Parallel
    worldSize: 8   # Total number of GPUs across all nodes

  # Resource requirements
  resources:
    gpuType: H100
    gpuCount: 8    # 8 GPUs per pod
    memory: 512Gi
    cpu: 64

  # Container configuration
  image: nvcr.io/nvidia/pytorch:24.01-py3

  command:
    - torchrun
    - --nnodes=1
    - --nproc_per_node=8
    - --rdzv_backend=c10d
    - --rdzv_endpoint=localhost:29400
    - train.py
    - --model=llama-70b
    - --batch-size=4
    - --gradient-accumulation-steps=8
    - --learning-rate=3e-4
    - --max-steps=10000
    - --save-steps=1000
    - --fp16
    - --gradient-checkpointing

  # Environment variables
  env:
    - name: NCCL_DEBUG
      value: INFO
    - name: NCCL_IB_DISABLE
      value: "0"
    - name: NCCL_NET_GDR_LEVEL
      value: "5"
    - name: NCCL_SOCKET_IFNAME
      value: eth0
    - name: PYTORCH_CUDA_ALLOC_CONF
      value: "max_split_size_mb:512"
    - name: CUDA_DEVICE_ORDER
      value: PCI_BUS_ID
    - name: OMP_NUM_THREADS
      value: "8"

  # Volume mounts for datasets and checkpoints
  volumeMounts:
    - name: datasets
      mountPath: /datasets
    - name: checkpoints
      mountPath: /checkpoints
    - name: logs
      mountPath: /logs

  volumes:
    - name: datasets
      persistentVolumeClaim:
        claimName: vast-datasets-pvc
    - name: checkpoints
      persistentVolumeClaim:
        claimName: vast-checkpoints-pvc
    - name: logs
      emptyDir: {}

  # Retry policy
  restartPolicy: OnFailure
  backoffLimit: 3

  # Resource limits
  limits:
    nvidia.com/gpu: "8"

  # Node selection
  nodeSelector:
    kubefabric.io/gpu-type: H100
    kubefabric.io/rdma-enabled: "true"

  # Tolerations
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

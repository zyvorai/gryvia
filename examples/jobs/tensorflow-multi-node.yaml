apiVersion: kubefabric.ai/v1
kind: FabricAIJob
metadata:
  name: tensorflow-multi-node-training
  namespace: default
  labels:
    team: computer-vision
    project: object-detection
spec:
  framework: tensorflow

  # Distributed configuration
  distributed:
    enabled: true
    strategy: parameter-server
    worldSize: 16  # 4 nodes × 4 GPUs

  resources:
    gpuType: A100-80G
    gpuCount: 4
    memory: 256Gi
    cpu: 32

  image: nvcr.io/nvidia/tensorflow:24.01-tf2-py3

  command:
    - python
    - -m
    - tf_distributed_training
    - --num_gpus=4
    - --model=efficientdet-d7
    - --dataset=coco2017
    - --batch_size=16
    - --epochs=100
    - --learning_rate=0.08
    - --warmup_epochs=5

  env:
    - name: TF_FORCE_GPU_ALLOW_GROWTH
      value: "true"
    - name: TF_GPU_THREAD_MODE
      value: gpu_private
    - name: TF_GPU_THREAD_COUNT
      value: "2"
    - name: TF_CPP_MIN_LOG_LEVEL
      value: "2"
    - name: NCCL_DEBUG
      value: WARN

  volumeMounts:
    - name: data
      mountPath: /data
    - name: models
      mountPath: /models

  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: coco-dataset-pvc
    - name: models
      persistentVolumeClaim:
        claimName: model-registry-pvc
